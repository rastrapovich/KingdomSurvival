name: One-shot Gogol additions

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-gogol-additions.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure remote main has not moved
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Apply approved Gogol additions
        run: python3 ProjectDocs/gogol_additions_once.py

      - name: Remove one-shot helpers
        run: |
          rm -f .github/workflows/one-shot-gogol-additions.yml
          rm -f ProjectDocs/gogol_additions_once.py

      - name: Validate final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          printf '%s\n' \
            '.github/workflows/one-shot-gogol-additions.yml' \
            'ProjectDocs/BESTIARY.md' \
            'ProjectDocs/DEVELOPMENT_STATUS.md' \
            'ProjectDocs/GOGOL_ADAPTATION.md' \
            'ProjectDocs/NARRATIVE.md' \
            'ProjectDocs/gogol_additions_once.py' | sort > /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: extend Gogol quest adaptations'
          git push origin HEAD:main
