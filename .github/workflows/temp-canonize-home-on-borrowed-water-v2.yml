name: One-shot narrative canon sync v2

on:
  push:
    branches:
      - temp/canonize-home-on-borrowed-water-20260906
    paths:
      - .github/workflows/temp-canonize-home-on-borrowed-water-v2.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: temp/canonize-home-on-borrowed-water-20260906
          fetch-depth: 0

      - name: Preserve patch script and switch to exact main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/temp-canonize-home-on-borrowed-water.py /tmp/canonize.py
          git fetch origin main
          test "$(git rev-parse origin/main)" = "88ddf97d46addd65489ee83f0053ccfbb5967c11"
          git checkout -B main origin/main

      - name: Patch and validate documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/canonize.py
          git diff --check
          printf '%s\n' \
            ProjectDocs/DEVELOPMENT_STATUS.md \
            ProjectDocs/LORE.md \
            ProjectDocs/NARRATIVE.md | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          test "$(find . -maxdepth 1 -type f -name 'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v*.md' | wc -l)" -eq 1
          grep -q 'Дом на чужой воде' ProjectDocs/NARRATIVE.md
          grep -q 'Забытое внешнее основание благополучия' ProjectDocs/LORE.md
          grep -q 'Канонизация завязки «Дом на чужой воде»' ProjectDocs/DEVELOPMENT_STATUS.md

      - name: Commit and push main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rastrapovich"
          git config user.email "125567783+rastrapovich@users.noreply.github.com"
          git add ProjectDocs/NARRATIVE.md ProjectDocs/LORE.md ProjectDocs/DEVELOPMENT_STATUS.md
          git commit -m "docs: canonize Home on Borrowed Water opening"
          git push origin HEAD:main
