name: Fix Baltic-Carpathian appendix reference
on:
  push:
    branches: ['docs/baltic-carpathian-integration-20260905']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/baltic-carpathian-integration-20260905
          fetch-depth: 0
      - name: Fix stale section reference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ProjectDocs/LORE.md')
          s = p.read_text(encoding='utf-8')
          old = '## BC-L12. Граница решения\n\nРаздел 66 не утверждает:'
          new = '## BC-L12. Граница решения [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]\n\nЭтот пограничный слой не утверждает:'
          if old not in s:
              raise SystemExit('expected stale reference not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/_fix_bc_reference.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/LORE.md .github/workflows/_fix_bc_reference.yml
          git commit -m "docs: fix Baltic-Carpathian appendix reference"
          git push origin HEAD:docs/baltic-carpathian-integration-20260905
