# Приложение 06.09.2026 — стоянка как часть локального порядка [УТВЕРЖДЕНО]

Источник проектирования: **[D&D / DMG + KINGDOM SURVIVAL]**. Это лорная граница для утверждённой лагерной модели из `DMG_ADAPTATION.md`, а не новая универсальная магия ночёвки.

## 1. Стоянка не создаёт «нейтральный пузырь»

Когда люди ночуют в лесу, у воды, возле дороги, кургана, пустого дома, пасеки, поселения или иного значимого места, они остаются внутри **реального локуса, времени, права и отношений этой территории**.

Поэтому огонь, шум, рубка материала для укрытия, использование воды, пересечение границы, сон в чужом дворе или присутствие ночью могут иметь значение **только если оно уже следует из конкретного местного обычая, права, состояния мира или объективного правила места/сущности**.

Сам факт «разбили лагерь» не активирует универсальную магию.

## 2. Удобство, безопасность и право — разные вещи

Сухая и защищённая точка может быть спорной, чужой или мифологически опасной. Неприятное место может быть безопаснее именно потому, что люди и сущности его избегают по другой причине.

Для значимой стоянки лор отвечает на вопросы:

- кто считает место своим;
- как им обычно пользуются;
- можно ли здесь ночевать, разводить огонь и брать воду;
- что люди считают опасным временем или действием;
- что из этого является `[ВЕРОВАНИЕ]`, а что объективно подтверждено;
- что изменилось из-за текущего состояния региона.

## 3. Безопасное место может стать знанием региона

Охотничья хижина, знакомый двор, пасека, пещера или иное убежище может стать известным игроку местом более предсказуемого отдыха. Такая безопасность может зависеть от сезона, хозяина, отношения, соблюдения правила и текущего Narrative State и не обязана быть постоянной.

Это географическое/социальное знание, а не строительство постоянной походной базы.

## 4. Время мира продолжается во время отдыха

Ночёвка и отдых не приостанавливают погоду, движение людей, хозяйственные процессы, преследование, распространение слухов, состояние дороги, воды, Дома или активного конфликта, если соответствующий процесс причинно уже существует.

## 5. Граница решения

Не утверждаются:

- единый ночной запрет для всего мира;
- универсальная опасность огня, воды или сна;
- обязательная сущность возле каждой стоянки;
- системная долговременная физическая память каждого старого лагеря;
- маршрутные тайники/кладовые игрока;
- регулярное ручное назначение дозорных как лорная обязанность.

Конкретный лагерный риск всегда выводится из **конкретного места, времени, людей, состояния мира и уже утверждённых правил**.
