## 26.3. «Дом на чужой воде» — каноническая завязка [СЮЖЕТНЫЙ КАНОН][KINGDOM SURVIVAL + THE WITCHER 3]

`«Дом на чужой воде»` утверждён как **основная завязка кампании**. Конструкция связывает нормальную жизнь Дома, первое самостоятельное решение игрока, хозяйственный кризис, расследование, выход на глобальную карту и раскрытие забытой взаимозависимости.

### Каноническая последовательность

1. **До катастрофы игра показывает обычную жизнь Дома.** Игрок должен увидеть людей, работу, привычные места и человеческий ритм до серьёзного давления. Начало строится без обязательной романтической линии и без сюжета о возлюбленной/редком цветке.
2. **Дом уже испытывает лёгкое хозяйственное давление, но не находится в апокалиптическом состоянии.** Запас прочности уменьшен, поэтому ошибка или дорогой ремонт имеют вес; старт не начинается с тотального голода, массового мора или развала поселения.
3. **Паводок повреждает плотину.** Это непосредственная стартовая катастрофа.
4. **Первое настоящее решение игрока касается ремонта:** использовать старый, проверенный и более дорогой способ либо выбрать новое рациональное решение/изменение конструкции.
5. **Именно выбор игрока определяет форму первых последствий.** Разные ранние симптомы должны причинно следовать из принятого решения; точная матрица двух ветвей пока не утверждена.
6. **Последствия запускают расследование вокруг воды и хозяйства.** Канонические слои материала: изменения рыбы, скота и работы мельницы; старый предмет; противоречивые человеческие рассказы; местная история/версия об «утопленнице». Расследование сопоставляет физические, человеческие и мифологические улики.
7. **Для проверки происходящего герой впервые выходит дальше привычных маршрутов вдоль речной системы.** Завязка тем самым открывает путешествие, карту и исследование неизвестного не отдельным учебным заданием, а следствием проблемы Дома.
8. **Герой обнаруживает за пределами привычного мира других живых людей.** Конкретное поселение и его название пока не утверждены. Главное раскрытие: Дом, считавший себя самодостаточным, в действительности зависит от системы, которую его предки создавали и/или поддерживали совместно с другими людьми.
9. **Раскрывается старое человеческое соглашение/обязательство, связанное с этой общей системой.** Его первоначальный смысл утрачен; сохранилась форма обычая или суеверия; позднее объяснение искажает первоначальную функцию; современное вмешательство снова делает старую причинность значимой.
10. Завязка должна позволить игроку сформулировать причинность не как `случилось ещё одно несчастье`, а как **«это новое состояние возникло в том числе потому, что я выбрал такой способ ремонта»**.

### Что намеренно остаётся открытым

- конкретное соседнее/нижнее поселение, его имя, жители и устройство;
- точные условия старого соглашения, распределение прав и обязанностей;
- конкретный сохранившийся обычай/суеверие и его современное объяснение;
- точная инженерная разница между двумя вариантами ремонта;
- точное распределение первых симптомов между вариантами;
- объективная природа водных аномалий;
- объективная природа, личность и роль «утопленницы»;
- был ли старый договор только человеческим и хозяйственным либо включал отдельное сверхъестественное отношение;
- конкретные NPC, диалоги, проверки, финальное решение водного конфликта и место этой линии в большом раскрытии кампании.

### Граница решения

Канонизация завязки **не утверждает** возлюбленную, романтическую мотивацию или поиск редкого красного цветка из другого рабочего варианта. Эти элементы не входят в старт игры и не должны восстанавливаться как обязательная часть завязки без нового решения пользователя.

Сюжетная конструкция опирается прежде всего на собственную причинную модель `[KINGDOM SURVIVAL]` и утверждённый расследовательский инструментарий `[THE WITCHER 3]`: `наблюдаемые последствия → несколько классов улик → конкурирующие версии → более глубокая причинность → новое состояние мира`.

