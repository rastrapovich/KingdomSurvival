name: One-shot Federowski docs sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-federowski-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate approved Federowski principles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def append_once(path: str, marker: str, block: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  return False
              text = text.rstrip() + "\n\n---\n\n" + block.strip() + "\n"
              p.write_text(text, encoding='utf-8')
              return True

          lore = r'''
# Приложение F. Федеровский — региональные верования и хозяйственная наблюдательность [УТВЕРЖДЕНО — ПРИНЦИП]

Источник: Michał Federowski, *Lud białoruski na Rusi Litewskiej*, t. I (1897). Подробный разбор: `ProjectDocs/FEDEROWSKI_ETHNOGRAPHIC_ADAPTATION.md`.

Материал используется как источниковедческая база пограничного западнобелорусского/литовско-русского культурного слоя, **не** как утверждение, что игровой мир буквально является этим историческим регионом. Главное правило сохраняется: `[ВЕРОВАНИЕ] ≠ [ОБЪЕКТИВНО]`.

## F.1. Региональная вариативность и народные названия [УТВЕРЖДЕНО — ПРИНЦИП]

- Одно народное имя может обозначать разные явления, сущности и человеческие объяснения; название само по себе не устанавливает объективный вид существа.
- Соседние поселения, семьи и профессии могут по-разному объяснять один и тот же феномен.
- Объективная причина может не совпадать ни с одной местной версией.
- Фольклорная терминология прежде всего описывает человеческую картину мира; объективную таксономию задавать только там, где она нужна конкретной истории и отдельно утверждена.

## F.2. Смерть, вернувшийся умерший и память места [УТВЕРЖДЕНО — ПРИНЦИП]

- Возвращение умершего не делает его автоматически стандартной нежитью и не предполагает автоматической агрессии.
- Проверять обстоятельства смерти, погребальный долг, незавершённые отношения, память семьи и состояние конкретного места.
- Смерть у воды, дороги, переправы или другого значимого локуса может изменить социальное использование места даже без доказанного сверхъестественного эффекта.
- Формула допустимого последствия: `смерть → память/верование → запрет или обычай → изменение маршрута/хозяйства/отношений → новый конфликт`.

## F.3. Вода и русалочные версии [УТВЕРЖДЕНО — ПРИНЦИП / FOLKLORE]

Связь русалок с умершими девушками, детьми и другими умершими разрешена как **региональное верование**, а не как единая объективная формула происхождения. При разработке конкретной воды или поселения фиксировать, кто именно верит в эту версию, почему она возникла и как она меняет поведение людей.

## F.4. Дом и хозяйственные пространства [УТВЕРЖДЕНО — ПРИНЦИП / FOLKLORE]

- Не использовать модель «каждому зданию положен свой дух».
- Предпочтительна причинность `конкретное хозяйство → локальная история → обычай → признаки нарушения → народное объяснение`.
- Новый дом может иметь местные правила выбора места, начала строительства, первого огня, порога и заселения; пока объективная причина не установлена отдельно, это `[ВЕРОВАНИЕ]`.
- Домашний уж или змея не являются автоматическим врагом или фамильяром. Разрешены семейные поверья, где конкретную змею не убивают, кормят или связывают с благополучием дома, без утверждения универсальной магической природы.

## F.5. Пчёлы, пастухи и профессиональное знание [УТВЕРЖДЕНО — ПРИНЦИП]

- Пчеловодство используется не только как ресурс, но и как источник традиций, наблюдений и признаков состояния места. Необычное поведение пчёл может быть уликой, но не доказательством сверхъестественного.
- Пастух — естественный профессиональный свидетель границы поселения и дикой территории. Аналогичный принцип применим к охотнику, пчеловоду, мельнику, перевозчику и другим людям, которые регулярно наблюдают одну территорию.
- Их знание не делает их магами: ценность строится на повторяемом опыте, памяти локальных изменений и способности заметить отклонение раньше остальных.
'''

          bestiary = r'''
# Приложение F. Федеровский — утверждённая интеграция в бестиарий

Источник: Michał Federowski, *Lud białoruski na Rusi Litewskiej*, t. I (1897). Подробный источниковедческий разбор: `ProjectDocs/FEDEROWSKI_ETHNOGRAPHIC_ADAPTATION.md`.

## F.1. Народное имя не равно объективному виду [УТВЕРЖДЕНО / FOLKLORE]

Не создавать единого «чёрта» или иной народной категории как стандартную расу только потому, что одно слово повторяется в поверьях. Рабочая формула:

`народное имя → наблюдаемые признаки → несколько версий → расследование → конкретная причина`.

Под одним названием могут скрываться разные сущности, явления, ошибки восприятия или человеческие действия.

## F.2. Дух или видение сначала существует как событие [УТВЕРЖДЕНО / FOLKLORE]

Ночная фигура, шаги, голос, встречный на дороге, чужое лицо или иное проявление не получают автоматической карточки существа до расследования. Это расширяет принцип «сначала следствие, потом объяснение».

## F.3. Антропоморфные и пограничные сущности [УТВЕРЖДЕНО / FOLKLORE]

Разрешён слой сущностей, почти неотличимых от людей. Если раскрытие строится на нечеловеческой природе персонажа, ранние сцены обязаны содержать честные, но не обязательно очевидные несостыковки, которые становятся понятны задним числом.

## F.4. Вернувшийся умерший — конкретный человек, а не класс нежити [УТВЕРЖДЕНО / FOLKLORE]

Для вернувшегося умершего проверять биографию, обстоятельства смерти, погребальный долг, незавершённое отношение, семью, конкретное место и цель возвращения. Агрессия и бой не являются ответом по умолчанию.

## F.5. Русалочный комплекс остаётся множественным [УТВЕРЖДЕНО — ПРИНЦИП / FOLKLORE]

Региональная версия может связывать русалку с умершей девушкой, ребёнком или другим умершим, но такая версия не превращается в универсальную биологию вида. Сначала фиксируются регион, конкретная смерть или верование, место, свидетели и последствия для людей.

## F.6. Хозяйственные духи не являются обязательными NPC построек [УТВЕРЖДЕНО — ПРИНЦИП / FOLKLORE]

Для дома, двора, бани, гумна, пасеки и других пространств сначала проектировать хозяйственную историю, обычай и наблюдаемое нарушение. Сущность вводить только когда она действительно усиливает историю и имеет собственное правило.

## F.7. Ведьма входит через социальный и хозяйственный конфликт [УТВЕРЖДЕНО / FOLKLORE]

Фольклорная ведьма не определяется боевым списком заклинаний. Сильные входы в историю: болезнь, урожай, скот, соседский конфликт, лечение, необычное знание, обвинение, зависть, страх и экономический ущерб.

Народная «проверка на ведьму» не доказывает сверхъестественную природу человека. Она является уликой о верованиях общины, механизме подозрения, интересах обвинителей и распределении власти.

## F.8. Животные и хозяйство как система признаков [УТВЕРЖДЕНО — ПРИНЦИП]

Реакция животных считается полноценной уликой: скот избегает воды, собака не входит во двор, звери покидают лес, пчёлы бросают улей. Это наблюдаемый признак, но не автоматическое доказательство конкретной сущности.

Пастух, охотник, пчеловод, мельник и другие профессиональные свидетели особенно полезны потому, что способны сравнить необычное поведение с многолетней нормой конкретного места.

## F.9. Локальный способ воздействия не становится универсальной слабостью [УТВЕРЖДЕНО]

Обряд, соль, пища, слово, предмет, запрет, подношение или иное действие не распространяются автоматически на всех духов или на всю «нечисть». Для каждого конкретного случая отдельно фиксировать:

- что люди считают работающим;
- что наблюдалось на практике;
- что объективно работает;
- при каких условиях;
- какова цена или последствие;
- является ли правило свойством сущности, места, договора или человеческой традиции.
'''

          status = r'''
## Документальная интеграция Федеровского — 05.09.2026

Утверждён источниковедческий разбор Michał Federowski, *Lud białoruski na Rusi Litewskiej*, t. I (1897): `ProjectDocs/FEDEROWSKI_ETHNOGRAPHIC_ADAPTATION.md`.

В `LORE.md` интегрированы утверждённые принципы региональной вариативности, вернувшихся умерших и памяти места, русалочных верований, хозяйственных пространств, нового дома, домашней змеи, пчеловодства и профессиональных свидетелей.

В `BESTIARY.md` интегрированы правила народной таксономии, проявления до классификации, антропоморфных пограничных сущностей, возвращающихся умерших, русалочного комплекса, хозяйственных духов, фольклорной ведьмы, реакций животных и локальных способов воздействия на сущности.

Объективная метафизика не расширялась: поверья не превращены автоматически в факты мира, единая природа «чёрта» не вводилась, обязательные духи зданий не вводились, единое происхождение русалок не вводилось, универсальные магические слабости не вводились. Общий канон v1.25 не менялся. Код Unity не затрагивался; компиляция и игровые тесты для этой документальной правки не требуются.
'''

          changed = False
          changed |= append_once('ProjectDocs/LORE.md', '# Приложение F. Федеровский — региональные верования', lore)
          changed |= append_once('ProjectDocs/BESTIARY.md', '# Приложение F. Федеровский — утверждённая интеграция', bestiary)
          changed |= append_once('ProjectDocs/DEVELOPMENT_STATUS.md', '## Документальная интеграция Федеровского — 05.09.2026', status)

          print('changed=', changed)
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-federowski-sync.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/LORE.md ProjectDocs/BESTIARY.md ProjectDocs/DEVELOPMENT_STATUS.md .github || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: integrate Federowski lore and bestiary principles"
          git push origin HEAD:main
