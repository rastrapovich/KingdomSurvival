name: One-shot Kotsiubynsky docs sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-kotsiubynsky.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and apply approved payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          payload = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/one-shot-kotsiubynsky.yml"],
              text=True,
          )
          pattern = re.compile(
              r"^          cat <<'EOF' (>>|>) ([^\n]+)\n(.*?)^EOF$",
              re.MULTILINE | re.DOTALL,
          )
          matches = pattern.findall(payload)
          if len(matches) != 5:
              raise SystemExit(f"Expected 5 payload blocks, found {len(matches)}")

          for operator, raw_path, body in matches:
              path = Path(raw_path.strip())
              path.parent.mkdir(parents=True, exist_ok=True)
              mode = "a" if operator == ">>" else "w"
              with path.open(mode, encoding="utf-8", newline="") as handle:
                  handle.write(body)
                  if not body.endswith("\n"):
                      handle.write("\n")
          PY

      - name: Validate final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f ProjectDocs/KOTSIUBYNSKY_SHADOWS_ADAPTATION.md
          grep -q 'KOT-L1' ProjectDocs/LORE.md
          grep -q 'KOT-B4. Чугайстир' ProjectDocs/BESTIARY.md
          grep -q 'KOT-N5. «Живой огонь»' ProjectDocs/NARRATIVE.md
          grep -q '16 не утверждён' ProjectDocs/DEVELOPMENT_STATUS.md
          test "$(find . -maxdepth 1 -type f -name 'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v*.md' | wc -l)" -eq 1
          test -f KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_26.md

      - name: Commit final documentation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-kotsiubynsky.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/LORE.md ProjectDocs/BESTIARY.md ProjectDocs/NARRATIVE.md ProjectDocs/DEVELOPMENT_STATUS.md ProjectDocs/KOTSIUBYNSKY_SHADOWS_ADAPTATION.md
          git add -u .github/workflows/one-shot-kotsiubynsky.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "docs: integrate Kotsiubynsky Shadows decisions"
          git push origin HEAD:main
