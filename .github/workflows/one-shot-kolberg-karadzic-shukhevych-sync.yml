name: One-shot Kolberg Karadzic Shukhevych sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-kolberg-karadzic-shukhevych-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved folklore sync
        run: python3 ProjectDocs/kolberg_karadzic_shukhevych_sync_once.py

      - name: Remove one-shot helpers
        run: |
          rm -f .github/workflows/one-shot-kolberg-karadzic-shukhevych-sync.yml
          rm -f ProjectDocs/kolberg_karadzic_shukhevych_sync_once.py

      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: integrate Kolberg Karadzic Shukhevych folklore decisions"
          git push origin HEAD:main
