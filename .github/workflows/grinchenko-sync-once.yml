name: One-shot Grinchenko docs sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grinchenko-sync-once.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync approved source into living docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('ProjectDocs/GRINCHENKO_ETHNOGRAPHIC_ADAPTATION.md')
          lore_path = Path('ProjectDocs/LORE.md')
          bestiary_path = Path('ProjectDocs/BESTIARY.md')
          status_path = Path('ProjectDocs/DEVELOPMENT_STATUS.md')

          source = source_path.read_text(encoding='utf-8')
          lore = lore_path.read_text(encoding='utf-8')
          bestiary = bestiary_path.read_text(encoding='utf-8')

          matches = list(re.finditer(r'(?m)^## (\d+)\. (.+)$', source))
          items = []
          for i, m in enumerate(matches):
              start = m.start()
              end = matches[i + 1].start() if i + 1 < len(matches) else len(source)
              num = int(m.group(1))
              title = m.group(2).strip()
              body = source[m.end():end].strip()
              items.append((num, title, body))

          lore_marker = '# 61. Решения по Б. Д. Гринченко — локальный фольклор и бытовое сверхъестественное'
          if lore_marker not in lore:
              selected = [(n, t, b) for n, t, b in items if '`LORE.md`' in b]
              parts = [
                  '\n\n---\n\n' + lore_marker,
                  '',
                  'Источник: Б. Д. Гринченко — **«Этнографические материалы, собранные в Черниговской и соседних с ней губерниях»** (1895–1899).',
                  '',
                  'Полный утверждённый пакет из 28 пунктов хранится в `ProjectDocs/GRINCHENKO_ETHNOGRAPHIC_ADAPTATION.md`. Ниже находятся решения, относящиеся к устройству мира, верованиям, местам, человеческим отношениям и устной традиции. Источник приёма: **[ГРИНЧЕНКО + KINGDOM SURVIVAL]**.',
                  ''
              ]
              for n, title, body in selected:
                  clean = re.sub(r'\n\*\*Синхронизация:\*\*.*?(?=\n\n|\Z)', '', body, flags=re.S).strip()
                  parts.extend([f'## 61.{n}. {title}', '', clean, ''])
              parts.extend([
                  '## 61.29. Граница решений по Гринченко [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]',
                  '',
                  'Этот слой не создаёт единую официальную демонологию, не делает любую ведьму реальной колдуньей, не превращает любое плохое место в логово монстра, не делает любую пословицу буквальной истиной и не устанавливает универсальную сверхъестественную причину природных бедствий.',
                  '',
                  'Главная формула слоя: **локальный рассказ → противоречивые свидетели → повторяющаяся деталь → бытовое/социальное последствие → проверка места, человека и правила → объективная причина конкретного случая.**',
                  ''
              ])
              lore += '\n'.join(parts)

              anchor = '| 05.09.2026 | По П. П. Чубинскому утверждены принципы календаря как карты риска, региональных версий одного правила, повреждённой памяти обрядов, социального и погребального порядка, обычного права, межи, родства, переходных состояний, неоднозначной защиты и передачи знания через бытовой фольклор. | УТВЕРЖДЕНО |'
              row = '| 05.09.2026 | По Б. Д. Гринченко утверждены локальные противоречивые свидетельства, животные-посредники, ведьма как социальная категория, бытовая жизнь нечеловеческого порядка, аномальные места без обязательного монстра, ремесленники-посредники и передача правил через пословицы, загадки и детский фольклор. | УТВЕРЖДЕНО |'
              if anchor in lore and row not in lore:
                  lore = lore.replace(anchor, anchor + '\n' + row, 1)
              lore_path.write_text(lore, encoding='utf-8')

          bestiary_marker = '# 30. Решения по Б. Д. Гринченко — свидетельства, признаки и культурное существование сущности'
          if bestiary_marker not in bestiary:
              selected = [(n, t, b) for n, t, b in items if '`BESTIARY.md`' in b]
              parts = [
                  '\n\n---\n\n' + bestiary_marker,
                  '',
                  'Источник: Б. Д. Гринченко — **«Этнографические материалы, собранные в Черниговской и соседних с ней губерниях»** (1895–1899).',
                  '',
                  'Полный утверждённый пакет из 28 пунктов хранится в `ProjectDocs/GRINCHENKO_ETHNOGRAPHIC_ADAPTATION.md`. Здесь находятся правила, относящиеся к признакам, поведению, взаимодействиям и проектированию значимых сущностей. Источник приёма: **[ГРИНЧЕНКО + KINGDOM SURVIVAL]**.',
                  ''
              ]
              for n, title, body in selected:
                  clean = re.sub(r'\n\*\*Синхронизация:\*\*.*?(?=\n\n|\Z)', '', body, flags=re.S).strip()
                  parts.extend([f'## 30.{n}. {title}', '', clean, ''])
              parts.extend([
                  '## 30.29. Обязательный фольклорный блок крупной сущности [УТВЕРЖДЕНО — РЕКОМЕНДАЦИЯ]',
                  '',
                  'Для крупной `FOLKLORE`-сущности предпочтителен производственный шаблон: **2–4 противоречивых свидетельства → 2–3 повторяющихся признака → 1–2 ложных или неполных правила → настоящее правило/причина → последствие взаимодействия**.',
                  '',
                  'Повторяющаяся деталь важнее одинакового пересказа: совпадающий звук, предмет, поведение животного, время, место или бытовое действие должны работать как честная улика до раскрытия.',
                  '',
                  '## 30.30. Граница решений по Гринченко [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]',
                  '',
                  'Не утверждаются универсальное сверхъестественное зрение животных, отдельная раса ведьм, единая цивилизация нечисти, универсальная подмена восприятия, обязательная память каждой сущности, наличие монстра за каждым аномальным местом или буквальная истинность народных формул.',
                  ''
              ])
              bestiary += '\n'.join(parts)
              bestiary_path.write_text(bestiary, encoding='utf-8')

          status = status_path.read_text(encoding='utf-8')
          status_marker = '## Документальная синхронизация Гринченко — 05.09.2026'
          if status_marker not in status:
              status += f'''\n\n---\n\n{status_marker}\n\n- Все 28 утверждённых пунктов из `ProjectDocs/GRINCHENKO_ETHNOGRAPHIC_ADAPTATION.md` распределены в основные живые документы по указанной в каждом пункте синхронизации.\n- `LORE.md` получил лорные решения о локальных версиях, ведьме как социальной категории, аномальных местах, природной причинности, ремесленниках-посредниках и устной передаче знания.\n- `BESTIARY.md` получил решения о животных-признаках, противоречивых свидетельствах, памяти взаимодействий, социальных формах нечеловеческих сил и производственном шаблоне фольклорного расследования.\n- Общий игровой канон остаётся v1.25; код Unity не менялся. Для этой документальной синхронизации компиляционные и игровые тесты не требовались.\n'''
              status_path.write_text(status, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/LORE.md ProjectDocs/BESTIARY.md ProjectDocs/DEVELOPMENT_STATUS.md
          git commit -m "docs: sync Grinchenko decisions into living docs"
          git rm .github/workflows/grinchenko-sync-once.yml
          git commit -m "chore: remove one-shot Grinchenko sync workflow"
          git push origin HEAD:main
