## 20A.1. Сверхъестественный свидетель

Рабочая форма:

`скрытый поступок → остаётся необычный след → возникают человеческие версии → герой собирает факты → сверхъестественный свидетель даёт недостающий фрагмент → игрок решает судьбу людей, свидетеля и последствий прошлого`.

Свидетелем может быть мёртвый, место, вода, дерево, растение, животное, вещь или изменённый человек.

Главное ограничение: свидетель **не всеведущ**. Он знает только то, чему мог быть свидетелем или что действительно сохранилось в его связи с событием. Он может иметь собственный интерес, а его проявление требует интерпретации.

Источник: **[MICKIEWICZ / `LILIJE` + `ŚWITEŹ` + KINGDOM SURVIVAL]**.

## 20A.2. Преступление возвращается через обычай

Сильная конструкция из `Lilije`:

`преступление → материальный след → происхождение забыто → след включается в обычную социальную практику → публичное использование возвращает прошлое в настоящее`.

Возможные адаптированные формы:

- дерево с места убийства становится балками нового дома;
- ткань погибшего превращается в свадебный пояс;
- украденный металл идёт на колокол или инструмент;
- цветы с тайной могилы попадают в свадебный или поминальный венок.

Ценность приёма в том, что прошлое возвращается **через жизнь людей**, а не по расписанию призрачного скримера.

Источник: **[MICKIEWICZ / `LILIJE` + KINGDOM SURVIVAL]**.

## 20A.3. Повторяющийся атмосферный мотив позднее становится уликой

Один признак можно провести через три функции:

`сначала атмосфера → затем узнаваемое повторение → позднее причинная улика`.

Песня, запах, цветок, звук колокола, поведение животного, жест или другой конкретный мотив должен быть показан честно до раскрытия. После открытия игрок способен вспомнить ранние появления и понять, что ключ был перед ним, а не возник в финальном твисте.

Источник: **[MICKIEWICZ / `LILIJE` + `ŚWITEŹ` + KINGDOM SURVIVAL]**.

## 20A.4. Воздаяние превращать в последствия, а не в авторский приговор

Литературная баллада может завершиться окончательным сверхъестественным наказанием. Для `Kingdom Survival` предпочтительнее:

`нарушение → сверхъестественное давление → расследование → понимание правила → поступок игрока → устойчивое новое состояние`.

Игрок может добиваться человеческого суда, скрыть правду, потребовать возмещения, позволить мести состояться, остановить её, изменить договор, уничтожить свидетеля, сделать правду публичной или оставить её семейной тайной — если эти варианты естественно следуют из конкретной истории.

Приём **не вводит шкалу добра/зла** и не требует, чтобы все варианты считались равноценными. История показывает цену и последствия, а не выдаёт метафизическую оценку кнопкой.

Источник: **[MICKIEWICZ / BALLADY I ROMANSE + KINGDOM SURVIVAL]**.

