name: Apply Baltic-Carpathian docs integration

on:
  push:
    branches:
      - 'docs/baltic-carpathian-integration-20260905'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/baltic-carpathian-integration-20260905
          fetch-depth: 0

      - name: Apply approved documentation changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          payloads = {
              'ProjectDocs/LORE.md': (
                  'BC-L1. Сверхъестественное богатство проверяется на источник и потерю',
                  ''
              ),
              'ProjectDocs/BESTIARY.md': (
                  'BC-B1. Змей-обогатитель: проверка происхождения богатства',
                  ''
              ),
              'ProjectDocs/DEVELOPMENT_STATUS.md': (
                  '## Интеграция Basanavičius + Pamfile + Gerard — 05.09.2026',
                  ''
              ),
          }

          for path_str, (marker, payload) in payloads.items():
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              addition = gzip.decompress(base64.b64decode(payload)).decode('utf-8').strip()
              path.write_text(text.rstrip() + '\n\n---\n\n' + addition + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/_apply_baltic_carpathian.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/LORE.md ProjectDocs/BESTIARY.md ProjectDocs/DEVELOPMENT_STATUS.md .github/workflows/_apply_baltic_carpathian.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: integrate Baltic-Carpathian folklore decisions"
          git push origin HEAD:docs/baltic-carpathian-integration-20260905
