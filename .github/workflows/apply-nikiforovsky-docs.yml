name: Apply Nikiforovsky documentation

on:
  push:
    branches:
      - work/nikiforovsky-docs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nikiforovsky-docs
          fetch-depth: 0

      - name: Apply approved folklore decisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lore_path = Path('ProjectDocs/LORE.md')
          bestiary_path = Path('ProjectDocs/BESTIARY.md')
          status_path = Path('ProjectDocs/DEVELOPMENT_STATUS.md')
          lore_tmp = Path('ProjectDocs/.nikiforovsky_lore.tmp')
          bestiary_tmp = Path('ProjectDocs/.nikiforovsky_bestiary.tmp')
          status_tmp = Path('ProjectDocs/.nikiforovsky_status.tmp')
          workflow_path = Path('.github/workflows/apply-nikiforovsky-docs.yml')

          lore = lore_path.read_text(encoding='utf-8')
          lore_marker = '# 58. Решения по Н. Я. Никифоровскому — «Нечистики»'
          if lore_marker not in lore:
              journal_anchor = '| 05.09.2026 | По Д. К. Зеленину утверждены культурные модели «неправильной» смерти, погребального порядка, привязки мёртвого к месту, поминовения и связи обрядового календаря с хозяйственной жизнью; конкретная метафизика смерти не фиксируется. | УТВЕРЖДЕНО |'
              journal_row = '| 05.09.2026 | По Н. Я. Никифоровскому «Нечистики» утверждены принципы самостоятельных отношений хозяйственных пространств, преобразования мифологической территории человеком, памяти долга, сложного права на клад, исторического происхождения богатства, сверхъестественного изменения ориентиров, ненаследуемости колдовской вины и изменения среды как допустимого способа решения; конкретные сущности вынесены в BESTIARY как рабочий FOLKLORE-материал. | УТВЕРЖДЕНО / РАБОЧЕЕ |'
              if journal_row not in lore:
                  if journal_anchor not in lore:
                      raise RuntimeError('Zelenin journal anchor not found')
                  lore = lore.replace(journal_anchor, journal_anchor + '\n' + journal_row, 1)
              lore_section = lore_tmp.read_text(encoding='utf-8').strip()
              lore = lore.rstrip() + '\n\n' + lore_section + '\n'
              lore_path.write_text(lore, encoding='utf-8')

          bestiary = bestiary_path.read_text(encoding='utf-8')
          bestiary_marker = '# 27. Никифоровский — правила и рабочие сущности'
          if bestiary_marker not in bestiary:
              bestiary_section = bestiary_tmp.read_text(encoding='utf-8').strip()
              bestiary = bestiary.rstrip() + '\n\n' + bestiary_section + '\n'
              bestiary_path.write_text(bestiary, encoding='utf-8')

          status = status_path.read_text(encoding='utf-8')
          status_marker = '## 16. Н. Я. Никифоровский — утверждённые решения по «Нечистикам»'
          if status_marker not in status:
              status_section = status_tmp.read_text(encoding='utf-8').strip()
              status = status.rstrip() + '\n\n' + status_section + '\n'
              status_path.write_text(status, encoding='utf-8')

          for path in (lore_tmp, bestiary_tmp, status_tmp, workflow_path):
              if path.exists():
                  path.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "docs: add Nikiforovsky lore and bestiary decisions"
          git push origin HEAD:work/nikiforovsky-docs
