<script>
'use strict';
(()=>{
const $=s=>document.querySelector(s), clone=x=>JSON.parse(JSON.stringify(x));
const INITIAL=JSON.parse($('#embedded-state').textContent), KEY='ks-roadmap-v1:'+INITIAL.planId, UNDO_KEY=KEY+':undo';
const STATUS={todo:'В очереди',verify:'Проверить',doing:'В работе',done:'Сделано',cancelled:'Отменено'};
const AREA=['Проект','Техника','Нарратив','Карта','Бой','Системы','Инструменты','Арт','Контент','UI','Звук','Баланс','Проверка','Рубеж','Идеи'];
const ICONS={menu:'M4 6h16M4 12h16M4 18h16',route:'M5 5h10a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h10M5 2v6M19 18v5',arrow:'m9 5 7 7-7 7',check:'m5 12 4 4L19 6',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',plus:'M12 5v14M5 12h14',more:'M5 12h.01M12 12h.01M19 12h.01',close:'m6 6 12 12M6 18 18 6',book:'M4 4h7l1 2 1-2h7v16h-7l-1 2-1-2H4V4ZM12 6v16',clock:'M12 7v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',undo:'M4 10h10a6 6 0 0 1 0 12M4 10l5-5M4 10l5 5',edit:'m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14v6Z',flag:'M5 22V3m0 0c4-3 8 3 14 0v10c-6 3-10-3-14 0',up:'m6 15 6-6 6 6',down:'m6 9 6 6 6-6',info:'M12 11v6M12 7h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',copy:'M9 9h12v12H9ZM15 9V3H3v12h6'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]||ICONS.info}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeJSON=x=>JSON.stringify(x,null,2).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
const safeURL=s=>{try{const u=new URL(s);return /^https?:$/.test(u.protocol)?u.href:'#'}catch{return '#'}};
let state=clone(INITIAL), undo=[], storageOK=true, toastTimer, modal=null, restorePrint=null, bootMessage='';
let ui={view:'route',search:'',status:'all',area:'all',owner:'all',expanded:new Set(['p00']),nav:false,menu:false};
function validate(s){
 if(!s||s.schemaVersion!==1||s.planId!==INITIAL.planId||!Array.isArray(s.tasks)||!Array.isArray(s.phases)||!s.meta||!s.sources)throw Error('Это не совместимая карта Kingdom Survival версии 1.');
 if(s.tasks.length>5000||s.phases.length>120)throw Error('План превышает допустимый размер.');
 const walkKeys=x=>{if(x&&typeof x==='object')for(const k of Object.keys(x)){if(['__proto__','constructor','prototype'].includes(k))throw Error('Некорректная структура файла.');walkKeys(x[k])}};walkKeys(s);
 for(const k of ['title','project','subtitle','snapshot','goal','notes','assumptions'])if(typeof s.meta[k]!=='string')throw Error('Некорректная карточка проекта.');
 if(!s.sources||typeof s.sources!=='object'||Array.isArray(s.sources))throw Error('Некорректные источники.');
 for(const source of Object.values(s.sources))if(!source||['title','detail','url'].some(k=>typeof source[k]!=='string'))throw Error('Некорректная ссылка источника.');
 const pids=new Set(),ids=new Set();
 for(const p of s.phases){if(typeof p.id!=='string'||pids.has(p.id)||typeof p.title!=='string'||!Array.isArray(p.sources)||p.sources.some(x=>!Object.hasOwn(s.sources,x))||['subtitle','outcome','why','legacy'].some(k=>typeof p[k]!=='string')||!['main','parallel','later'].includes(p.lane))throw Error('Ошибка в этапах или повторяющийся ID.');pids.add(p.id);}
 for(const t of s.tasks){if(typeof t.id!=='string'||ids.has(t.id)||!pids.has(t.phaseId)||!Object.hasOwn(STATUS,t.status)||typeof t.title!=='string'||!Array.isArray(t.deps))throw Error('Ошибка в задачах, статусах или связях с этапом.');ids.add(t.id);for(const k of ['action','accept','note','owner','area','size'])if(typeof t[k]!=='string')throw Error('Некорректное текстовое поле задачи.');}
 const map=new Map(s.tasks.map(t=>[t.id,t])),active=new Set(),done=new Set();
 function visit(id){if(active.has(id))throw Error('Обнаружен круг зависимостей. Убери одну из взаимных связей.');if(done.has(id))return;active.add(id);for(const dep of map.get(id).deps){if(!ids.has(dep)||dep===id)throw Error('Есть ссылка на отсутствующую задачу или на себя.');visit(dep)}active.delete(id);done.add(id)};
 for(const id of ids)visit(id);
 return s;
}
try{const raw=localStorage.getItem(KEY);if(raw){try{const saved=JSON.parse(raw);validate(saved);if(String(saved.savedAt)>String(state.savedAt)||(String(saved.savedAt)===String(state.savedAt)&&Number(saved.revision)>Number(state.revision))){state=saved;bootMessage='Восстановлены более свежие правки из этого браузера. Копия из самого HTML доступна в меню «Ещё».'}}catch{bootMessage='Локальную копию не удалось прочитать. Открыта сохранённая версия HTML; файл и импорт JSON доступны.'}}try{undo=JSON.parse(localStorage.getItem(UNDO_KEY)||'[]');if(!Array.isArray(undo))undo=[];undo=undo.slice(-8)}catch{undo=[]}}catch{storageOK=false}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;try{localStorage.setItem(UNDO_KEY,JSON.stringify(undo.slice(-8)))}catch{}}catch{storageOK=false}}
function commit(mutator,msg){const previous=clone(state),next=clone(state);try{mutator(next);validate(next)}catch(e){toast(e.message,true);return false}undo.push(previous);undo=undo.slice(-8);next.revision=Math.max(Number(state.revision)||0,Number(next.revision)||0)+1;next.savedAt=new Date().toISOString();state=next;persist();render();if(msg)toast(msg);return true}
function undoAction(){if(!undo.length)return;const rev=Number(state.revision)||0;let previous=undo.pop();try{validate(previous)}catch(e){toast(e.message,true);return}state=previous;state.revision=rev+1;state.savedAt=new Date().toISOString();persist();closeModal();render();toast('Предыдущее состояние восстановлено.')}
const byId=id=>state.tasks.find(t=>t.id===id), phaseById=id=>state.phases.find(p=>p.id===id), visibleTasks=()=>state.tasks.filter(t=>!t.deletedAt), displayId=t=>t.id.startsWith('p')?t.id.toUpperCase().replace('P','РМ '):t.id.slice(0,12);
const isLater=t=>!!t.optional||phaseById(t.phaseId)?.lane==='later';
function blockers(t){return t.deps.map(byId).filter(d=>!d||d.deletedAt||d.status!=='done')}
function ready(t){return !t.deletedAt&&!isLater(t)&&!['done','cancelled'].includes(t.status)&&blockers(t).length===0}
function nextTasks(){return visibleTasks().filter(ready).sort((a,b)=>(a.status==='doing'?-1:0)-(b.status==='doing'?-1:0)||state.phases.findIndex(p=>p.id===a.phaseId)-state.phases.findIndex(p=>p.id===b.phaseId)||state.tasks.indexOf(a)-state.tasks.indexOf(b))}
function stats(list){const live=list.filter(t=>!t.deletedAt&&t.status!=='cancelled'),done=live.filter(t=>t.status==='done').length;return {all:live.length,done,pct:live.length?Math.round(done/live.length*100):0}}
function currentPhase(){return state.phases.find(p=>p.lane!=='later'&&visibleTasks().some(t=>t.phaseId===p.id&&t.status!=='done'&&t.status!=='cancelled'))}
function filterTask(t){const q=ui.search.toLocaleLowerCase('ru');return (!q||[t.title,t.action,t.accept,t.note,t.area,t.id].join(' ').toLocaleLowerCase('ru').includes(q))&&(ui.status==='all'||ui.status==='ready'&&ready(t)||ui.status==='blocked'&&!['done','cancelled'].includes(t.status)&&blockers(t).length>0||ui.status===t.status)&&(ui.area==='all'||t.area===ui.area)&&(ui.owner==='all'||t.owner===ui.owner)}
function progress(s){return `<div class="progressbar" role="progressbar" aria-label="Выполненные пункты" aria-valuenow="${s.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${s.pct}%"></i></div>`}
function statusOptions(value){return Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===value?'selected':''}>${v}</option>`).join('')}
function sourceLinks(ids){return ids.map(id=>state.sources[id]).filter(Boolean).map(s=>`<a href="${esc(safeURL(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`).join('')}
function taskRow(t,trash=false){const blocked=blockers(t).length;return `<article class="task-row ${t.status==='done'?'is-done':''} ${t.status==='cancelled'?'is-cancelled':''} ${t.milestone?'is-milestone':''}" data-task-row="${esc(t.id)}">
${trash?`<button class="iconbtn" data-action="restore" data-id="${esc(t.id)}" aria-label="Восстановить задачу">${icon('undo')}</button>`:`<button class="checkbtn ${t.status==='done'?'checked':''}" data-action="check" data-id="${esc(t.id)}" aria-label="${t.status==='done'?'Вернуть в очередь':'Отметить выполненной'}: ${esc(t.title)}" aria-pressed="${t.status==='done'}">${t.status==='done'?icon('check'):''}</button>`}
<div class="task-main"><button class="task-title-button" data-action="detail" data-id="${esc(t.id)}"><span class="task-title">${t.milestone?'◇ ':''}${esc(t.title)}</span></button><div class="task-meta"><span class="task-code">${esc(displayId(t))}</span><span>${esc(t.area)}</span><span class="owner-tag">${esc(t.owner)}</span>${t.status==='done'&&blocked?'<span class="blocked-label">Связи требуют сверки</span>':blocked&&!['done','cancelled'].includes(t.status)?`<span class="blocked-label">Сначала: ${blocked}</span>`:ready(t)?'<span style="color:var(--accent)">Можно начать</span>':''}${t.evidence?'<span style="color:var(--blue)">Есть основа</span>':''}</div><div class="printdetail">${esc(t.action)}<br><strong>Готово, когда:</strong> ${esc(t.accept)}${t.note?'<br>Заметка: '+esc(t.note):''}</div></div>
${trash?'':`<select class="status-select ${esc(t.status)}" data-status-id="${esc(t.id)}" aria-label="Статус: ${esc(t.title)}">${statusOptions(t.status)}</select>`}<button class="task-chevron iconbtn" data-action="detail" data-id="${esc(t.id)}" aria-label="Открыть задачу">${icon('arrow')}</button></article>`}
function phaseCard(p,list){const expanded=ui.expanded.has(p.id)||!!ui.search||ui.status!=='all'||ui.area!=='all'||ui.owner!=='all',all=visibleTasks().filter(t=>t.phaseId===p.id&&(ui.view==='later'?isLater(t):!isLater(t))),s=stats(all),idx=state.phases.indexOf(p),isCurrent=currentPhase()?.id===p.id;return `<section class="phase ${isCurrent?'current':''}" id="phase-${esc(p.id)}"><header class="phase-head ${expanded?'expanded':''}"><button class="phase-toggle" data-action="toggle-phase" data-id="${esc(p.id)}" aria-expanded="${expanded}"><span class="phase-no">${String(idx).padStart(2,'0')}</span><span style="flex:1;min-width:0"><span class="phase-title">${esc(p.title)}</span><span class="phase-subtitle">${esc(p.subtitle)}${p.lane==='parallel'?' · параллельно':p.lane==='later'?' · вне обязательного маршрута':''}</span></span></button><div class="phase-stats"><span>${s.done} / ${s.all}</span>${progress(s)}</div><button class="iconbtn ghost chevron" data-action="toggle-phase" data-id="${esc(p.id)}" aria-label="${expanded?'Свернуть':'Развернуть'} этап">${icon('arrow')}</button></header>${expanded?`<div class="phase-body"><div class="phase-intro"><div><strong>Зачем этот этап</strong><p>${esc(p.why)}</p></div><div><strong>Результат этапа</strong><p>${esc(p.outcome)}</p></div></div>${list.map(t=>taskRow(t)).join('')}<div class="phase-foot"><button class="small ghost" data-action="add-task" data-id="${esc(p.id)}">+ Добавить пункт</button><button class="small ghost" data-action="edit-phase" data-id="${esc(p.id)}">Изменить этап</button><span class="legacy">${esc(p.legacy)}</span></div></div>`:''}</section>`}
function nav(){const later=visibleTasks().filter(isLater).length,trash=state.tasks.filter(t=>t.deletedAt).length;return `<aside class="sidebar ${ui.nav?'open':''}"><div><div class="eyebrow" style="margin:0 13px 15px">Рабочая тетрадь</div>${[['route','route','Весь маршрут',''],['next','flag','С чего начать',nextTasks().length],['later','clock','Отложенные идеи',later],['guide','book','Как работать с планом',''],['sources','info','Основа и источники',''],['trash','trash','Корзина',trash]].map(([v,ic,label,n])=>`<button class="navitem ${ui.view===v?'active':''}" data-action="view" data-view="${v}">${icon(ic)}<span>${label}</span>${n!==''?`<span class="navcount">${n}</span>`:''}</button>`).join('')}</div><div class="navblock"><div class="eyebrow">Этапы разработки</div>${state.phases.filter(p=>p.lane!=='later').map(p=>`<button class="phase-nav ${currentPhase()?.id===p.id?'active':''}" data-action="jump" data-id="${esc(p.id)}"><span class="phase-index">${String(state.phases.indexOf(p)).padStart(2,'0')}</span><span>${esc(p.title)}${p.lane==='parallel'?' ↗':''}</span></button>`).join('')}</div><div class="sidefoot"><strong>Один законченный шаг за раз.</strong><br>План можно менять. Новый пункт не становится каноном автоматически.<br><br>Автосохранение — в этом браузере. Для переноса скачай обновлённый HTML или JSON.</div></aside>`}
function toolbar(){const areas=[...new Set(visibleTasks().map(t=>t.area))].sort(),owners=[...new Set(visibleTasks().map(t=>t.owner))].sort();return `<div class="toolbar"><label class="search">${icon('search')}<input id="search" type="search" value="${esc(ui.search)}" placeholder="Найти задачу, результат или заметку" aria-label="Поиск по плану"></label><select id="filter-status" aria-label="Фильтр статуса"><option value="all">Все статусы</option>${[['ready','Можно начать'],['blocked','Ждёт других шагов'],...Object.entries(STATUS)].map(([v,l])=>`<option value="${v}" ${ui.status===v?'selected':''}>${l}</option>`).join('')}</select><select id="filter-area" aria-label="Фильтр направления"><option value="all">Все направления</option>${areas.map(v=>`<option ${ui.area===v?'selected':''}>${esc(v)}</option>`).join('')}</select><select id="filter-owner" aria-label="Фильтр ответственного"><option value="all">Все участники</option>${owners.map(v=>`<option ${ui.owner===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}
function routePage(later=false){const active=visibleTasks().filter(t=>later?isLater(t):!isLater(t)),s=stats(active),next=nextTasks()[0];const phaseList=state.phases.filter(p=>later?(p.lane==='later'||active.some(t=>t.phaseId===p.id)):p.lane!=='later'),filtered=active.filter(filterTask);return `${later?`<div class="eyebrow">Банк идей</div><h1 class="view-title">Оставить на потом.</h1><p class="page-intro">Эти идеи не входят в обязательный путь к версии 1.0. Вернуть задачу можно через редактирование: перенеси её в рабочий этап и сними отметку «Отложенная».</p>`:`<header class="hero"><div><div class="eyebrow">Kingdom Survival / путь к версии 1.0</div><h1>От идеи<br>к <em>выпущенной игре.</em></h1><p class="hero-description">Понятный порядок для одного разработчика. Проверяй основу, собирай цельные фрагменты и расширяй то, что уже работает.</p><div class="hero-tags"><span class="tag green">${state.phases.filter(p=>p.lane!=='later').length} этапов до завершения</span><span class="tag">${active.length} пунктов маршрута</span><span class="tag gold">С учётом текущего проекта</span></div></div><div class="hero-side"><div class="eyebrow">Выполненные пункты</div><div class="big-number">${s.done}<span> / ${s.all}</span></div>${progress(s)}<div class="stat-caption">${s.pct}% пунктов плана.<br>Это не процент готовности игры.</div></div></header>${next?`<section class="next-card"><div class="step-index">${String(state.phases.findIndex(p=>p.id===next.phaseId)).padStart(2,'0')}</div><div class="next-content"><div class="eyebrow">Ближайший доступный шаг</div><h3>${esc(next.title)}</h3><p>${esc(phaseById(next.phaseId).title)} · ${esc(next.owner)}</p></div><button class="primary small" data-action="detail" data-id="${esc(next.id)}">Открыть шаг ${icon('arrow')}</button></section>`:''}`}
<div class="section-head"><div><h2>${later?'Идеи и отменённые направления':'Последовательность разработки'}</h2><p>${later?'Возвращай только то, что усиливает выбранную версию.':'Этапы раскрываются. Связи показывают, что нужно закончить раньше.'}</p></div><button class="small" data-action="add-phase">+ Этап</button></div>${toolbar()}<div class="countline"><span>Найдено: ${filtered.length} ${ui.search||ui.status!=='all'||ui.area!=='all'||ui.owner!=='all'?'<button class="small ghost" data-action="reset-filters">Сбросить фильтры</button>':''}</span><span><button class="small ghost" data-action="expand-all">Развернуть</button><button class="small ghost" data-action="collapse-all">Свернуть</button></span></div>${phaseList.map(p=>{const list=filtered.filter(t=>t.phaseId===p.id);return list.length||(!ui.search&&ui.status==='all'&&ui.area==='all'&&ui.owner==='all'&&!active.some(t=>t.phaseId===p.id))?phaseCard(p,list):''}).join('')||'<div class="empty"><h3>Ничего не найдено</h3>Измени запрос или сбрось фильтры.</div>'}<div class="footer-note">${esc(state.meta.snapshot)} · Рабочая дорожная карта, а не новая версия канона. При противоречии действуют последние решения Саши и актуальные документы проекта.</div>`}
function nextPage(){const all=nextTasks(),doing=visibleTasks().filter(t=>t.status==='doing'),needs=visibleTasks().filter(t=>t.status==='verify'&&!isLater(t)),blocked=visibleTasks().filter(t=>!isLater(t)&&!['done','cancelled'].includes(t.status)&&blockers(t).length);return `<div class="eyebrow">Ближайшая работа</div><h1 class="view-title">С чего начать сейчас.</h1><p class="page-intro">Выбери один понятный шаг и доведи его до критерия готовности. Первые этапы возвращают контроль над уже существующим проектом — они не требуют начинать игру заново.</p><div class="progress-overview"><div class="metric"><strong>${all.length}</strong><span>можно начать</span></div><div class="metric"><strong>${doing.length}</strong><span>в работе</span></div><div class="metric"><strong>${needs.length}</strong><span>нужно проверить</span></div><div class="metric"><strong>${blocked.length}</strong><span>ждут других шагов</span></div></div><div class="notice"><strong>Рабочий ритм:</strong> выбери 1 основной пункт; запиши вопрос и результат; после работы проверь критерий и оставь заметку. Срок всего проекта уточняй по реальной скорости готового фрагмента.</div><div class="section-head"><h2>Первые доступные пункты</h2><button class="small" data-action="add-task" data-id="${esc(currentPhase()?.id||state.phases[0]?.id||'')}">+ Свой пункт</button></div><div class="ready-list">${all.slice(0,8).map(t=>taskRow(t)).join('')||'<div class="empty"><h3>Доступных пунктов пока нет</h3>Проверь зависимости, отменённые задачи и контрольные рубежи. Или весь обязательный маршрут уже завершён.</div>'}</div>${all.length>8?`<p class="helptext">Показаны первые 8 из ${all.length}. Остальные доступны через фильтр «Можно начать» в полном маршруте.</p>`:''}<div class="notice warn"><strong>Отменённая зависимость не считается выполненной.</strong> Если решение изменилось, открой зависимый пункт и явно измени его связи. Отмена большого этапа сама по себе не доказывает готовность релиза.</div>`}
function guidePage(){const rules=[['Выбери один ближайший вопрос','Открой «С чего начать». В задачах есть действие и результат. Большой пункт разбей на меньшие, если его трудно закончить одной понятной поставкой.'],['Сверь то, что уже есть','Статус «Проверить» означает: в документах есть основа, но актуальное поведение нужно перепроверить. Не заказывай новую систему, пока не посмотрели существующую.'],['Проверяй результат, затем отмечай готовность','«Сделано» подтверждает критерий задачи. Компиляция проверяет код; внешний плейтест — понимание и интерес. Один вид проверки не заменяет другой.'],['Поддерживай порядок, сохраняя свободу','Пункты связаны зависимостями. Карта и аудитория выделены как параллельные ветки. Можно менять порядок, но важные зависимости должны оставаться осмысленными.'],['Сохраняй изменения переносимым способом','Автосохранение работает в этом браузере. «Скачать HTML» создаёт новую копию с текущими отметками и текстами. JSON — резервная копия и перенос между устройствами.'],['Обновляй фактический журнал проекта','Реализация в Unity и этот трекер — разные вещи. После проверенного пакета обновляйте DEVELOPMENT_STATUS.md, создавайте commit и push по AGENTS.md. Отметка здесь сама файлы проекта не меняет.']];return `<div class="read-width"><div class="eyebrow">Как пользоваться тетрадью</div><h1 class="view-title">Весь путь виден.<br>Сегодня — один шаг.</h1><p class="page-intro">Полный список нужен, чтобы понимать направление и не потерять выпускные работы. Он не требует держать весь список в голове одновременно.</p>${rules.map(([t,d],i)=>`<div class="guide-rule"><b>${String(i+1).padStart(2,'0')}</b><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}<div class="cards-grid"><section class="info-card"><div class="eyebrow">Статусы</div><h3>От очереди до результата</h3><ul><li><strong>В очереди</strong> — работа ещё не начата.</li><li><strong>Проверить</strong> — есть основа в проекте, требуется сверка.</li><li><strong>В работе</strong> — выбран текущий фокус.</li><li><strong>Сделано</strong> — выполнен критерий.</li><li><strong>Отменено</strong> — решение снято; зависимые пункты требуют пересмотра.</li></ul></section><section class="info-card"><div class="eyebrow">Перенос и резервирование</div><h3>Один актуальный файл</h3><p>Яндекс Диск переносит файлы, но не память браузера. Перед другим устройством скачай обновлённый HTML и используй эту копию. При независимых правках на двух устройствах импорт объединяет их с выбором спорной версии.</p><p>Через меню «Ещё» можно экспортировать и импортировать JSON, отменить последнее изменение и распечатать план.</p></section></div><section class="info-card" style="margin-top:16px"><div class="eyebrow">Словарь</div><dl class="glossary"><dt>Прототип</dt><dd>Дешёвая проверка конкретного вопроса: схема, карточки или работающий фрагмент.</dd><dt>Сквозной прототип</dt><dd>Цельная цепочка от начала до результата, даже с временной графикой.</dd><dt>Вертикальный срез</dt><dd>Небольшой представительный фрагмент почти финального качества, показывающий и опыт, и цену производства.</dd><dt>Альфа в этой карте</dt><dd>Вся выбранная игра проходима, обязательный набор функций собран.</dd><dt>Бета в этой карте</dt><dd>Содержание собрано, основной фокус — ошибки, удобство и стабильность.</dd><dt>Кандидат на релиз</dt><dd>Точная сборка, которую можно выпустить после финальных проверок.</dd><dt>Размер пункта S / M / L</dt><dd>Небольшой / средний / крупный объём. Это рабочая оценка, не обещание количества часов. L стоит разбивать после первого знакомства.</dd></dl></section></div>`}
function sourcesPage(){const active=visibleTasks().filter(t=>!isLater(t));return `<div class="read-width"><div class="eyebrow">Основание плана</div><h1 class="view-title">Методы из книг.<br>Порядок для нашей игры.</h1><p class="page-intro">План собран по производственным и геймдизайнерским разделам двух книг, актуальным документам и последним решениям проекта. Конкретная последовательность и выпускные задачи — адаптация для Kingdom Survival.</p><section class="info-card"><h3>Что уже есть в проекте</h3><p>Свободная игра, герой и отряд, BattleSandbox, исследуемые места, предметы, торговля, корчма, задания, прогрессия, журнал, сохранения и базы. MapLab имеет рабочие части, подгрузку и мост к плану региона; завершение интеграции основной игры требуется проверить.</p><p>Поэтому существующие основы отмечены «Проверить», а не объявлены автоматически законченными. Полное прохождение Unity и внешний плейтест при создании этого файла не выполнялись.</p></section><div class="notice warn"><strong>Границы актуальности.</strong> ${esc(state.meta.snapshot)}. Рабочий HTML не меняет канон и не заменяет технический план ПР. Старые требования Дома и выбираемых мировых кризисов не возвращаются из исторических разделов.</div><div class="cards-grid"><section class="info-card"><div class="eyebrow">Карточка проекта</div><h3>${esc(state.meta.project)}</h3><p>${esc(state.meta.goal)}</p><p>${esc(state.meta.assumptions)}</p><button class="small" data-action="edit-meta">Изменить рабочие заметки</button></section><section class="info-card"><div class="eyebrow">Как читать источники</div><h3>Без буквального переноса</h3><p>Шелл: опыт, риски, итерации, интерфейс, история, плейтесты и аудитория. Бонд: объём, рабочие прототипы, проверки, короткие поставки и этапы выпуска.</p><p>Учебные Unity API и рыночные примеры из изданий 2019 года не считаются актуальными инструкциями. Условия площадок проверяются перед действиями. Указанные разделы использованы; постраничная проверка всех листингов не заявляется.</p></section></div><p class="page-intro" style="font-size:12px;margin-top:22px">${esc(state.meta.notes)}</p><div class="section-head"><h2>Источники и проектные документы</h2></div>${Object.values(state.sources).map(s=>`<div class="source-row"><a href="${esc(safeURL(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><p>${esc(s.detail)}</p></div>`).join('')}<div class="footer-note">Рекомендации по порядку работы не обещают срок и не гарантируют коммерческий результат. Следующую оценку объёма делайте после измеренного вертикального среза.</div></div>`}
function trashPage(){const list=state.tasks.filter(t=>t.deletedAt).filter(filterTask);return `<div class="eyebrow">Обратимые изменения</div><h1 class="view-title">Корзина.</h1><p class="page-intro">Удалённые пункты можно восстановить вместе с заметками и связями. Пока пункт в корзине, зависимые задачи не считают его выполненным.</p>${toolbar()}<div class="ready-list">${list.map(t=>taskRow(t,true)).join('')||'<div class="empty"><h3>Корзина пуста</h3>Удалённые задачи появятся здесь.</div>'}</div>`}
function render(focus){const active=visibleTasks().filter(t=>!isLater(t)),s=stats(active);$('#app').innerHTML=`<header class="topbar"><button class="iconbtn ghost mobile-menu" data-action="mobile-menu" aria-label="Открыть навигацию">${icon('menu')}</button><div class="brand"><div class="brandmark">K</div><div><div class="brandname">KINGDOM SURVIVAL</div><div class="brandmeta">DEVELOPMENT FIELDNOTES</div></div></div><div class="topactions"><span class="save-state ${storageOK?'':'error'}"><i class="dot"></i>${storageOK?'Сохранено в браузере':'Нужна копия файла'}</span><button class="small export-json" data-action="export-json">JSON</button><button class="primary small" data-action="export-html">${icon('download')} Скачать HTML</button><div class="menu-wrap"><button class="iconbtn" data-action="menu" aria-label="Ещё действия" aria-expanded="${ui.menu}">${icon('more')}</button>${ui.menu?`<div class="menu"><button data-action="export-json">Резервная копия JSON<small>Все задачи, отметки и заметки</small></button><button data-action="import">Импорт HTML или JSON<small>Перенести или объединить изменения</small></button><button data-action="file-version">Версия из этого HTML<small>Открыть импорт сохранённой копии</small></button><button data-action="undo" ${undo.length?'':'disabled'}>Отменить последнее изменение</button><button data-action="print">Печать всего плана</button><button data-action="edit-meta">Рабочие заметки проекта</button></div>`:''}</div></div></header>${storageOK?'':'<div class="storage-warning">Браузер не разрешил автосохранение. Скачивай обновлённый HTML или JSON после изменений.</div>'}<div class="sidebar-overlay ${ui.nav?'open':''}" data-action="close-nav"></div><div class="shell">${nav()}<main class="main" id="main">${ui.view==='route'?routePage():ui.view==='later'?routePage(true):ui.view==='next'?nextPage():ui.view==='guide'?guidePage():ui.view==='sources'?sourcesPage():trashPage()}</main></div>`;if(focus){const input=$(focus.selector);if(input){input.focus();if(focus.pos!=null&&input.setSelectionRange)input.setSelectionRange(focus.pos,focus.pos)}}if(modal?.type==='detail')showDetail(modal.id,false)}
function openModal(type,html,cls=''){modal={type,...modal};$('#dialog').className=cls;$('#dialog').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal();}
function closeModal(){modal=null;if($('#dialog').open)$('#dialog').close()}
function modalHead(label,title){return `<header class="modal-head"><div><div class="eyebrow">${esc(label)}</div><h2 id="modal-title">${esc(title)}</h2></div><button class="iconbtn ghost" data-action="close-modal" aria-label="Закрыть">${icon('close')}</button></header>`}
function showDetail(id,focus=true){const t=byId(id);if(!t)return;const p=phaseById(t.phaseId),b=blockers(t),dependents=state.tasks.filter(x=>!x.deletedAt&&x.deps.includes(id));modal={type:'detail',id};const html=modalHead(displayId(t),t.title)+`<div class="modal-scroll"><div class="modal-body"><div class="detail-grid"><label>Статус<select data-status-id="${esc(t.id)}">${statusOptions(t.status)}</select></label><label>Этап<div style="margin-top:10px;color:var(--ink)">${esc(p.title)}</div></label></div><div class="detail-block"><h3>Что сделать</h3><p>${esc(t.action)}</p></div><div class="detail-block acceptance"><h3>Критерий готовности</h3><p>${esc(t.accept)}</p></div>${t.evidence?`<div class="detail-block"><h3>Что уже есть · требуется сверка</h3><p style="font-size:12px;color:var(--blue)">${esc(t.evidence)}</p></div>`:''}<div class="barline" style="margin-bottom:24px"><span class="tag">${esc(t.owner)}</span><span class="tag">${esc(t.area)}</span><span class="tag">Объём ${esc(t.size)}</span>${t.optional?'<span class="tag gold">Отложенная идея</span>':''}</div><div class="detail-block"><h3>Сначала завершить ${b.length?'· осталось '+b.length:''}</h3>${t.deps.length?t.deps.map(d=>{const x=byId(d);return `<div class="dep-row"><span style="color:${x?.status==='done'&&!x.deletedAt?'var(--accent)':'var(--gold)'}">${x?.status==='done'&&!x.deletedAt?'✓':'○'}</span><button data-action="detail" data-id="${esc(d)}">${esc(x?.title||d)}${x?.deletedAt?' · в корзине':x?.status==='cancelled'?' · отменено':''}</button></div>`}).join(''):'<p class="muted" style="font-size:12px">Предварительных шагов нет.</p>'}</div>${dependents.length?`<div class="detail-block"><h3>Открывает следующие шаги</h3>${dependents.map(x=>`<div class="dep-row"><span>→</span><button data-action="detail" data-id="${esc(x.id)}">${esc(x.title)}</button></div>`).join('')}</div>`:''}<div class="detail-block"><h3>Твои заметки</h3><p class="muted" style="font-size:12px">${esc(t.note||'Можно записать результат проверки, ссылку на коммит или следующее действие через «Изменить».')}</p></div><div class="detail-block field-source"><h3>Основа этапа</h3>${sourceLinks(p.sources||[])}</div></div></div><footer class="modal-footer"><button class="primary small" data-action="edit-task" data-id="${esc(id)}">${icon('edit')} Изменить</button><button class="small" data-action="copy-task" data-id="${esc(id)}">${icon('copy')} Для Claude</button>${t.deletedAt?`<button class="small" data-action="restore" data-id="${esc(id)}">Восстановить</button>`:`<button class="small ghost danger" data-action="delete-task" data-id="${esc(id)}">В корзину</button>`}<div class="arrow-group"><button class="iconbtn small" data-action="move-task-up" data-id="${esc(id)}" aria-label="Выше в этапе">${icon('up')}</button><button class="iconbtn small" data-action="move-task-down" data-id="${esc(id)}" aria-label="Ниже в этапе">${icon('down')}</button></div></footer>`;$('#dialog').className='details';$('#dialog').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal();if(focus)$('#dialog').querySelector('button')?.focus()}
function editTask(id,phaseId){const existing=id?byId(id):null;if(existing?.deletedAt){toast('Сначала восстанови задачу из корзины.');return}const t=existing||{id:'',phaseId:phaseId||currentPhase()?.id||state.phases[0]?.id,title:'',action:'',accept:'',status:'todo',owner:'Вместе',area:'Проект',size:'M',note:'',evidence:'',deps:[],milestone:false,optional:ui.view==='later'||phaseById(phaseId)?.lane==='later'};modal={type:'edit',id};openModal('edit',modalHead(existing?'Редактирование пункта':'Новый пункт',existing?t.title:'Добавить свой шаг')+`<form id="task-form" data-edit-id="${esc(id||'')}"><div class="modal-scroll"><div class="modal-body"><div class="form-grid"><label class="full">Название<input name="title" required maxlength="220" value="${esc(t.title)}" placeholder="Какое действие нужно закончить?"></label><label class="full">Что сделать<textarea name="action" required>${esc(t.action)}</textarea></label><label class="full">Когда считать готовым<textarea name="accept" required>${esc(t.accept)}</textarea></label><label>Этап<select name="phaseId">${state.phases.map(p=>`<option value="${esc(p.id)}" ${p.id===t.phaseId?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label><label>Статус<select name="status">${statusOptions(t.status)}</select></label><label>Кто делает<input name="owner" list="owners" value="${esc(t.owner)}" required><datalist id="owners"><option>Саша</option><option>Claude</option><option>Вместе</option><option>Внешний тест</option></datalist></label><label>Направление<input name="area" list="areas" value="${esc(t.area)}" required><datalist id="areas">${AREA.map(x=>`<option>${x}</option>`).join('')}</datalist></label><label>Рабочий объём<select name="size">${['S','M','L'].map(x=>`<option ${t.size===x?'selected':''}>${x}</option>`).join('')}</select></label><div><p class="helptext">S — небольшой · M — средний · L — стоит разбить. Это не часы и не дата.</p></div><label class="full">Заметки и результат<textarea name="note">${esc(t.note)}</textarea></label><label class="full">Основа в проекте / источник проверки<textarea name="evidence">${esc(t.evidence)}</textarea></label><label class="inline-check"><input type="checkbox" name="milestone" ${t.milestone?'checked':''}>Контрольный рубеж</label><label class="inline-check"><input type="checkbox" name="optional" ${t.optional?'checked':''}>Отложенная идея</label><div class="full"><div class="eyebrow" style="margin:8px 0">Сначала должны быть сделаны</div><div class="dep-picker"><input type="search" id="dep-search" placeholder="Поиск по другим задачам" aria-label="Поиск зависимостей"><div class="dep-list">${state.tasks.filter(x=>x.id!==id&&!x.deletedAt||t.deps.includes(x.id)).map(x=>`<label data-dep-text="${esc((x.title+' '+x.id).toLocaleLowerCase('ru'))}"><input type="checkbox" name="deps" value="${esc(x.id)}" ${t.deps.includes(x.id)?'checked':''}><span>${esc(displayId(x))} · ${esc(x.title)}${x.deletedAt?' (корзина)':''}</span></label>`).join('')}</div></div><p class="helptext">Круговые зависимости не сохраняются. Отменённый пункт не выполняет зависимость автоматически.</p></div></div><p id="form-error" class="error-text" role="alert"></p></div></div><footer class="modal-footer"><button type="button" class="ghost" data-action="close-modal">Отмена</button><button type="submit" class="primary" style="margin-left:auto">Сохранить пункт</button></footer></form>`);}
function editPhase(id){const p=phaseById(id)||{id:'',title:'',subtitle:'',outcome:'',why:'',lane:'main',legacy:'',sources:[]};modal={type:'phase',id};openModal('phase',modalHead(id?'Редактирование этапа':'Новый этап',id?p.title:'Добавить этап')+`<form id="phase-form" data-edit-id="${esc(id||'')}"><div class="modal-scroll"><div class="modal-body"><div class="form-grid"><label class="full">Название<input name="title" required maxlength="150" value="${esc(p.title)}"></label><label class="full">Короткая подпись<input name="subtitle" value="${esc(p.subtitle)}"></label><label class="full">Зачем нужен этап<textarea name="why">${esc(p.why)}</textarea></label><label class="full">Результат этапа<textarea name="outcome">${esc(p.outcome)}</textarea></label><label>Направление<select name="lane"><option value="main" ${p.lane==='main'?'selected':''}>Основной маршрут</option><option value="parallel" ${p.lane==='parallel'?'selected':''}>Параллельная ветка</option><option value="later" ${p.lane==='later'?'selected':''}>Отложенное</option></select></label><label>Связь с техническим планом<input name="legacy" value="${esc(p.legacy)}"></label></div><p id="form-error" class="error-text"></p></div></div><footer class="modal-footer">${id?`<button type="button" class="iconbtn" data-action="move-phase-up" data-id="${esc(id)}" aria-label="Этап выше">${icon('up')}</button><button type="button" class="iconbtn" data-action="move-phase-down" data-id="${esc(id)}" aria-label="Этап ниже">${icon('down')}</button>`:''}<button type="button" class="ghost" data-action="close-modal">Отмена</button><button type="submit" class="primary" style="margin-left:auto">Сохранить этап</button></footer></form>`)}
function editMeta(){modal={type:'meta'};openModal('meta',modalHead('Рабочие решения','Карточка проекта')+`<form id="meta-form"><div class="modal-body form-grid"><label class="full">Название проекта<input name="project" required value="${esc(state.meta.project)}"></label><label class="full">Цель<textarea name="goal">${esc(state.meta.goal)}</textarea></label><label class="full">Предположения и открытые решения<textarea name="assumptions">${esc(state.meta.assumptions)}</textarea></label><label class="full">Рабочие заметки<textarea name="notes">${esc(state.meta.notes)}</textarea></label><p class="helptext full">Изменения этой карточки не утверждают игровой канон и не меняют файлы Unity.</p></div><footer class="modal-footer"><button type="button" class="ghost" data-action="close-modal">Отмена</button><button class="primary" type="submit" style="margin-left:auto">Сохранить</button></footer></form>`)}
function changeStatus(id,value){const t=byId(id);if(!t||t.deletedAt||!STATUS[value])return;const b=blockers(t);if(value==='done'&&b.length&&!confirm('У этого пункта ещё '+b.length+' незавершённых зависимостей. Отметить готовым после собственной проверки?')){render();return}commit(s=>{const x=s.tasks.find(t=>t.id===id);x.status=value;x.updatedAt=new Date().toISOString();x.completedAt=value==='done'?x.updatedAt:null},value==='done'?'Пункт отмечен выполненным.':'Статус изменён.')}
function deleteTask(id){const t=byId(id);if(!t)return;closeModal();commit(s=>{const x=s.tasks.find(t=>t.id===id);x.deletedAt=new Date().toISOString();x.updatedAt=x.deletedAt},'Пункт в корзине. Его можно восстановить.')}
function restoreTask(id){closeModal();commit(s=>{const x=s.tasks.find(t=>t.id===id);x.deletedAt=null;x.updatedAt=new Date().toISOString()},'Пункт восстановлен.')}
function moveTask(id,dir){const t=byId(id);const peers=state.tasks.filter(x=>x.phaseId===t.phaseId&&!x.deletedAt);const k=peers.findIndex(x=>x.id===id),other=peers[k+dir];if(!other)return;commit(s=>{const a=s.tasks.findIndex(x=>x.id===id),b=s.tasks.findIndex(x=>x.id===other.id);[s.tasks[a],s.tasks[b]]=[s.tasks[b],s.tasks[a]];s.tasks[a].updatedAt=s.tasks[b].updatedAt=new Date().toISOString()},'Порядок пунктов изменён.')}
function movePhase(id,dir){const i=state.phases.findIndex(p=>p.id===id);if(i+dir<0||i+dir>=state.phases.length)return;closeModal();commit(s=>{[s.phases[i],s.phases[i+dir]]=[s.phases[i+dir],s.phases[i]];s.phases[i].updatedAt=s.phases[i+dir].updatedAt=new Date().toISOString()},'Порядок этапов изменён.')}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function exportJSON(){download('KingdomSurvival_Roadmap_Progress.json',safeJSON(state),'application/json;charset=utf-8');toast('JSON с текущим планом и прогрессом подготовлен к скачиванию.')}
function exportHTML(){state.lastExportedAt=new Date().toISOString();persist();const doc=document.documentElement.cloneNode(true);doc.querySelector('#embedded-state').textContent=safeJSON(state);doc.querySelector('#app').innerHTML='<div style="padding:50px;color:#dcf08b">Загружаем карту разработки…</div>';doc.querySelector('#dialog').innerHTML='';doc.querySelector('#dialog').removeAttribute('open');doc.querySelector('#toast-root').innerHTML='';doc.querySelector('#import-file').removeAttribute('value');download('KingdomSurvival_Development_Roadmap_RU.html','<!DOCTYPE html>\n'+doc.outerHTML,'text/html;charset=utf-8');toast('Скачивается HTML с текущими правками. На другом устройстве открой новую копию.')}
let pendingImport=null;
function previewImport(data){validate(data);pendingImport=data;const local=new Map(state.tasks.map(t=>[t.id,t])),conflicts=data.tasks.filter(t=>local.has(t.id)&&JSON.stringify(t)!==JSON.stringify(local.get(t.id))),added=data.tasks.filter(t=>!local.has(t.id));modal={type:'import'};openModal('import',modalHead('Перенос прогресса','Импорт плана')+`<div class="modal-body"><p class="muted" style="font-size:13px">В файле: ${data.phases.length} этапов и ${data.tasks.length} задач. Новых задач: ${added.length}. Отличаются от текущих: ${conflicts.length}.</p><div class="notice">Перед импортом текущее состояние попадёт в историю отмены. Экспорт JSON даст отдельную резервную копию.</div><label style="display:block;font-size:12px;margin:15px 0;color:var(--muted)">При объединении отличающихся записей<select id="merge-choice" style="display:block;width:100%;margin-top:7px"><option value="incoming">Брать версию из импортируемого файла</option><option value="local">Сохранить мою текущую версию</option></select></label><p class="helptext">«Объединить» сохраняет задачи, которых нет в другом файле, и применяет выбранную версию при совпадении ID. Одна версия записи выбирается целиком, вместе с заметкой и статусом. Автоматической облачной синхронизации нет.</p><p id="form-error" class="error-text"></p></div><footer class="modal-footer"><button class="small" data-action="export-json">Резервная копия</button><button class="small" data-action="replace-import">Заменить целиком</button><button class="primary small" data-action="merge-import">Объединить</button></footer>`)}
function applyImport(merge){if(!pendingImport)return;const incoming=clone(pendingImport),choice=$('#merge-choice')?.value||'incoming';let next=incoming;if(merge){next=clone(state);for(const key of ['phases','tasks']){const map=new Map(next[key].map(x=>[x.id,x]));for(const x of incoming[key])if(!map.has(x.id)||choice==='incoming')map.set(x.id,x);next[key]=[...map.values()]}next.sources={...next.sources,...incoming.sources};if(choice==='incoming')next.meta=incoming.meta}try{validate(next)}catch(e){$('#form-error').textContent='Импорт не выполнен: '+e.message;return}closeModal();pendingImport=null;commit(s=>{const revision=s.revision;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,next);s.revision=revision},merge?'Изменения объединены.':'Импортированная версия восстановлена.');}
async function copyTask(id){const t=byId(id),p=phaseById(t.phaseId);const text=`Kingdom Survival. Задача: ${t.title}\nЭтап: ${p.title}\n\nЧто сделать:\n${t.action}\n\nКритерий готовности:\n${t.accept}\n\nКонтекст и заметки:\n${t.evidence||''}\n${t.note||''}\n\nПеред реализацией прочитай актуальные AGENTS.md/CLAUDE.md, канон и нужные ProjectDocs. Проверь существующий код и чужие изменения. Сначала покажи маленький этап, проверку и противоречия. Не объявляй работу выполненной без фактической проверки.`;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}else throw Error()}catch{const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;opacity:0';$('#dialog').append(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok){toast('Копирование недоступно. Текст задачи можно выделить в карточке.',true);return}}toast('Задача для Claude скопирована.')}
function toast(msg,error=false){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast ${error?'error':''}" role="status"><span>${esc(msg)}</span>${undo.length?'<button data-action="undo">Отменить</button>':''}</div>`;toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',6500)}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn){if(ui.menu&&!e.target.closest('.menu-wrap')){ui.menu=false;render()}return}const a=btn.dataset.action,id=btn.dataset.id;switch(a){case'menu':ui.menu=!ui.menu;render();break;case'mobile-menu':ui.nav=!ui.nav;render();break;case'close-nav':ui.nav=false;render();break;case'view':closeModal();ui.view=btn.dataset.view;ui.nav=false;ui.menu=false;ui.search='';ui.status=ui.area=ui.owner='all';render();window.scrollTo({top:0});break;case'jump':ui.view=phaseById(id)?.lane==='later'?'later':'route';ui.nav=false;ui.expanded.add(id);ui.search='';ui.status=ui.area=ui.owner='all';render();setTimeout(()=>$('#phase-'+CSS.escape(id))?.scrollIntoView({block:'start',behavior:'smooth'}),10);break;case'toggle-phase':ui.expanded.has(id)?ui.expanded.delete(id):ui.expanded.add(id);render();break;case'detail':showDetail(id);break;case'close-modal':closeModal();break;case'edit-task':editTask(id);break;case'add-task':editTask(null,id);break;case'edit-phase':editPhase(id);break;case'add-phase':editPhase(null);break;case'check':changeStatus(id,byId(id).status==='done'?'todo':'done');break;case'delete-task':deleteTask(id);break;case'restore':restoreTask(id);break;case'move-task-up':moveTask(id,-1);break;case'move-task-down':moveTask(id,1);break;case'move-phase-up':movePhase(id,-1);break;case'move-phase-down':movePhase(id,1);break;case'copy-task':copyTask(id);break;case'export-html':ui.menu=false;exportHTML();render();break;case'export-json':exportJSON();break;case'import':ui.menu=false;render();$('#import-file').click();break;case'file-version':ui.menu=false;render();previewImport(clone(INITIAL));break;case'replace-import':applyImport(false);break;case'merge-import':applyImport(true);break;case'undo':undoAction();break;case'edit-meta':editMeta();break;case'reset-filters':ui.search='';ui.status=ui.area=ui.owner='all';render();break;case'expand-all':state.phases.forEach(p=>ui.expanded.add(p.id));render();break;case'collapse-all':ui.expanded.clear();render();break;case'print':ui.menu=false;window.print();break}});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.search=e.target.value;render({selector:'#search',pos:e.target.selectionStart})}if(e.target.id==='dep-search'){const q=e.target.value.toLocaleLowerCase('ru');document.querySelectorAll('[data-dep-text]').forEach(x=>x.hidden=!x.dataset.depText.includes(q))}});
document.addEventListener('change',e=>{if(e.target.dataset.statusId)changeStatus(e.target.dataset.statusId,e.target.value);for(const [id,k]of [['filter-status','status'],['filter-area','area'],['filter-owner','owner']])if(e.target.id===id){ui[k]=e.target.value;render()}});
document.addEventListener('submit',e=>{if(!['task-form','phase-form','meta-form'].includes(e.target.id))return;e.preventDefault();const f=e.target,fd=new FormData(f),value=k=>String(fd.get(k)||'').trim(),now=new Date().toISOString();if(f.id==='task-form'){const id=f.dataset.editId,old=id?byId(id):null;const candidate={...(old||{}),id:id||'custom-'+(crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(16).slice(2)),phaseId:value('phaseId'),title:value('title'),action:value('action'),accept:value('accept'),status:value('status'),owner:value('owner'),area:value('area'),size:value('size'),note:value('note'),evidence:value('evidence'),deps:[...new Set(fd.getAll('deps'))],milestone:fd.has('milestone'),optional:fd.has('optional'),updatedAt:now,deletedAt:null};if(!candidate.title||!candidate.action||!candidate.accept){$('#form-error').textContent='Заполни название, действие и критерий готовности.';return}const probe=clone(state);if(id)probe.tasks[probe.tasks.findIndex(t=>t.id===id)]=candidate;else probe.tasks.push(candidate);try{validate(probe)}catch(err){$('#form-error').textContent=err.message;return}if(candidate.status==='done'&&candidate.deps.some(d=>byId(d)?.status!=='done'||byId(d)?.deletedAt)&&!confirm('Есть незавершённые зависимости. Сохранить статус «Сделано» после собственной проверки?'))return;closeModal();ui.expanded.add(candidate.phaseId);commit(s=>{if(id)s.tasks[s.tasks.findIndex(t=>t.id===id)]=candidate;else s.tasks.push(candidate)},id?'Пункт сохранён.':'Новый пункт добавлен.');showDetail(candidate.id)}else if(f.id==='phase-form'){const id=f.dataset.editId,p=phaseById(id),candidate={...(p||{sources:[]}),id:id||'phase-'+(crypto.randomUUID?.()||Date.now()),title:value('title'),subtitle:value('subtitle'),outcome:value('outcome'),why:value('why'),lane:value('lane'),legacy:value('legacy'),updatedAt:now};closeModal();ui.expanded.add(candidate.id);commit(s=>{if(id)s.phases[s.phases.findIndex(p=>p.id===id)]=candidate;else s.phases.push(candidate)},'Этап сохранён.')}else{closeModal();commit(s=>{for(const k of ['project','goal','assumptions','notes'])s.meta[k]=value(k)},'Рабочие заметки сохранены.')}});
$('#dialog').addEventListener('close',()=>{if(!$('#dialog').open)modal=null});$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>8*1024*1024){toast('Файл слишком большой: предел 8 МБ.',true);return}try{const text=await f.text();let data;if(text.trim().startsWith('<')){const parsed=new DOMParser().parseFromString(text,'text/html'),node=parsed.querySelector('#embedded-state');if(!node)throw Error('В HTML не найден сохранённый план.');data=JSON.parse(node.textContent)}else data=JSON.parse(text);previewImport(data)}catch(err){toast('Не удалось импортировать: '+err.message,true)}});
window.addEventListener('beforeprint',()=>{restorePrint={...ui,expanded:new Set(ui.expanded)};ui.view='route';ui.search='';ui.status=ui.area=ui.owner='all';state.phases.forEach(p=>ui.expanded.add(p.id));render()});window.addEventListener('afterprint',()=>{if(restorePrint){ui=restorePrint;restorePrint=null;render()}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const incoming=JSON.parse(e.newValue);validate(incoming);if(Number(incoming.revision)>Number(state.revision)){toast('План изменён в другой вкладке. Закрой лишнюю вкладку и импортируй нужную версию, чтобы объединить правки.',true)}}catch{}}});
window.ROADMAP_APP={getState:()=>clone(state),validate,exportHTML,exportJSON,previewImport,ready:id=>ready(byId(id)),getStats:()=>stats(visibleTasks().filter(t=>!isLater(t)))};
render();
if(bootMessage)toast(bootMessage);
})();
</script>
</body>
</html>
