# 70. Adam Mickiewicz — `Ballady i romanse`: место-свидетель, вода и клятва

Источник: Adam Mickiewicz — **`Ballady i romanse`** (1822), прежде всего `Świtezianka`, `Lilije`, `Świteź`, `Rybka`, `To lubię`. Подробный разбор и границы переноса хранятся в `ProjectDocs/MICKIEWICZ_BALLADY_I_ROMANSE_ADAPTATION.md`.

Материал используется как литературно-фольклорный референс. Он не вводит для всего мира автоматическую моральную кару, единую водную расу или готовую метафизику посмертия.

## 70.1. Место сохраняет ограниченное свидетельство, а не моральный приговор [УТВЕРЖДЕНО — ПРИНЦИП]

Конкретное место может удерживать узкий след совершённого там поступка и позднее возвращать его людям через повторяемый феномен. След может быть физическим, природным, звуковым или сверхъестественным, но не является всеведущим доказательством и не определяет правильную меру наказания.

Сильная причинность:

`поступок → место сохраняет ограниченный след → люди забывают или искажают причину → след входит в новую человеческую ситуацию → расследование восстанавливает связь → герой решает, что делать с прошлым`.

Источник: **[MICKIEWICZ / `LILIJE` + `ŚWITEŹ` + KINGDOM SURVIVAL]**.

## 70.2. Клятва связывает только внутри конкретного контекста [УТВЕРЖДЕНО — ПРИНЦИП]

Если клятва в конкретной истории объективно значима для сверхъестественного, её сила опирается не на сам факт произнесения слов, а на установленное отношение: место, сторону или сущность, понятное условие, признанный акт принятия и конкретное последствие нарушения.

Поэтому две одинаковые фразы в разных местах не обязаны иметь одинаковый эффект. Нарушение клятвы меняет конкретное отношение, а не запускает универсальную машину воздаяния.

Источник: **[MICKIEWICZ / `ŚWITEZIANKA` + KINGDOM SURVIVAL]**.

## 70.3. Вода может хранить человеческую историю дольше человеческой памяти [УТВЕРЖДЕНО — ДОПУСТИМАЯ ЛОКАЛЬНАЯ ПРИЧИННОСТЬ]

Для отдельного озера, реки, брода, мельничной воды или затопленного места допускается долговременная память о человеческом событии.

Проявления могут включать:

- звук, звон, песню или голос;
- необычное поведение рыбы и животных;
- растение, встречающееся только на определённом берегу;
- участок воды, которого избегают;
- сезонное повторение одного признака;
- старый запрет, происхождение которого уже забыто;
- хозяйственную практику, возникшую вокруг опасного места.

Это не означает, что вся вода мира обладает разумной памятью. Конкретный водоём, событие, носитель следа и объективность проявления определяются отдельно.

Источник: **[MICKIEWICZ / `ŚWITEŹ` + `RYBKA` + KINGDOM SURVIVAL]**.

## 70.4. Старая катастрофа может стать современной экологической и хозяйственной проблемой [УТВЕРЖДЕНО — ПРИНЦИП]

Историческая трагедия ценна для игры, если она продолжает менять настоящее не только рассказом о прошлом.

Предпочтительная форма:

`старая катастрофа / преступление → изменение места или природы → вокруг изменения возникает запрет/обычай → первоначальная причина забывается → современным людям становится нужен ресурс, дорога или доступ → старое правило нарушается → прошлое снова становится действующим конфликтом`.

Например, редкое лекарственное растение может расти только в запретной части озера; опасный берег одновременно оказывается единственным удобным местом переправы; затопленный участок меняет рыболовство или водоснабжение. Конкретный ресурс и причина утверждаются только вместе с реальным регионом.

Источник: **[MICKIEWICZ / `ŚWITEŹ` + KINGDOM SURVIVAL]**.

## 70.5. Граница решений по Mickiewicz [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]

Интеграция `Ballady i romanse` **не утверждает**:

- автоматическое божественное или моральное наказание за проступок;
- чистилище из `To lubię` как объективную метафизику мира;
- магическую силу любой произнесённой клятвы;
- правило `утопшая девушка = водная дева`;
- единую расу `швитезянок`;
- универсальное превращение погибших в растения, рыбу, камень или другие природные носители;
- готовые имена, последовательности сцен и развязки баллад как сюжет `Kingdom Survival`;
- авторское право автоматически определять единственно справедливое наказание виновного.

Главная формула переноса:

> **скрытый поступок / нарушенное отношение → ограниченный след в месте, воде, вещи, растении или сущности → человеческие версии → расследование → понимание локального правила → решение игрока → новое состояние людей и места.**
'''
