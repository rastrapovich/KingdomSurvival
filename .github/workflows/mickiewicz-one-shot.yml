## 1. Зачем `Ballady i romanse` нужны Kingdom Survival

Главная ценность выбранных баллад — не готовые водные девы, призраки или наказания, а **модель возвращающегося прошлого**:

- скрытый поступок оставляет след;
- след хранится не только человеком, но и местом, водой, растением, вещью или повторяемым действием;
- общество создаёт вокруг следа удобную или искажённую версию;
- сверхъестественное может свидетельствовать, но не обязано понимать мораль;
- клятва важна как конкретное отношение, а не как универсальный заклинательный текст;
- мёртвый или превращённый человек может сохранять не всю личность, а одну сильную обязанность;
- внешне враждебное действие сущности может быть её собственным принуждением;
- старое событие становится современным конфликтом, когда затрагивает дорогу, воду, ресурс, семью или право;
- литературное воздаяние можно превратить в выбор игрока и устойчивые последствия.

Для `Kingdom Survival` материал сводится к формуле:

> **скрытый поступок / нарушенное отношение → ограниченный сверхъестественный или материальный след → человеческие версии → расследование → понимание локального правила → поступок игрока → новое состояние людей и места.**

---

## 2. Граница литературного и фольклорного слоя

`Ballady i romanse` — художественный цикл. Даже когда Mickiewicz опирается на народные мотивы, конкретная композиция, мораль, персонажи и сверхъестественная развязка литературного текста **не являются этнографическим доказательством**.

Поэтому перенос делится на три уровня:

1. **Фольклорно совместимый мотив** — проверяется через независимые этнографические источники и уже существующие решения `LORE.md`/`BESTIARY.md`.
2. **Литературная конструкция** — используется как `REFERENCE ONLY`: способ построить сцену, расследование, причинность или конфликт.
3. **Собственная адаптация Kingdom Survival** — меняет конкретную фабулу, стороны, правила и последствия так, чтобы история принадлежала миру игры.

Наличие мотива в Mickiewicz не превращает его в объективный закон `Kingdom Survival`.

---

# ЧАСТЬ I. РАЗБОР ПЯТИ БАЛЛАД

## 3. `Świtezianka`

### Исходное драматическое ядро

Отношение двух людей закрепляется клятвой; нарушение обещания сталкивает человека с силой, связанной с водой и самим испытанием верности. Литературная развязка работает как воздаяние за сознательно нарушенное обязательство.

### Что полезно

- клятва имеет **контекст**, а не существует отдельной магической кнопкой;
- место и сверхъестественный участник делают обещание частью конкретного отношения;
- нарушение правила проверяется действием, а не декларацией персонажа;
- вода является стороной истории, а не декоративной ареной;
- сверхъестественное знает о нарушении потому, что связано с самим отношением, а не потому, что мир всеведущ.

### Адаптация

Для игры сильнее формула:

`человек получает помощь / право / возможность → добровольно принимает условие у конкретного места или силы → проходит время → условие становится дорого выполнять → нарушение создаёт новое состояние воды/дороги/отношений → герой расследует происхождение обязательства → решает, сохранять, менять или разрушать его`.

### Не переносить буквально

- автоматическое наказание за романтическую неверность;
- универсальную магию клятв;
- готовую водную расу `швитезянок`;
- буквальный финал и персонажей баллады.

---

## 4. `Lilije`

### Исходное драматическое ядро

Скрытое убийство и тайное погребение не исчезают вместе с сокрытием тела. Материальный след преступления возвращается в новую социальную ситуацию через лилии и свадебный контекст.

### Что полезно

- преступление хранится **в месте и материальном следе**;
- вещь или растение не обязаны говорить, чтобы стать свидетелем;
- повседневный обычай способен случайно вынести скрытое прошлое на публику;
- один повторяющийся мотив работает сначала атмосферой, затем уликой;
- семейная жизнь и сверхъестественное не разделены на два режима.

### Адаптация

Предпочтительная конструкция:

`преступление → материальный носитель → происхождение забыто → носитель входит в свадьбу/похороны/стройку/торговлю → появляется несоответствие → расследование возвращает старое событие → игрок решает судьбу живых и отношения с мёртвым`.

### Не переносить буквально

Не фиксировать заранее мораль исходника, точный способ убийства, наказание виновной или обязательную магичность цветов.

---

## 5. `Świteź`

### Исходное драматическое ядро

Таинственный водоём хранит след исчезнувшего человеческого мира. Исследование озера приводит к свидетельству исторической катастрофы, а природа продолжает сохранять память о прошлом.

### Что полезно

- большое прошлое раскрывается через **малое современное наблюдение**;
- озеро является архивом истории без обычной библиотеки;
- растительность и свойства берега могут быть материальным продолжением трагедии;
- коллективная катастрофа меняет экологию места;
- расследование территории естественно соединяется с лором региона.

### Адаптация

Для `Kingdom Survival` старое событие получает современную хозяйственную цену:

`катастрофа → изменившаяся вода/берег/растение → возникший запрет → причина забыта → региону нужен ресурс или доступ → запрет становится неудобен → игрок вынужден решить, что важнее живым и что они готовы сделать с прошлым`.

### Не переносить буквально

Не копировать исчезнувший город, конкретную военную историю, метафизическую причину превращения жителей или авторский финал.

---

## 6. `Rybka`

### Исходное драматическое ядро

Женщина, утратив обычную человеческую жизнь и связанную с водой, продолжает материнское отношение к ребёнку. Сверхъестественное состояние не стирает одну конкретную человеческую обязанность.

### Что полезно

- превращение не обязано сохранять человека целиком;
- одна связь — материнская — может пережить изменение формы;
- ребёнок превращает историю из охоты на сущность в спор о семье и праве;
- водная фигура остаётся конкретной биографией, а не экземпляром вида;
- человеческое предательство создаёт последствия, но решение не обязано повторять литературную кару.

### Адаптация

Сильная версия для игры строится вокруг ребёнка, живых родственников, бывшего обещания и конкретного водного локуса. Герой должен решать не только, опасна ли сущность, но и **кто имеет право определять дальнейшую жизнь ребёнка**.

### Не переносить буквально

- универсальное превращение брошенной женщины в водную сущность;
- одну биологию водных женщин;
- обязательную кару мужчине;
- точную последовательность событий исходника.

---

## 7. `To lubię`

### Исходное драматическое ядро

Страшное дорожное проявление само находится внутри повторяющегося наказания/обязанности. То, что кажется обычной агрессией к путникам, одновременно является принуждением самой сущности.

### Что полезно

- **поведение ≠ желание**;
- повторяемость позволяет заметить правило;
- дорога превращает сверхъестественное в хозяйственную проблему;
- освобождение сущности может быть отдельным решением от победы над ней;
- чужое наказание способно приносить выгоду третьим людям.

### Адаптация

`опасная дорога → одинаковые ночные проявления → люди требуют уничтожить угрозу → герой замечает принудительную повторяемость → открывает условие → решает освободить / оставить / изменить / уничтожить / заключить новый договор → меняется маршрут и экономика`.

### Не переносить буквально

Не переносить чистилище и религиозную механику наказания как объективную космологию `Kingdom Survival`.

---

# ЧАСТЬ II. УТВЕРЖДЁННЫЕ ВЫВОДЫ ПАКЕТА

## 8. Место может быть свидетелем, но не судьёй

**Статус интеграции:** `[УТВЕРЖДЕНО — ПРИНЦИП]` в `LORE.md`.

Место сохраняет только ограниченный след и не выдаёт моральный приговор. Это защищает расследование от удобного «магического детектора виновного».

## 9. Контекстно связывающая клятва

**Статус интеграции:** `[УТВЕРЖДЕНО — ПРИНЦИП / ДОПУСТИМАЯ ЛОКАЛЬНАЯ ПРИЧИННОСТЬ]`.

Если обещание объективно получает сверхъестественный вес, должны быть установлены стороны, место/свидетель, условие и добровольное принятие. Одинаковые слова не обладают одинаковой силой сами по себе.

## 10. Вода как долговременная социальная память

**Статус интеграции:** `[УТВЕРЖДЕНО — ДОПУСТИМАЯ ЛОКАЛЬНАЯ ПРИЧИННОСТЬ]`.

Отдельный водоём способен хранить след конкретной человеческой истории через звук, растение, животное, запрет или иной феномен. Это не свойство всей воды.

## 11. Старая катастрофа → современный экологический/хозяйственный конфликт

**Статус интеграции:** `[УТВЕРЖДЕНО — ПРИНЦИП]`.

Историческая трагедия должна иметь право влиять на ресурс, дорогу, промысел, здоровье или социальное право сегодняшних людей.

## 12. Одна человеческая обязанность может пережить личность

**Статус интеграции:** `[УТВЕРЖДЕНО — ПРИНЦИП ПРОЕКТИРОВАНИЯ]` в `BESTIARY.md`.

После смерти или превращения сущность может сохранить одну связь значительно лучше остальных частей личности. Для каждого случая отдельно фиксируется, что именно осталось.

## 13. Враждебное действие может быть принуждением сущности

**Статус интеграции:** `[УТВЕРЖДЕНО — ПРИНЦИП ПРОЕКТИРОВАНИЯ / REFERENCE ONLY]`.

Сущность может быть обязана атаковать, пугать, охранять или повторять событие против собственного желания. Это допустимый индивидуальный механизм, а не универсальное объяснение агрессии.

## 14. Не создавать расу `швитезянок`

**Статус интеграции:** `[УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]`.

Женская фигура у воды проектируется через происхождение, биографию, локус, сохранившееся отношение и правило. Внешнее сходство не создаёт таксономию.

## 15. Сверхъестественный свидетель

**Статус интеграции:** `[ИНСТРУМЕНТАРИЙ]` в `NARRATIVE.md`.

Свидетель даёт фрагмент, а не решение. Его перспектива ограничена местом, телом, вещью или связью с событием.

## 16. Преступление возвращается через обычай

**Статус интеграции:** `[ИНСТРУМЕНТАРИЙ]`.

Скрытый материальный след входит в новую публичную человеческую практику и тем самым возвращает преступление в настоящее.

## 17. Повторяемый мотив становится уликой

**Статус интеграции:** `[ИНСТРУМЕНТАРИЙ]`.

Ранний атмосферный признак получает позднее причинное значение. Раскрытие должно быть честно подготовлено.

## 18. Воздаяние заменяется последствиями

**Статус интеграции:** `[ИНСТРУМЕНТАРИЙ]`.

Игра не обязана автоматически воспроизводить литературную кару. Игрок понимает правило и участвует в создании устойчивого финального состояния.

---

# ЧАСТЬ III. РАБОЧИЙ КВЕСТОВЫЙ БАНК

Все пять квестов утверждены **для хранения и дальнейшей разработки**, но остаются `[РАБОЧЕЕ]`, пока пользователь отдельно не включит конкретный квест в сюжетный канон.

## 19. «Лилии на могиле»

Источник: **[MICKIEWICZ / `LILIJE` + KINGDOM SURVIVAL]**.

Пропавший муж, новая жизнь вдовы, спор о наследстве, растение как материальный след и тайная могила. Рабочая скрытая правда допускает убийство женой, но мотив остаётся открытым. Главный выбор касается человеческого суда, сокрытия, возмещения, мести мёртвого и дальнейшей судьбы семьи/земли.

## 20. «Клятва у воды»

Источник: **[MICKIEWICZ / `ŚWITEZIANKA` + KINGDOM SURVIVAL]**.

Личный старый договор человека с водой становится проблемой переправы, торговли или рыболовства. Квест проверяет буквальное исполнение, пересмотр, обман, уничтожение силы и вопрос действительности первоначальной клятвы.

## 21. «Под водой звонят»

Источник: **[MICKIEWICZ / `ŚWITEŹ` + D&D / RIME + KINGDOM SURVIVAL]**.

Большой региональный квест: противоречивые рассказы об озере, след исчезнувшего поселения, историческая катастрофа и современная необходимость добыть ресурс из запретной зоны. Итог меняет экономику, здоровье, знание и состояние воды.

## 22. «Мать из реки»

Источник: **[MICKIEWICZ / `RYBKA` + KINGDOM SURVIVAL]**.

Живой ребёнок тайно встречает погибшую/изменённую мать у воды; живые родственники спорят о безопасности и праве на ребёнка, а прошлое отца возвращается в настоящий социальный конфликт. Отличать от домашнего полесского квеста `«Колыбель качается сама»`.

## 23. «Дорога, которая не хочет пугать»

Источник: **[MICKIEWICZ / `TO LUBIĘ` + KINGDOM SURVIVAL]**.

Проявление на дороге выглядит агрессивным, но повторяемость раскрывает навязанную обязанность пугать путников. Решение меняет маршрут, торговлю, безопасность и судьбу самой сущности.

---

# ЧАСТЬ IV. ЧТО СОЗНАТЕЛЬНО НЕ ПЕРЕНОСИТСЯ

Не утверждать по Mickiewicz:

- автоматическое божественное наказание за моральный проступок;
- чистилище `To lubię` как объективную космологию;
- магическую силу любой произнесённой клятвы;
- правило `утопшая девушка = водная дева`;
- единую расу `швитезянок`;
- универсальное превращение погибших в растения, рыбу или камень;
- готовые имена, реплики, последовательности событий и финалы баллад;
- единственную авторски правильную меру наказания;
- всеведущего мёртвого/место/вещь как автоматический детектор истины.

Если мотив поддерживается независимым фольклорным источником, объективный статус всё равно определяется через актуальные `LORE.md`, `BESTIARY.md` и отдельное решение пользователя.

---

# ЧАСТЬ V. КАРТА ИНТЕГРАЦИИ

## `ProjectDocs/LORE.md`

- место-свидетель, не судья;
- контекстно связывающая клятва;
- вода как долговременная социальная память;
- старая катастрофа как современная экологическая/хозяйственная проблема;
- границы против универсального воздаяния и единой водной таксономии.

## `ProjectDocs/BESTIARY.md`

- одна доминирующая человеческая обязанность после смерти/превращения;
- вынужденное враждебное поведение как индивидуальная тюрьма;
- водная женщина через биографию, а не вид;
- ограниченная перспектива сверхъестественного свидетеля.

## `ProjectDocs/NARRATIVE.md`

- `Сверхъестественный свидетель`;
- `Преступление возвращается через обычай`;
- повторяемый атмосферный мотив как будущая улика;
- `воздаяние → последствия`;
- пять рабочих квестов.

