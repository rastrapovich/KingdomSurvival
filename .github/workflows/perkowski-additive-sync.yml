name: Perkowski additive sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perkowski-additive-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append approved Perkowski material
        shell: bash
        run: |
          set -euo pipefail
          append_if_missing() {
            target="$1"
            marker="$2"
            fragment="$3"
            if grep -Fq "$marker" "$target"; then
              echo "skip $target: marker already present"
            else
              printf '\n' >> "$target"
              cat "$fragment" >> "$target"
              printf '\n' >> "$target"
              echo "appended $target"
            fi
          }

          append_if_missing "ProjectDocs/NARRATIVE.md" "# 30. Jan L. Perkowski — рабочие квестовые варианты" ".perkowski-sync/NARRATIVE_APPEND.md"
          append_if_missing "ProjectDocs/BESTIARY.md" "# 38. Jan L. Perkowski — вампирский случай" ".perkowski-sync/BESTIARY_APPEND.md"
          append_if_missing "ProjectDocs/LORE.md" "# 69. Jan L. Perkowski — опасный покойник" ".perkowski-sync/LORE_APPEND.md"
          append_if_missing "ProjectDocs/DEVELOPMENT_STATUS.md" "## Perkowski: славянский вампирский фольклор — 05.09.2026" ".perkowski-sync/STATUS_APPEND.md"

      - name: Commit additive integration and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/NARRATIVE.md ProjectDocs/BESTIARY.md ProjectDocs/LORE.md ProjectDocs/DEVELOPMENT_STATUS.md
          git rm -r .perkowski-sync .github/workflows/perkowski-additive-sync.yml
          git diff --cached --check
          git commit -m "docs: integrate Perkowski vampire folklore additively"
          git push origin HEAD:main
