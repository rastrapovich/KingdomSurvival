# 2. Источниковедческая граница

При переносе материала различаются три слоя:

- **литературная конструкция Коцюбинского** — композиция, драматургия, конкретные персонажи, сцены и художественное соединение мотивов;
- **гуцульский и карпатский фольклорно-этнографический материал**, часть которого независимо фиксируется у Владимира Шухевича, Владимира Гнатюка и других исследователей;
- **авторская адаптация `Kingdom Survival`**, которая должна согласовываться с уже утверждёнными правилами мира.

Перед канонизацией конкретного существа или обряда литературная версия по возможности сверяется с независимым фольклорным источником.

Особенно важные уже интегрированные опоры:

- `ProjectDocs/LORE.md` — региональность, знающие люди, профессиональная культура, смерть, песня, магия связей и хозяйственный порядок;
