# Приложение: Михаил Коцюбинский — «Тіні забутих предків»: хмарник, мифологическая экология, Чугайстир и Нявка

Источник: Михаил Коцюбинский — **«Тіні забутих предків»** (1911). Подробный разбор: `ProjectDocs/KOTSIUBYNSKY_SHADOWS_ADAPTATION.md`.

Литературный образ используется вместе с независимым фольклорным материалом; ни одна художественная сцена не становится готовой карточкой существа только потому, что присутствует в повести.

## KOT-B1. Хмарник / мольфароподобный специалист не является боевым магом [УТВЕРЖДЕНО — УТОЧНЕНИЕ]

Текущий `Хмарник` остаётся `[РАБОЧЕЕ / FOLKLORE]`. При дальнейшей разработке важны его хозяйственная функция, клиенты, противники, репутация, конкретная процедура и последствия успеха или неудачи. `Мольфар` не вводится как отдельный RPG-класс по умолчанию.

Источник: **[КОЦЮБИНСКИЙ + ГНАТЮК + KINGDOM SURVIVAL]**.

## KOT-B2. Воздействие на погоду показывать как процедуру с физической ценой [РЕКОМЕНДАЦИЯ / FOLKLORE + REFERENCE ONLY]

Если конкретный знающий человек действительно воздействует на погоду, предпочтительно показывать это как процедуру, зависящую от места, времени, знания, последовательности действий и физического усилия или риска.

Не использовать ману, слот заклинания или гарантированный эффект. Сцена должна позволять различать опытный прогноз, социальное представление, совпадение и реальное сверхъестественное воздействие.

Источник: **[КОЦЮБИНСКИЙ + МАКСИМОВ/МОШИНЬСКИЙ]**.

## KOT-B3. Коцюбинский усиливает уже утверждённый принцип мифологического хищника [УТВЕРЖДЕНО — УТОЧНЕНИЕ]

Нового универсального правила не создаётся. Разделы о мифологическом хищнике и внешней страшности остаются основой: одна нечеловеческая сила может охотиться на другую и при этом быть нейтральной или условно безопасной для человека; её уничтожение способно освободить место для прежней или худшей угрозы.

`Чугайстир` не становится каноническим видом только из-за этого уточнения.

Источник: **[КОЦЮБИНСКИЙ + ШУХЕВИЧ + KINGDOM SURVIVAL]**.

## KOT-B4. Чугайстир [РАБОЧЕЕ / FOLKLORE + REFERENCE ONLY]

Рабочее ядро: редкая пугающая лесная человекоподобная сущность, чья экология может включать охоту на опасные женские или лесные проявления. Внешняя страшность не равна враждебности человеку; возможен социальный контакт вместо обязательного боя.

До канонизации определить:

- регион и конкретную территорию;
- добычу и реальную экологическую связь;
- признаки до встречи;
- что сущность хочет от людей и чего не терпит;
- что изменится после убийства, изгнания или ухода;
- какую независимую этнографическую фиксацию дают Шухевич, Гнатюк или другой источник.

Не копировать буквально внешний образ, танец и точную сцену Коцюбинского. Даже сохранение традиционного имени возможно только после отдельной источниковедческой проверки и решения по региону.

## KOT-B5. Нявка [РАБОЧЕЕ / FOLKLORE + REFERENCE ONLY]

Рабочая региональная конструкция на пересечении русалочного комплекса, неспокойных мёртвых и памяти.

Главная сила мотива: сущность может появиться или быть воспринята как **конкретный умерший человек, которого живой отчаянно хочет увидеть**. Опасность строится на горе, распознавании и желании поверить, а не на универсальном соблазнении.

Перед канонизацией определить:

- является ли это сам умерший, подражатель, проявление памяти или иная сила;
- что является якорем;
- что сущность действительно знает;
- какие честные признаки позволяют отличить знакомую память от чужой воли;
- что произойдёт с живым и местом при сохранении или разрыве контакта.

Нявка **не объединяется автоматически** с рабочей `Мавкой`: близкие или пересекающиеся народные названия не требуют одной игровой сущности. Не вводится универсальное правило `все нявки = умершие девушки`.

## KOT-B6. Граница решений [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]

Не утверждаются объективные виды Чугайстира и Нявки, буквальная сцена из повести, универсальная иерархия лесных женских духов, гарантированное управление погодой или класс боевого мольфара.

Пункт 16 исходного исследования Коцюбинского **не утверждён** и не меняет действующие правила значимых встреч.
