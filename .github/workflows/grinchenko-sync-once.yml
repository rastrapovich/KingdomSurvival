name: One-shot Grinchenko docs sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grinchenko-sync-once.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize approved Grinchenko decisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lore_path = Path('ProjectDocs/LORE.md')
          bestiary_path = Path('ProjectDocs/BESTIARY.md')

          lore = lore_path.read_text(encoding='utf-8')
          bestiary = bestiary_path.read_text(encoding='utf-8')

          lore_marker = '# 61. Решения по Б. Д. Гринченко — локальный фольклор, свидетельства и бытовое сверхъестественное'
          lore_section = r'''

---

# 61. Решения по Б. Д. Гринченко — локальный фольклор, свидетельства и бытовое сверхъестественное

Источник: Б. Д. Гринченко — **«Этнографические материалы, собранные в Черниговской и соседних с ней губерниях»** (1895–1899). Полный утверждённый пакет решений и распределение по документам сохранены в `ProjectDocs/GRINCHENKO_ETHNOGRAPHIC_ADAPTATION.md`.

Материал используется не как готовая единая демонологическая система, а как корпус локальных рассказов, бытовых поверий, противоречивых свидетельств, природных объяснений, пословиц, загадок и форм человеческой реакции на неизвестное. Источник приёма: **[ГРИНЧЕНКО + KINGDOM SURVIVAL]**.

## 61.1. Мир знает локальные рассказы, а не единую официальную демонологию [УТВЕРЖДЕНО — ПРИНЦИП]

Одно и то же явление в соседних поселениях может иметь разные названия, признаки, объяснения и способы защиты. Крестьянин, охотник, старуха, знающий человек, ремесленник и представитель власти могут описывать один случай несовместимыми словами.

Разные названия не доказывают существование разных объективных видов существ. Разные способы защиты не получают автоматической истинности только потому, что их соблюдают местные.

Для значимого регионального поверья полезно фиксировать:

`кто рассказывает → где слышал → что считает признаком → чего боится → что делает для защиты → чем версия отличается от соседней → какие наблюдения повторяются`.

## 61.2. Животное может быть посредником человеческого восприятия [УТВЕРЖДЕНО][ВЕРОВАНИЕ]

В отдельных регионах люди могут считать, что некоторые собаки или другие животные замечают нечистое и опасные места раньше человека.

Разрешён фольклорный мотив **ярчука** — особой собаки, способной видеть нечистую силу. Это региональное верование и источник конкретных историй, а не объективный закон о всех собаках мира.

Практический слой поверья может поддерживаться наблюдаемыми признаками: животное смотрит в пустое место, не переходит порог, отказывается идти к воде или могиле, скулит возле конкретного участка дороги. Объективная причина каждого случая устанавливается отдельно.

## 61.3. Ведьма — социальная категория, а обвинение начинается с материальной беды [УТВЕРЖДЕНО — ПРИНЦИП]

Ведьма не является по умолчанию отдельной расой или очевидным классом врага.

Ведьмой внутри общества могут считать:

- реального носителя сверхъестественного знания;
- знающую женщину;
- колдунью;
- хозяйку с дурной репутацией;
- человека, вокруг которого накопились совпадения и слухи;
- полностью невиновного обвинённого.

Обвинение предпочтительно рождается из конкретной беды: исчезновения молока, падежа скота, болезни ребёнка, града, засухи, порчи урожая, конфликта соседей, внезапного богатства или другого наблюдаемого ущерба.

Форма:

`реальная беда → человеческая причинность → подозреваемый → давление/насилие → расследование → объективная причина`.

Страх перед сверхъестественным способен создавать совершенно реальное человеческое насилие даже тогда, когда обвинение ошибочно. Последствия такого насилия не исчезают после раскрытия истины.

## 61.4. У нечеловеческого порядка может быть собственная бытовая жизнь [УТВЕРЖДЕНО — ПРИНЦИП]

В рассказах жителей допустимы представления о нечеловеческих силах, у которых существуют собственные пиры, свадьбы, слуги, музыканты, ремесленники, работа, обмен услугами и внутренний порядок.

Это не утверждает единую объективную «цивилизацию чертей» во всём мире. Мотив используется локально и конкретно.

Разрешён мотив **сверхъестественной свадьбы** или другого общественного обряда, внешне похожего на человеческий, но принадлежащего чужому порядку. Сам мотив не является утверждённым квестом.

## 61.5. Нечистое может быть не невидимым, а неправильно понятым [УТВЕРЖДЕНО — РАБОЧИЙ МИФОЛОГИЧЕСКИЙ ПРИНЦИП]

Допустимы отдельные случаи, где человек видит явление, но ошибочно воспринимает его как знакомую категорию: обычного гостя, стадо, животное, двор, хозяйственную работу или привычное помещение.

Этот принцип не является универсальным законом магии. Для каждого случая отдельно устанавливаются причина, границы и признаки ошибки восприятия.

## 61.6. Легенда привязана к конкретному месту, а «плохому месту» не обязательно нужен монстр [УТВЕРЖДЕНО — ПРИНЦИП]

Значимая сверхъестественная история предпочтительно привязывается к реально используемому локусу: колодцу, дороге, могиле, оврагу, мельнице, броду, меже, дому, лесному участку или хозяйственной постройке.

Место может оставаться опасным, тревожным или аномальным без постоянно живущего там существа. Оно способно повторять след прежнего события, менять поведение животных и людей, проявляться только при определённых условиях или сохранять человеческую репутацию после того, как первоначальная причина исчезла.

Сверхъестественное также может проявляться через **повторение человеческого действия**: работу, пир, поездку, свадьбу, ремесло, песню или иной процесс. Это позволяет прошлому ощущаться через действие, а не только через визуальный образ призрака.

## 61.7. Человек может быть посредником между человеческим и нечеловеческим хозяйством [УТВЕРЖДЕНО — ПРИНЦИП]

Ремесленник, музыкант, лекарь, кузнец, портной, сапожник, проводник или другой специалист может однажды работать для нечеловеческой силы и вернуться в обычное общество.

Такой человек не становится автоматически культистом или врагом людей. Он может хранить практическое знание о чужом порядке, скрывать опыт из страха или стыда, иметь долг либо сохранять профессиональные отношения.

В рассказах об исчезновениях допускается версия, что человека не убили, а **забрали играть, служить, работать или выполнять поручение**. После обнаружения пропавшего нельзя автоматически считать, что он хочет вернуться: чужой порядок мог дать ему пищу, мастерство, уважение, богатство или место, которого он не имел среди людей.

## 61.8. Народная причинность относится и к природным явлениям [УТВЕРЖДЕНО — ПРИНЦИП]

Град, буря, засуха, необычный туман, пожар, вихрь, паводок и иные природные события могут иметь одновременно:

- объективную материальную причину;
- бытовое объяснение;
- местное фольклорное объяснение;
- социального виновника, которого люди назначили сами.

Фольклорная версия иногда ошибочна, иногда частично верна, иногда сохраняет наблюдение, которое официальное объяснение пропустило. Ни одна версия не получает привилегии без проверки конкретного случая.

## 61.9. Устная традиция хранит правила в повреждённой форме [УТВЕРЖДЕНО — ПРИНЦИП]

Пословица, поговорка, короткая формула, загадка, детская игра, считалка или страшилка может сохранять фрагмент старого правила, имени, маршрута, события или предупреждения после утраты исходного смысла.

Такой текст не является автоматической буквальной истиной. Его ценность — в повторяемой детали, которую можно сопоставить с другими свидетельствами.

Особенно допустим мотив, где взрослые забыли происхождение традиции, а дети продолжают привычную игру или формулу, в которой сохранилась последовательность старого обряда. Будничность такого знания предпочтительнее декоративной «магической загадки».

## 61.10. Один рассказ должен иметь варианты, а совпадающая деталь может быть уликой [УТВЕРЖДЕНО — ПРИНЦИП]

Повторяющаяся история в нескольких деревнях не обязана совпадать дословно.

Предпочтительно:

`разные персонажи / причины / названия → разное объяснение → несколько общих деталей`.

Именно устойчивое совпадение малых деталей способно указывать на общий реальный источник. Три несовместимые легенды могут быть ценнее одного «правильного» рассказа, если во всех повторяются один звук, предмет, поведение животного, время или место.

## 61.11. Локальный фольклор должен существовать до прямой встречи с существом [УТВЕРЖДЕНО — ПРИНЦИП]

Мир не должен ощущаться так, будто жители впервые узнают о мифологической угрозе вместе с героем.

До прямого контакта могут существовать:

- бытовые запреты;
- противоречивые свидетельства;
- поговорки;
- детские формулы;
- странные способы защиты;
- истории пропавших;
- ремесленные предупреждения;
- локальные названия;
- ошибочные обвинения;
- повторяющиеся признаки места.

Это не означает, что люди знают объективную истину. Они знают **культурный след** явления.

## 61.12. Граница решений по Гринченко

Раздел 61 не утверждает:

- объективное сверхъестественное зрение всех собак;
- единую природу ярчука для всех регионов;
- истинность любого обвинения в ведьмовстве;
- существование единой цивилизации нечистой силы;
- обязательную реальность каждой сверхъестественной свадьбы;
- универсальную подмену восприятия;
- наличие существа за каждым «плохим местом»;
- сверхъестественную причину каждого природного бедствия;
- буквальную истинность каждой пословицы, загадки или детской игры;
- единую официальную демонологию мира.

Главная производственная формула слоя:

> **локальный рассказ → противоречивые свидетели → повторяющаяся деталь → бытовое/социальное последствие → проверка места, человека и правила → объективная причина конкретного случая.**

