name: Polesie docs sync

on:
  push:
    branches:
      - work/polesie-demonology-integration
    paths:
      - .github/workflows/polesie-docs-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate approved Polesie material
        run: python .github/scripts/polesie_sync.py

      - name: Validate documentation diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/polesie-docs-sync.yml .github/scripts/polesie_sync.py
          test "$(find . -maxdepth 1 -type f -name 'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v*.md' | wc -l)" -eq 1
          test -f KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_26.md
          test -f ProjectDocs/POLESIE_DEMONOLOGY_ADAPTATION.md
          grep -q '# 31A. Полесский фольклорный слой' ProjectDocs/LORE.md
          grep -q '# 12A. Полесские дополнения' ProjectDocs/BESTIARY.md
          grep -q '## 25.11. Пакет Полесья' ProjectDocs/NARRATIVE.md
          grep -q 'Документальная интеграция 05.09.2026 — Полесье' ProjectDocs/DEVELOPMENT_STATUS.md
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              '.github/scripts/polesie_sync.py',
              '.github/workflows/polesie-docs-sync.yml',
              'ProjectDocs/LORE.md',
              'ProjectDocs/BESTIARY.md',
              'ProjectDocs/NARRATIVE.md',
              'ProjectDocs/DEVELOPMENT_STATUS.md',
              'ProjectDocs/POLESIE_DEMONOLOGY_ADAPTATION.md',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Unexpected changed files: {sorted(changed)}')
          PY

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: integrate Polesie demonology decisions'
          git push origin HEAD:work/polesie-demonology-integration
