# 39. Adam Mickiewicz — `Ballady i romanse`: сохранённая обязанность и вынужденное поведение

Источник: Adam Mickiewicz — `Świtezianka`, `Lilije`, `Świteź`, `Rybka`, `To lubię`. Подробный разбор: `ProjectDocs/MICKIEWICZ_BALLADY_I_ROMANSE_ADAPTATION.md`.

Литературные конструкции используются как **REFERENCE ONLY**, если конкретный элемент не поддержан независимым фольклорным материалом. Раздел уточняет способы проектирования уже разрешённых мёртвых, водных сущностей, свидетелей и локальных явлений и не создаёт новые обязательные виды.

## 39.1. После смерти или превращения может сохраниться одна доминирующая человеческая обязанность [УТВЕРЖДЕНО — ПРИНЦИП ПРОЕКТИРОВАНИЯ / REFERENCE ONLY + FOLKLORE]

Сущность не обязана сохранять целую человеческую личность. Для сильного персонального случая разрешено, что одна связь переживает остальные воспоминания и определяет почти всё поведение.

Примеры:

- мать продолжает приходить к ребёнку;
- должник пытается вернуть конкретную вещь;
- погибший выполняет последнюю работу;
- человек продолжает кормить или охранять животных;
- умерший ждёт того, кому дал обещание;
- превращённый человек сохраняет одну семейную обязанность.

В паспорте отдельно указываются `сохранившаяся обязанность`, `утраченные части личности`, `как обязанность проявляется`, `можно ли её завершить`, `что произойдёт после завершения`.

Источник конструкции: **[MICKIEWICZ / `RYBKA` + НАРОДНАЯ ДЕМОНОЛОГИЯ ПОЛЕСЬЯ + KINGDOM SURVIVAL]**.

## 39.2. Враждебное поведение может быть тюрьмой самой сущности [УТВЕРЖДЕНО — ПРИНЦИП ПРОЕКТИРОВАНИЯ / REFERENCE ONLY]

То, **что сущность вынуждена делать**, не обязано совпадать с тем, **чего она хочет**.

Для отдельного явления допустима конструкция, где оно обязано:

- пугать каждого путника;
- перекрывать одну дорогу;
- повторять один эпизод насилия;
- нападать на вошедших в локус;
- звать людей;
- охранять место;
- повторять одну фразу или действие.

Перед проектированием проверяется:

`навязанное действие → настоящее желание → условие повторения → кто/что удерживает состояние → кто получает выгоду от его продолжения → можно ли изменить условие → что освободится или изменится после разрыва`.

Это не создаёт универсальное чистилище и не означает, что вся агрессия нечисти является просьбой о помощи. Источник конструкции: **[MICKIEWICZ / `TO LUBIĘ` + KINGDOM SURVIVAL]**.

## 39.3. Водная женщина — биография, а не раса [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ / REFERENCE ONLY + FOLKLORE]

`Świtezianka`, русалка, утопленница, превращённая женщина и иная женская фигура у воды не объединяются автоматически в биологический класс.

Для каждого заметного случая используются уже действующие вопросы разделов 26.6, 26.12 и 36.3:

`происхождение → человеческая биография или отсутствие таковой → конкретная вода → причина связи → сохранившееся отношение → признаки → правило → желание → последствия для хозяйства и людей`.

Источник: **[MICKIEWICZ / `ŚWITEZIANKA` + `RYBKA` + ERBEN / KYTICE + FOLKLORE + KINGDOM SURVIVAL]**.

## 39.4. Сверхъестественный свидетель имеет ограниченную перспективу [УТВЕРЖДЕНО — ПРИНЦИП ПРОЕКТИРОВАНИЯ]

Мёртвый, место, вода, растение, животное или аномальный предмет могут хранить свидетельство прошлого, но не становятся детекторами объективной истины.

Свидетель сообщает или повторяет только **узкий фрагмент**, объяснимый его связью с событием. Он может:

- не знать мотива;
- видеть только один момент;
- ошибочно интерпретироваться людьми;
- иметь собственную цель;
- быть уничтожен и тем самым лишить героя части информации.

Этот принцип расширяет разделы 7, 36.8 и 37.4 и напрямую связан с нарративным инструментом `Сверхъестественный свидетель`.

