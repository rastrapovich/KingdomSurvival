# Приложение: Adam Mickiewicz — `Dziady II`: мёртвые внутри известного порядка

Источник: Adam Mickiewicz — **`Dziady`, часть II**. Подробный разбор: `ProjectDocs/MICKIEWICZ_DZIADY_II_ADAPTATION.md`.

Это **литературный референс проектирования**, а не новая объективная таксономия нежити.

## DZII-B1. Нарушение ожидаемой последовательности является уликой [УТВЕРЖДЕНО — ПРИНЦИП ПРОЕКТИРОВАНИЯ]

Если конкретный региональный обряд имеет устойчивый и уже понятный участникам порядок контактов, **появление не того мёртвого, не в тот момент или не тем способом** рассматривается как значимый диагностический признак.

Формула:

`известный порядок → повторяемость подтверждает ожидание → появляется исключение → исключение направляет расследование`.

Незваное проявление не становится автоматически более сильным или более злым. Важен сам факт, что оно **не помещается в известную местным классификацию**.

## DZII-B2. Расширение конструктора значимого неспокойного мёртвого [УТВЕРЖДЕНО — РЕКОМЕНДАЦИЯ]

Для мёртвого, участвующего в поминальном/обрядовом случае, дополнительно проверять:

1. Ожидали ли его появление и почему.
2. Кто считает его своим умершим, а кто отказывается признавать.
3. Какого конкретного человеческого отношения ему не хватает или что осталось незавершённым.
4. Что он действительно способен сообщить, а чего знать не может.
5. Что изменилось среди живых после его смерти.
6. Какое действие живых способно изменить его состояние.
7. Где заканчивается объективное проявление и начинается народная моральная классификация.

Главное правило: **конкретный мёртвый проектируется через биографию, смерть, место, погребение, долг и человеческие отношения, а не через класс души.**

## DZII-B3. Мёртвый-должник / угнетатель [РАБОЧЕЕ][REFERENCE ONLY]

Разрешена рабочая конструкция конкретного умершего, чья прежняя власть или жестокость продолжает существовать через долги, собственность, потомков, право, память и людей, которым он навредил.

Пострадавшие **не обязаны помогать** такому мёртвому только потому, что он страдает после смерти. Расследование должно возвращать вопрос в человеческий мир: что осталось от прежней власти и кто сегодня продолжает получать выгоду или платить цену.

Гуси, вороны/вороны, совы или другие птицы из литературного образа могут быть переосмыслены как **локальный визуальный/звуковой хор последствий**, поведение обычных животных или несколько проявлений памяти конкретных жертв. Они не вводятся как новая раса врагов и не доказывают космический закон наказания.

## DZII-B4. Непризнанный / бесприютный мёртвый [РАБОЧЕЕ][REFERENCE ONLY]

Разрешена рабочая форма умершего, который не имеет признанного места в памяти живых: спорное родство, отсутствие дома, исключение из общины, неизвестное происхождение или существование между несколькими человеческими мирами.

Признание, принятие, отказ или определение обязанности могут менять состояние конкретного случая. Это не вводит универсальную магию имени или членства.

## DZII-B5. Незваный молчащий мёртвый с живым якорем [РАБОЧЕЕ][REFERENCE ONLY]

Разрешена конструкция для расследования:

- проявление появляется **вне ожидаемого порядка**;
- не даёт объясняющей речи;
- не реагирует как известные участникам обряда мёртвые;
- его поведение стабильно связано с конкретным живым человеком, вещью или отношением;
- этот живой якорь становится направлением расследования.

Сущность показывает противоречие, но **не выдаёт готовый ответ**.

Это не отдельный вид мёртвых и не правило, что любой молчащий призрак обязательно привязан к живому.

## DZII-B6. Граница решений [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]

Не вводятся объективные классы душ Мицкевича, универсальная обязательность обряда, автоматическая правдивость призраков, автоматическое моральное воздаяние или общий способ завершить всех мёртвых одним действием.

Источник приёма для дальнейшей разработки: **[MICKIEWICZ / DZIADY II + KINGDOM SURVIVAL]**.
