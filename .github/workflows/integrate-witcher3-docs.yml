name: Integrate Witcher 3 narrative docs

on:
  push:
    paths:
      - '.github/workflows/integrate-witcher3-docs.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate approved narrative principles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          narrative_path = Path('ProjectDocs/NARRATIVE.md')
          status_path = Path('ProjectDocs/DEVELOPMENT_STATUS.md')
          adaptation_path = Path('ProjectDocs/WITCHER_3_QUEST_ADAPTATION.md')
          workflow_path = Path('.github/workflows/integrate-witcher3-docs.yml')

          narrative = narrative_path.read_text(encoding='utf-8')
          adaptation = adaptation_path.read_text(encoding='utf-8')

          source_anchor = "- `[DISCO ELYSIUM]` — приём, адаптированный из анализа диалогов, проверок, микрореактивности и персонажного письма `Disco Elysium`;"
          source_line = source_anchor + "\n- `[THE WITCHER 3]` — приём, адаптированный из структуры контрактов, расследований, подготовки, возврата к заказчику и отложенных последствий `The Witcher 3: Wild Hunt`;"
          if '[THE WITCHER 3]' not in narrative:
              if source_anchor not in narrative:
                  raise SystemExit('Source-label anchor not found')
              narrative = narrative.replace(source_anchor, source_line, 1)

          if '# 11B. Инструментарий The Witcher 3:' not in narrative:
              start = adaptation.index('# 2. Утверждённый инструментарий')
              end = adaptation.index('\n---\n\n# 6. Производственные правила', start)
              body = adaptation[start:end].strip()
              body = body.replace('# 2. Утверждённый инструментарий\n\n', '', 1)
              body = re.sub(r'^## 2\.(\d+)\.', r'## 11B.\1.', body, flags=re.M)
              body = body.replace('# 3. Отдельное решение: не копировать доску ведьмачьих заказов', '## 11B.15. Не копировать универсальную доску заказов')
              body = body.replace('# 4. «Дело» как рабочая форма расследования', '## 11B.16. «Дело» как рабочая форма расследования')
              body = body.replace('# 5. Рабочий эталон большого побочного расследования', '## 11B.17. Рабочий эталон большого побочного расследования')
              body = re.sub(r'^## (\d+)\. ', r'### \1. ', body, flags=re.M)
              header = '# 11B. Инструментарий The Witcher 3: расследования и заказы [ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + KINGDOM SURVIVAL]\n\nПодробный разбор и границы переноса: `ProjectDocs/WITCHER_3_QUEST_ADAPTATION.md`.\n\n'
              section = header + body + '\n\n### Производственная граница\n\n`Дело` и 13-шаговый эталон являются рабочими формами, а не утверждённой UI/quest-системой. Сначала структура проверяется на реальном первом большом квесте; только после этого допускается проектирование универсальной quest/dialogue-архитектуры, флагов, UI и проверок.\n\n---\n'
              anchor = '\n# 12.'
              if anchor not in narrative:
                  raise SystemExit('Section 12 anchor not found')
              narrative = narrative.replace(anchor, '\n' + section + '\n# 12.', 1)

          journal_row = '| 05.09.2026 | Пакет `The Witcher 3` по расследованиям и заказам утверждён: заказ как маленькая история, изменение первоначальной версии, три класса улик, конкурирующие интерпретации, подготовка через знание, влияние состава отряда без блокировки, разные формы решения, возвращение к заказчику, ограниченное число значимых состояний, отложенное эхо и несколько входов в одно дело добавлены в инструментарий; «Дело» и 13-шаговый эталон сохранены как `[РАБОЧЕЕ]`. Подробности: `WITCHER_3_QUEST_ADAPTATION.md`. | ИНСТРУМЕНТАРИЙ / РАБОЧЕЕ |'
          if journal_row not in narrative:
              journal_anchor = '\n---\n\n# 29. Следующий нарративный этап'
              if journal_anchor not in narrative:
                  raise SystemExit('Narrative journal anchor not found')
              narrative = narrative.replace(journal_anchor, '\n' + journal_row + journal_anchor, 1)

          narrative_path.write_text(narrative, encoding='utf-8')

          status = status_path.read_text(encoding='utf-8')
          status_entry = "**Документальная интеграция 05.09.2026 — `The Witcher 3`, расследования и заказы:** создан `ProjectDocs/WITCHER_3_QUEST_ADAPTATION.md`; в `NARRATIVE.md` добавлен `[ИНСТРУМЕНТАРИЙ][THE WITCHER 3]` для контрактов как маленьких историй, расследований с изменением первоначальной версии, трёх классов улик, конкурирующих интерпретаций, причинно выведенных следов, ошибающегося заказчика, подготовки через знание, влияния состава экспедиции без жёсткой блокировки, разнообразных решений, возврата к заказчику, ограниченного числа значимых состояний, отложенных последствий и нескольких входов в одно дело. Рабочая форма `«Дело»` и 13-шаговый эталон большого расследования сохранены как `[РАБОЧЕЕ]`, а не как готовая UI/quest-система. Универсальная quest/dialogue-архитектура по-прежнему отложена до первого доказанного большого квеста. Код, сцены, ассеты, пакеты, ProjectSettings, `LORE.md`, `BESTIARY.md` и общий игровой канон v1.26 на этом шаге не менялись."
          if status_entry not in status:
              status_anchor = '\n---\n\nГлавный следующий дизайн-приоритет не меняется:'
              if status_anchor not in status:
                  raise SystemExit('Development-status anchor not found')
              status = status.replace(status_anchor, '\n\n' + status_entry + status_anchor, 1)
          status_path.write_text(status, encoding='utf-8')

          workflow_path.unlink()
          PY

      - name: Validate document changes
        shell: bash
        run: |
          git diff --check
          grep -F '# 11B. Инструментарий The Witcher 3:' ProjectDocs/NARRATIVE.md
          grep -F '«Дело» как рабочая форма' ProjectDocs/NARRATIVE.md
          grep -F 'WITCHER_3_QUEST_ADAPTATION.md' ProjectDocs/DEVELOPMENT_STATUS.md
          test -f ProjectDocs/WITCHER_3_QUEST_ADAPTATION.md
          test ! -f .github/workflows/integrate-witcher3-docs.yml

      - name: Commit integrated documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProjectDocs/NARRATIVE.md ProjectDocs/DEVELOPMENT_STATUS.md .github/workflows/integrate-witcher3-docs.yml
          git commit -m 'docs: integrate Witcher 3 investigation principles'
          git push origin HEAD:main
