name: One-shot folklore expansion sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate approved folklore expansion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_before(path, needle, block, unique):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if unique in text:
                  return
              if needle not in text:
                  raise SystemExit(f'Needle not found in {path}: {needle[:80]!r}')
              text = text.replace(needle, block.rstrip() + '\n\n' + needle, 1)
              p.write_text(text, encoding='utf-8')

          def append_once(path, block, unique):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if unique in text:
                  return
              p.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          lore_block = r'''
          # 68. Дополнения к восьми фольклорным направлениям: конкретные правила и следствия

          Этот раздел фиксирует утверждённые 05.09.2026 дополнения к уже существующим направлениям `неправильные мёртвые / хозяйственные пространства / лес / вода / опасное время / ведьма / волколак / клад`. Он **не повторяет** базовые принципы разделов 50, 56–67, а добавляет конкретные региональные модели и ограничения, которые можно использовать при дальнейшей разработке.

          Источники слоя: Д. К. Зеленин; Н. Я. Никифоровский; Л. Н. Виноградова и корпус `Народной демонологии Полесья`; Д. Н. Садовников; сравнительный полуденный материал. Источник авторской адаптации: **[ДРУГОЙ ИСТОЧНИК + KINGDOM SURVIVAL]**.

          ## 68.1. «Недожитый срок» как региональная модель мёртвого [УТВЕРЖДЕНО][ВЕРОВАНИЕ]

          В отдельных регионах разрешено верование, что человек, погибший раньше ожидаемого жизненного срока, может оставаться в особом незавершённом состоянии до времени, когда его жизнь как будто должна была завершиться естественно.

          Этот мотив **не вводит объективно известную каждому человеку продолжительность жизни** и не утверждает, что все преждевременно умершие действуют одинаково. Для конкретной истории отдельно определяется, является ли ожидаемый срок:

          - народным объяснением;
          - символической формой незавершённости;
          - реально действующим условием конкретного мёртвого;
          - ошибкой родственников или общины.

          Главное отличие от общего принципа раздела 57: предполагаемая дата может сама стать **наблюдаемым рубежом истории**, после которого состояние мёртвого, семьи или места проверяется заново.

          Источник: **[ДРУГОЙ ИСТОЧНИК: ЗЕЛЕНИН + KINGDOM SURVIVAL]**.

          ## 68.2. Дорожная могила может поддерживаться самим движением людей [УТВЕРЖДЕНО][ВЕРОВАНИЕ / КУЛЬТУРНЫЙ ПРИНЦИП]

          В отдельных регионах придорожная могила необычно погибшего человека может поддерживаться простым действием проходящих: путник оставляет ветку, щепку, камень или иной дешёвый знак памяти.

          Объективная сверхъестественная необходимость действия не утверждается. Важен культурный эффект:

          `дорога проходит мимо могилы → множество людей невольно поддерживает память → маршрут меняется → обычай прекращается → меняется состояние места и отношение потомков к умершему`.

          Поэтому перенос тракта способен нарушить не только логистику, но и старый порядок памяти.

          Источник: **[ДРУГОЙ ИСТОЧНИК: ЗЕЛЕНИН + KINGDOM SURVIVAL]**.

          ## 68.3. Хозяин дома не обязан следовать за семьёй при переселении [УТВЕРЖДЕНО — ДОПУСТИМАЯ ПРИЧИННОСТЬ / FOLKLORE]

          Для конкретного домового или иного хозяина жилища разрешена модель, где его отношение связано прежде всего **с самим домом/местом**, а не автоматически со всеми живущими в нём людьми.

          При переселении семьи такой хозяин может:

          - остаться в старом доме;
          - не признать новое жилище;
          - позже вступить в отношения с другими жильцами;
          - изменить поведение после разрушения или переустройства старого дома.

          Не утверждается универсальное правило домового: другие сущности или региональные традиции могут быть связаны с семьёй, родом, печью, двором, вещью или иным носителем.

          Источник: **[ДРУГОЙ ИСТОЧНИК: НИКИФОРОВСКИЙ + KINGDOM SURVIVAL]**.

          ## 68.4. Смена функции хозяйственного пространства может менять старое отношение [УТВЕРЖДЕНО — ПРИНЦИП]

          При перестройке значимого хозяйственного здания проверяется не только физическое сохранение стен, но и **изменение функции места**.

          Формула:

          `здание использовалось для действия A → вокруг действия возникли люди, правила и возможное сверхъестественное отношение → пространство переводят на действие B → старый порядок перестаёт совпадать с новой практикой → возникает необходимость понять, сохранить, изменить или прекратить отношение`.

          Поэтому амбар, превращённый в мастерскую, баня, ставшая складом, или овин, используемый для иной работы, могут создавать новое состояние мира. Это **не** правило «любой дух ненавидит upgrade» и не требует объективной сущности в каждой постройке.

          Источник: **[ДРУГОЙ ИСТОЧНИК: НИКИФОРОВСКИЙ + KINGDOM SURVIVAL]**.

          ## 68.5. На опушке можно скрывать настоящую цель пути [УТВЕРЖДЕНО][ВЕРОВАНИЕ]

          В отдельной лесной традиции допустим обычай **не произносить настоящую цель похода при входе в лес**, а иногда намеренно называть ложное направление или назначение пути.

          Это прежде всего региональное `[ВЕРОВАНИЕ]`. Для конкретного леса отдельно определяется:

          - имеет ли значение сама ложь;
          - имеет ли значение сокрытие намерения;
          - работает ли обычай только как дисциплина опытных проводников;
          - связан ли он с реальным хозяином территории;
          - является ли традиция поздним объяснением иного правила.

          Сопутствующие действия вроде одежды, надетой наизнанку, могут существовать как народные способы, но не превращаются в универсальную RPG-кнопку выхода из любого лесного блуждания.

          Источник: **[ДРУГОЙ ИСТОЧНИК: НИКИФОРОВСКИЙ + KINGDOM SURVIVAL]**.

          ## 68.6. Изменение гидрологии может менять границы водного порядка [УТВЕРЖДЕНО — ПРИНЦИП]

          Для конкретной реки, озера, мельничной воды или иного водного комплекса изменение физической связи водоёмов способно менять и существующее сверхъестественное отношение, если оно действительно связано с этой водой.

          Мельница, плотина, канал, перекрытие протоки, новое русло или соединение прежде раздельных вод могут:

          - менять границу владения конкретной сущности;
          - сталкивать прежние права;
          - переносить хозяйственный конфликт вниз или вверх по течению;
          - делать старый договор неполным;
          - открывать доступ туда, куда прежде не было водной связи.

          Не утверждается единый `водяной`, контролирующий любую соединённую воду. Конкретная сущность, право и механизм определяются для места отдельно.

          Источник: **[ДРУГОЙ ИСТОЧНИК: НИКИФОРОВСКИЙ + KINGDOM SURVIVAL]**.

          ## 68.7. Процветание одного двора может восприниматься как украденный достаток другого [УТВЕРЖДЕНО][ВЕРОВАНИЕ]

          В отдельных регионах обвинение в ведьмовстве может строиться не только на самом ущербе, но на **нулевой сумме хозяйственного благополучия**: если у нескольких семей одновременно пропадает молоко, приплод, урожайность или иной достаток, а один двор резко богатеет, его успех начинает восприниматься как возможное присвоение чужой доли.

          Это социально сильная, но не автоматически истинная причинность:

          `соседям стало хуже + одному стало лучше → общество связывает события → процветание превращается в улику → начинается давление → расследование отделяет хозяйственную, человеческую и сверхъестественную причины`.

          Сам успех хозяйства не доказывает колдовство.

          Источник: **[ДРУГОЙ ИСТОЧНИК: ВИНОГРАДОВА / НАРОДНАЯ ДЕМОНОЛОГИЯ ПОЛЕСЬЯ + KINGDOM SURVIVAL]**.

          ## 68.8. Перенесённая хозяйственная мелочь может считаться переносом блага [УТВЕРЖДЕНО][ВЕРОВАНИЕ]

          Солома, трава, земля, роса, кусок ткани или иная малая вещь, перенесённая с чужого двора/поля, может внутри региональной культуры восприниматься как **носитель переноса хозяйственного достатка**.

          Такое представление особенно хорошо сочетается с объективным принципом магии связей, но **не является его автоматическим доказательством**. Найденная чужая вещь может быть:

          - частью реально работающего действия;
          - защитой;
          - бытовым предметом;
          - подброшенной уликой;
          - суеверно истолкованной случайностью.

          Следовательно, подобная находка является хорошей уликой для расследования, но не авторским маркером виновности.

          Источник: **[ДРУГОЙ ИСТОЧНИК: ВИНОГРАДОВА / ПОЛЕСЬЕ + МАКСИМОВ + МОШИНЬСКИЙ + KINGDOM SURVIVAL]**.

          ## 68.9. Условие клада может защищать долю участников труда [УТВЕРЖДЕНО — ПРИНЦИП]

          Для значимого клада допустимо право не только прежнего владельца, наследника, хранителя, территории или выполнившего условие человека, но и **людей, благодаря труду которых богатство было извлечено**.

          Конкретное условие может требовать разделить найденное между землекопами, проводниками, нанятыми работниками или иной заранее определённой группой.

          При проектировании такого клада разделять:

          - обычное право и договор работников;
          - народное верование об условии;
          - реальное сверхъестественное условие, если оно существует;
          - человеческую попытку обойти распределение.

          Не вводится универсальный закон, по которому каждый клад «читает намерения» и исчезает при жадности.

          Источник: **[ДРУГОЙ ИСТОЧНИК: САДОВНИКОВ + KINGDOM SURVIVAL]**.

          ## 68.10. Граница дополнений

          Раздел 68 не утверждает единую метафизику срока жизни, домового в каждом здании, обязательную магическую силу дорожного поминовения, универсальную эффективность лесной лжи, единого хозяина всех соединённых вод, объективность обвинений в краже достатка или магическое условие каждого клада.

          Главное правило пакета:

          > **конкретная культурная практика или фольклорный мотив становится сильным материалом только тогда, когда изменяет человека, работу, дорогу, дом, воду, право собственности или отношения — а объективная причина устанавливается отдельно.**
          '''
          append_once('ProjectDocs/LORE.md', lore_block, '# 68. Дополнения к восьми фольклорным направлениям')

          lore_journal_row = '| 05.09.2026 | Утверждены дополнения к восьми фольклорным направлениям: недожитый срок и дорожное поминовение, непереносимость хозяина дома по умолчанию, смена функции хозяйственного пространства, сокрытие цели пути в лесу, изменение водной юрисдикции через гидрологию, социальная модель «украденного достатка», неоднозначные хозяйственные улики и право работников на долю значимого клада. | УТВЕРЖДЕНО / ВЕРОВАНИЕ / РАБОЧЕЕ |'
          insert_before('ProjectDocs/LORE.md', '\n\n---\n\n# 53. Следующий шаг наполнения', lore_journal_row, 'недожитый срок и дорожное поминовение')

          bestiary_block = r'''
          # 38. Конкретизация хозяйственных, лесных, полуденных и волколачьих проявлений

          Раздел фиксирует утверждённые дополнения к уже существующим архетипам и **не создаёт обязательный набор новых видов существ**. Источники: Никифоровский, Полесье, сравнительный полуденный материал; авторская адаптация `Kingdom Survival`.

          ## 38.1. Хозяин старого дома может остаться с самим местом [РЕКОМЕНДАЦИЯ / FOLKLORE]

          При разработке конкретного домового или иного хозяина жилища разрешено отделять его связь с **домом** от связи с **семьёй**.

          Возможная модель:

          `семья уходит → сущность остаётся → пустой дом продолжает проявлять старые привычки → разрушение/перестройка меняет отношение → сущность может признать или не признать нового хозяина`.

          Это не универсальная биология домового. Для конкретной сущности обязательно определить носитель отношения: дом, печь, двор, род, человек, вещь или иной локальный якорь.

          Источник: **[ДРУГОЙ ИСТОЧНИК: НИКИФОРОВСКИЙ + KINGDOM SURVIVAL]**.

          ## 38.2. Изменение назначения постройки может быть триггером проявления [РЕКОМЕНДАЦИЯ / FOLKLORE]

          Хозяйственная сущность или аномалия может реагировать не на косметическую перестройку, а на изменение **человеческой функции пространства**.

          Для конкретного случая проверять:

          `какая работа была нормой → какой порядок вокруг неё сложился → какую новую работу вводят → что именно перестаёт выполняться → какие признаки появляются → можно ли договориться, изменить функцию или прекратить старое отношение`.

          Не использовать как автоматическое наказание за строительство или апгрейд.

          ## 38.3. Лесной хозяин может воспроизводить знакомый голос [УТВЕРЖДЕНО — ДОПУСТИМАЯ ФУНКЦИЯ / FOLKLORE]

          Для конкретного лесного хозяина или лесного явления разрешено проявление через **голос из неправильного места**, а не обязательную визуальную копию человека.

          Примеры функции:

          - голос спутника звучит впереди, хотя человек стоит рядом;
          - зов погибшего или пропавшего родственника ведёт с дороги;
          - знакомый крик животного раздаётся там, где его быть не может;
          - несколько свидетелей слышат разные знакомые голоса из одной стороны леса.

          Функция должна иметь территориальную и причинную привязку и не становится универсальной способностью всех леших.

          Источник: **[ДРУГОЙ ИСТОЧНИК: НИКИФОРОВСКИЙ + KINGDOM SURVIVAL]**.

          ## 38.4. Полуденное проявление может проверять ремесленное знание [РАБОЧЕЕ / FOLKLORE]

          Отдельно от канонического квеста `«Полдень»` разрешён другой рабочий вариант полуденного проявления: опасность вступает с человеком в разговор или испытание, связанное с **реальной хозяйственной компетенцией** — например последовательностью работ со льном, коноплёй, жатвой или иным ремеслом конкретного региона.

          Сильная игровая форма:

          `игрок заранее слышит, что в поле задают вопросы → может получить знание у обычного работника/знающего NPC → встреча проверяет не скрытую реплику, а полученную компетенцию → неправильное знание имеет последствие`.

          Не утверждается единая Полудница-викторина и не превращается бытовое знание в универсальный боевой пароль.

          Источник: **[ДРУГОЙ ИСТОЧНИК: СРАВНИТЕЛЬНАЯ ПОЛУДЕННАЯ ТРАДИЦИЯ / MÁCHAL + KINGDOM SURVIVAL]**.

          ## 38.5. Коллективное волколачье превращение [РАБОЧЕЕ / FOLKLORE]

          Разрешён редкий вариант, где одно колдовское действие, проклятие или иное условие затрагивает **целую человеческую группу**, например свадебный поезд, а не создаёт независимую стаю обычных оборотней.

          Для такого случая особенно важны:

          - исходная социальная группа и причина общего состояния;
          - сохранённая внутренняя структура группы;
          - человеческий разум или его постепенная утрата;
          - узнаваемые следы прежней одежды, порядка движения или поведения;
          - попытки самих превращённых привлечь помощь;
          - ограниченное время до того, как голод и звериное состояние действительно сделают их опасными.

          Это **не новый вид волколака** и не отменяет биографическую причинность каждого значимого случая. Причина должна быть конкретной и связанной с событием группы.

          Источник: **[ДРУГОЙ ИСТОЧНИК: НАРОДНАЯ ДЕМОНОЛОГИЯ ПОЛЕСЬЯ + KINGDOM SURVIVAL]**.

          ## 38.6. Граница пакета

          Раздел не утверждает обязательного хозяина каждого дома, голосовую иллюзию у каждого лесного хозяина, единую полуденную сущность, стандартное испытание знания или распространённость массового волколачества. Все элементы остаются инструментами для конкретных историй и регионов.
          '''
          append_once('ProjectDocs/BESTIARY.md', bestiary_block, '# 38. Конкретизация хозяйственных, лесных, полуденных и волколачьих проявлений')

          narrative_block = r'''
          ## 25.11. Пакет дополнений к восьми фольклорным направлениям [РАБОЧЕЕ]

          Все пункты 25.11 имеют статус `[РАБОЧЕЕ]`, если отдельно не указано `[ИНСТРУМЕНТАРИЙ]`. Они сохраняются как банк для дальнейшей доработки и **не утверждают первый регион, обязательных NPC, финальную объективную причину или место в актовой структуре**.

          ### 25.11.1. «До его срока» [РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: ЗЕЛЕНИН + KINGDOM SURVIVAL]

          **Зацепка:** старик утверждает, что погибший много лет назад сын перестанет приходить через несколько дней — тогда ему исполнилось бы столько лет, сколько обычно жили мужчины их рода.

          **Развитие:** проявления вместо ослабления становятся сильнее. Герой проверяет историю смерти, погребение, семейные обещания и то, откуда вообще возникло знание о «сроке».

          **Осложнение:** ожидание даты само становится выбором с ценой; семья и место продолжают меняться, а отец может скрывать реальную причину беспокойства умершего.

          **Возможные действия:** дождаться рубежа / завершить конкретный долг раньше / вскрыть ложь семьи / изменить погребальный порядок / признать, что срок оказался только верованием.

          **Последствия:** новое состояние семьи, могилы и отношения общины к представлению о «недожитом веке».

          ### 25.11.2. «Новая дорога» [РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: ЗЕЛЕНИН + KINGDOM SURVIVAL]

          **Зацепка:** поселению выгодно спрямить торговый тракт и перестать делать старый крюк мимо дорожной могилы, на которой путники поколениями оставляли простые знаки памяти.

          **Развитие:** после открытия нового пути обычай почти прекращается, а на новом тракте появляются исчезновения или иные тревожные признаки.

          **Осложнение:** община уверена, что забыт мёртвый, но расследование допускает несколько причин — реальное проявление, преступников, старую обязанность, ошибочную причинность или сочетание факторов.

          **Возможные действия:** вернуть старый маршрут / оставить отдельного смотрителя и новый обряд / перенести останки / доказать непричастность могилы / изменить дорогу и принять последствия.

          **Последствия:** торговая логистика, память о погибшем и отношение людей к придорожным мёртвым.

          ### 25.11.3. «Старый сруб» [РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: НИКИФОРОВСКИЙ + KINGDOM SURVIVAL]

          **Зацепка:** семья переселяется из ветхого дома в новый. В новом начинается полоса мелких несчастий, а пустой старый сруб ночью продолжает вести себя так, словно в нём кто-то живёт: топится печь, перемещаются вещи, появляется предупреждение перед бедой.

          **Развитие:** семья хочет разобрать старый дом и использовать дерево для новой постройки.

          **Осложнение:** если проявление принадлежит хозяину самого дома, разрушение старого локуса не гарантирует, что он последует за прежними жильцами.

          **Возможные действия:** сохранить старый дом / разобрать / поселить другую семью / договориться о новом порядке / переоборудовать под общественное помещение.

          **Последствия:** планировка родного дома, отношения семьи, судьба постройки и возможный новый хозяин пространства.

          ### 25.11.4. «Лён в старом овине» [РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: НИКИФОРОВСКИЙ + KINGDOM SURVIVAL]

          **Зацепка:** дому срочно нужен новый хозяйственный цикл, но безопасно и быстро разместить работу можно только в старой постройке другого назначения.

          **Развитие:** после переоборудования портится сырьё, происходят повторяющиеся несчастья, а старики формулируют проблему просто: «это место такой работы не делало».

          **Осложнение:** часть признаков может быть обычной технологической ошибкой, часть — следствием нарушенного обычая, а часть — реальным локальным отношением.

          **Возможные действия:** вернуть прежнюю функцию / построить дорогое отдельное помещение / восстановить старый порядок в новой форме / насильно приспособить пространство.

          **Последствия:** экономика дома, безопасность работников, культура новой профессии и состояние конкретной постройки.

          ### 25.11.5. «Кого зовёт лес» [РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: НИКИФОРОВСКИЙ + ПОЛЕСЬЕ + KINGDOM SURVIVAL]

          **Зацепка:** лесорубы исчезают в давно знакомом лесу. Выживший пошёл на голос товарища и лишь позже узнал, что тот к этому моменту уже погиб.

          **Развитие:** местный проводник перед каждым входом в лес намеренно врёт вслух о цели пути. Для остальных это нелепая привычка; для него — старое правило.

          **Осложнение:** расследование выводит на возможное право прохода. Рабочий вариант: людям разрешали брать сухостой и пользоваться одной дорогой, но не прокладывать второй тракт и не объявлять лес полностью своим.

          **Возможные действия:** сохранить старый договор / попытаться изменить его / отказаться и прорубить новый путь / отказаться от спорного участка / решить конфликт с хозяином территории силой.

          **Последствия:** маршруты, лесной промысел, безопасность, доступ к ресурсу и отношение людей к лесному порядку.

          ### 25.11.6. «Новая плотина» [РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: НИКИФОРОВСКИЙ + ЗЕЛЕНИН + KINGDOM SURVIVAL]

          **Зацепка:** верхняя деревня строит плотину и получает выгодную мельницу. Ниже по течению впервые за много лет начинают исчезать рыбаки или портиться старые места промысла.

          **Развитие:** нижняя деревня говорит, что «проснулся водяной», но новая гидрология могла изменить границу давнего водного отношения или договора.

          **Осложнение:** экономическая выгода одной общины уже зависит от плотины, а другая теряет рыбу, переправу или безопасность.

          **Возможные действия:** разрушить плотину / изменить русло или режим воды / заключить новый порядок / компенсировать нижней деревне часть выгоды / устранить конкретную сущность и принять последствия изменения водного порядка.

          **Последствия:** мельница, рыболовство, переправа, отношения двух поселений и состояние воды.

          ### 25.11.7. «Час льна» [РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: СРАВНИТЕЛЬНАЯ ПОЛУДЕННАЯ ТРАДИЦИЯ / MÁCHAL + KINGDOM SURVIVAL]

          Этот квест **не заменяет и не переопределяет канонический `«Полдень»`**.

          **Зацепка:** для срочного дела нужно пройти поле в опасный полуденный час. Местные утверждают, что встреченное там проявление способно удержать человека вопросами о настоящей хозяйственной работе.

          **Развитие:** правильный способ пройти опасность знает пожилая работница/знающая женщина, которую деревня одновременно считает подозрительной и нежелательной.

          **Осложнение:** игрок должен получить не абстрактный пароль, а последовательность реального знания — например о выращивании и обработке льна. Часть местных рассказов противоречит друг другу.

          **Возможные действия:** изучить ремесло / рискнуть пройти без знания / искать обход / попытаться решить встречу иным правилом.

          **Последствия:** судьба знающего NPC, отношение общины к её знанию, доступ к полю/маршруту и понимание конкретного полуденного явления.

          ### 25.11.8. Неоднозначная хозяйственная улика [ИНСТРУМЕНТАРИЙ][ДРУГОЙ ИСТОЧНИК: ВИНОГРАДОВА / ПОЛЕСЬЕ + МАКСИМОВ + МОШИНЬСКИЙ + KINGDOM SURVIVAL]

          Найденная под порогом чужая солома, земля, ткань, трава или иной мелкий предмет **не является авторским доказательством ведьмовства**.

          Такая улика особенно полезна, когда одновременно допустимы несколько прочтений:

          - реально работающий перенос через связь;
          - защитное действие;
          - подброшенное доказательство;
          - бытовая случайность;
          - суеверная трактовка обычного предмета.

          Инструмент предназначен для расследований, где игрок обязан связывать предмет с человеком, временем, местом и действием, а не выбирать готовую реплику `«это ведьмин знак»`.

          ### 25.11.9. «Синее молоко» [РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: ВИНОГРАДОВА / НАРОДНАЯ ДЕМОНОЛОГИЯ ПОЛЕСЬЯ + KINGDOM SURVIVAL]

          **Зацепка:** у нескольких дворов коровы продолжают давать молоко, но оно становится «пустым» — почти нет сливок, плохо получается масло. Одновременно бедная раньше семья неожиданно начинает процветать.

          **Развитие:** община строит нулевую причинность: «они забрали наш достаток». Во дворе подозреваемых находятся чужие хозяйственные мелочи.

          **Осложнение:** календарный срок усиливает давление, а объективную причину заранее не фиксировать: реальное знание, подстава, болезнь/корм, третья сторона или сочетание человеческого и сверхъестественного.

          **Возможные действия:** защитить обвинённых / поддержать общинное решение / расследовать хозяйственную цепочку / проверить магическую связь / найти другого виновника.

          **Последствия:** пища и экономика поселения, судьба семьи, доступ к знающему NPC и то, как община будет реагировать на следующие необъяснимые кризисы.

          ### 25.11.10. «Свадьба ушла в лес» [РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: НАРОДНАЯ ДЕМОНОЛОГИЯ ПОЛЕСЬЯ + KOLBERG / KARADŽIĆ + KINGDOM SURVIVAL]

          **Зацепка:** на дороге находят брошенные свадебные телеги и накрытые столы. Тел нет. Охотники сообщают об необычной стае, где отдельные волки сохраняют парный порядок и заметные белые полосы на шерсти.

          **Развитие:** все сначала считают, что волки уничтожили свадьбу. Постепенно признаки складываются в коллективное превращение людей, сохранивших остатки свадебной структуры и человеческого поведения.

          **Осложнение:** охотники уже собирают облаву, а превращённые голодают и со временем действительно начинают представлять опасность. Причина проклятия должна быть социальной и конкретной: унижение, нарушенное обещание, конфликт брака, обиженный знающий человек или другое отдельно выбранное основание.

          **Возможные действия:** вернуть людей ценой выполнения требования / найти другую цену / остановить облаву / убить часть стаи / скрыть виновника / разрушить или изменить сам брачный союз.

          **Последствия:** две семьи, союз между домами/поселениями, охотники, репутация знающего человека и судьбы превращённых.

          ### 25.11.11. «Доля землекопов» [РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: САДОВНИКОВ + KINGDOM SURVIVAL]

          **Зацепка:** дому критически нужны деньги, пища или материал для строительства. Герой получает надёжную наводку на клад, условие которого известно заранее: **каждый участник извлечения должен получить долю**.

          **Развитие:** состав похода превращается в содержательное решение. Меньше людей — выше риск; больше людей — безопаснее работа, но меньше доля дома.

          **Осложнение:** после находки выясняется реальный масштаб богатства именно в момент, когда родному дому остро нужна вся сумма.

          **Возможные действия:** честно разделить / выплатить доли из другого ресурса / скрыть часть находки / передать клад общине / отказаться от клада / попытаться обойти условие.

          **Последствия:** если условие объективно сверхъестественно — меняется состояние клада и отношения с местом; если это только обычное право — конфликт всё равно остаётся человечески реальным и влияет на постоянных спутников, работников и доверие к герою.

          **Особая игровая ценность:** квест напрямую связывает постоянных людей, риск экспедиции, экономику и центральную тему `что ты готов отдать, чтобы у дома было будущее?`.

          ### 25.11.12. Граница пакета

          Все конкретные имена, регионы, объективные причины, состав NPC и финальные ветви этого пакета остаются открытыми для последующей разработки. При переносе любой идеи в реальный регион снова используется порядок `LORE → состояние мира → конфликт → инструменты NARRATIVE → квест → последствия → новое состояние мира`.
          '''
          insert_before('ProjectDocs/NARRATIVE.md', '\n\n---\n\n# ЧАСТЬ IV. СЮЖЕТНЫЙ КАНОН И ОТКРЫТЫЕ ВОПРОСЫ', narrative_block, '## 25.11. Пакет дополнений к восьми фольклорным направлениям')

          status_block = r'''
          **Документальная интеграция 05.09.2026 — дополнительные фольклорные направления:** после сверки уже существующих разделов `LORE.md`, `BESTIARY.md`, `NARRATIVE.md` и свежих adaptation-материалов утверждены и внесены все 21 пункта дополнительного исследования восьми направлений: неправильные мёртвые, хозяйственные пространства, лес, вода, опасное время, социальная роль ведьмы, волколак и клад. Общие правила и региональные верования добавлены в `LORE.md`; конкретные проявления — в `BESTIARY.md`; квесты `«До его срока»`, `«Новая дорога»`, `«Старый сруб»`, `«Лён в старом овине»`, `«Кого зовёт лес»`, `«Новая плотина»`, `«Час льна»`, `«Синее молоко»`, `«Свадьба ушла в лес»`, `«Доля землекопов»` и инструмент неоднозначной хозяйственной улики сохранены в `NARRATIVE.md` как `[РАБОЧЕЕ]`/`[ИНСТРУМЕНТАРИЙ]` для последующей доработки. Код и игровой канон v1.25 на этом шаге не менялись.
          '''
          insert_before('ProjectDocs/DEVELOPMENT_STATUS.md', '\nГлавный следующий дизайн-приоритет не меняется:', status_block, 'дополнительные фольклорные направления:')
          PY

      - name: Validate document integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '# 68. Дополнения к восьми фольклорным направлениям' ProjectDocs/LORE.md
          grep -q '# 38. Конкретизация хозяйственных, лесных, полуденных и волколачьих проявлений' ProjectDocs/BESTIARY.md
          grep -q '## 25.11. Пакет дополнений к восьми фольклорным направлениям' ProjectDocs/NARRATIVE.md
          grep -q 'дополнительные фольклорные направления:' ProjectDocs/DEVELOPMENT_STATUS.md
          test "$(find . -maxdepth 1 -name 'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v*.md' | wc -l)" -eq 1

      - name: Commit integrated docs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-folklore-expansion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/LORE.md ProjectDocs/BESTIARY.md ProjectDocs/NARRATIVE.md ProjectDocs/DEVELOPMENT_STATUS.md .github/workflows/one-shot-folklore-expansion.yml
          git diff --cached --check
          git commit -m "docs: integrate folklore quest expansion"
          git push origin HEAD:main
