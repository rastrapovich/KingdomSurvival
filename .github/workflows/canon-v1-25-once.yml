name: Canon v1.25 one-shot update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/canon-v1-25-once.yml'

permissions:
  contents: write

jobs:
  update-canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved canon change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          old = root / 'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_24.md'
          new = root / 'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_25.md'
          archive = root / 'ProjectDocs/Archive/KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_24.md'
          narrative = root / 'ProjectDocs/NARRATIVE.md'
          status = root / 'ProjectDocs/DEVELOPMENT_STATUS.md'

          assert old.exists(), f'Missing {old}'
          assert not new.exists(), f'Already exists: {new}'
          assert narrative.exists() and status.exists()
          assert not archive.exists(), f'Archive already exists: {archive}'

          old_text = old.read_text(encoding='utf-8')
          shutil.copy2(old, archive)

          text = old_text
          text = text.replace('**Версия:** 1.24  ', '**Версия:** 1.25  ', 1)
          text = text.replace(
              '**Статус:** единственный актуальный рабочий канон концепта; v1.23 перенесён в `ProjectDocs/Archive/`  ',
              '**Статус:** единственный актуальный рабочий канон концепта; v1.24 перенесён в `ProjectDocs/Archive/`  ',
              1,
          )
          old_key = '**Ключевое изменение:** без отмены нарративных и экспедиционных решений v1.23 окончательно синхронизирован военный слой с новым ядром проекта: в игре один постоянный герой-командир; походный и боевой состав всегда равен **1 командир + ровно 4 бойца**; командир является полноценной боевой единицей; конкретная система гарнизона/защиты поселения снова открыта для отдельного решения; старый стратегический `BattleSystem` и связанный с ним автобой выведены из канона, а `BattleSandbox` закреплён как единственная основа будущих боёв основной игры.'
          new_key = '**Ключевое изменение:** без отмены остальных решений v1.24 изменён канонический состав экспедиции и боя: герой-командир может отправляться один либо брать с собой от 1 до 4 конкретных постоянных бойцов. Допустимый состав — **1 герой-командир + 0–4 бойца**, то есть от 1 до 5 участников. Герой остаётся обязательным участником экспедиции и полноценной боевой единицей; конкретная система гарнизона/защиты поселения по-прежнему открыта для отдельного решения.'
          assert old_key in text
          text = text.replace(old_key, new_key, 1)

          old_intro = '> Версия 1.24 полностью сохраняет решения v1.23: причинную драматургию `решение → последствие → новая ситуация → новое решение`, модель **«авторский позвоночник + системная персональная история»**, героя через убеждение/внутреннее противоречие/`WANT`/`NEED`, многоуровневую тайну, цену выбора, канонические нарративные рекомендации, экспедиционный слой глобальной карты, содержательные путешествия, разведку и активные силы мира. Новый слой не вводит новую большую механику; он удаляет наследие старой версии проекта и фиксирует единый боевой фундамент.'
          new_intro = '> Версия 1.25 полностью сохраняет решения v1.24, кроме требования брать в поход ровно четырёх обычных бойцов. Теперь герой-командир может путешествовать и вступать в бой один либо с 1–4 выбранными бойцами. Остальные нарративные, экспедиционные и боевые основы v1.24 сохраняются без изменений.'
          assert old_intro in text
          text = text.replace(old_intro, new_intro, 1)

          replacements = {
              '- У игрока одна общая военная сила. В экспедицию всегда отправляется **герой-командир + ровно 4 конкретных постоянных бойца**.': '- У игрока одна общая военная сила. В экспедицию всегда отправляется герой-командир; дополнительно игрок может взять **от 0 до 4 конкретных постоянных бойцов**. Герой имеет право отправиться в путь полностью один.',
              '- Герой-командир является полноценным пятым участником боя, а не отдельным неб боевым управляющим объектом.': '- Герой-командир является полноценным участником боя, а не отдельным небоевым управляющим объектом. Полный боевой состав может насчитывать от **1 до 5 участников**: герой и 0–4 бойца.',
              '- Если постоянных бойцов больше четырёх, игрок выбирает, какие именно четыре идут с героем. Организация оставшихся дома людей и финальная система гарнизона/обороны поселения пока **не утверждены**.': '- Перед каждой экспедицией игрок выбирает, сколько обычных бойцов взять с героем — от 0 до 4 — и каких именно. Организация оставшихся дома людей и финальная система гарнизона/обороны поселения пока **не утверждены**.',
          }
          for a, b in replacements.items():
              assert a in text, f'Expected canon text not found: {a}'
              text = text.replace(a, b, 1)

          # Preserve the historical v1.24 decision entry, then append the new decision.
          journal_marker = '| 04.09.2026 | v1.24 | Зафиксирован один постоянный герой-командир и точный состав экспедиции/боя `1 командир + ровно 4 бойца`; командир является полноценной боевой единицей. Финальная система гарнизона/защиты поселения вновь оставлена открытой. `Тронный зал`, старый `CapitalCrisisSystem` и стратегический `BattleSystem` выведены из актуального проекта; BattleSandbox закреплён как единственная основа будущих боёв основной игры. |'
          assert journal_marker in text
          v125_entry = '| 04.09.2026 | v1.25 | Отменено требование брать ровно 4 обычных бойца. Канонический состав экспедиции и боя теперь `1 герой-командир + 0–4 бойца`: герой может идти один либо взять от 1 до 4 бойцов; максимум остаётся 5 участников. Текущий прототип, который ещё требует ровно 4 бойцов, должен быть синхронизирован отдельно. |'
          text = text.replace(journal_marker, journal_marker + '\n' + v125_entry, 1)

          # Any remaining current-rule phrasing outside the historical v1.24 journal is suspicious.
          before_journal, _, journal = text.partition('## 21. Журнал решений')
          forbidden = ['1 командир + ровно 4 бойца', 'герой-командир + ровно 4', 'полноценным пятым участником']
          for phrase in forbidden:
              assert phrase not in before_journal, f'Unreplaced current canon phrase: {phrase}'

          new.write_text(text, encoding='utf-8')
          old.unlink()

          n = narrative.read_text(encoding='utf-8')
          anchor = '- существует один постоянный полуфиксированный герой-командир, но его конкретная личность пока не определена;'
          assert anchor in n
          addition = anchor + '\n- герой-командир может отправляться в экспедицию один либо брать с собой от 1 до 4 постоянных бойцов; допустимый состав — `1 герой + 0–4 бойца`;'
          if 'допустимый состав — `1 герой + 0–4 бойца`' not in n:
              n = n.replace(anchor, addition, 1)

          # Update only current prescriptive wording if it exists; historical/reference material is left intact.
          n = n.replace('герой-командир + ровно 4 конкретных постоянных бойца', 'герой-командир + от 0 до 4 конкретных постоянных бойцов')
          n = n.replace('1 командир + ровно 4 бойца', '1 герой-командир + 0–4 бойца')
          narrative.write_text(n, encoding='utf-8')

          s = status.read_text(encoding='utf-8')
          s = s.replace('Актуальный общий канон: `KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_24.md`.', 'Актуальный общий канон: `KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_25.md`.', 1)
          s = s.replace('## 2. Каноническое ядро после v1.24', '## 2. Каноническое ядро после v1.25', 1)

          old_status_bullet = '- походный состав фиксирован как **1 командир + ровно 4 обычных бойца = 5 участников**;'
          if old_status_bullet in s:
              s = s.replace(old_status_bullet, '- канонический походный и боевой состав теперь переменный: **1 герой-командир + 0–4 обычных бойца = от 1 до 5 участников**; герой может отправляться один;', 1)

          old_status_bullet2 = '- командир входит в поход автоматически и не занимает одно из четырёх выбираемых мест;'
          if old_status_bullet2 in s:
              s = s.replace(old_status_bullet2, '- командир входит в поход автоматически и не занимает одно из четырёх доступных мест для обычных бойцов;', 1)

          # Keep implementation facts truthful: the code still enforces exactly four ordinary fighters.
          discrepancy = '- **Расхождение v1.25 с текущим прототипом:** канон уже разрешает герою идти одному или с 1–4 бойцами, но `GameState`, подготовка экспедиции и текущий UI всё ещё требуют выбрать ровно 4 обычных бойца. Код на этом шаге намеренно не менялся; нужна отдельная синхронизация механики и тестов.'
          section_marker = '## 3. Что изменено в коде на этом этапе'
          assert section_marker in s
          if discrepancy not in s:
              s = s.replace(section_marker, discrepancy + '\n\n' + section_marker, 1)

          # Clarify that the older implementation subsection is historical/current implementation, not canon.
          s = s.replace('### 3.2. Состав экспедиции `1 + 4`', '### 3.2. Текущая реализация состава экспедиции (устарела относительно v1.25)', 1)

          # Add a new status update block near the top without falsifying what was actually implemented.
          current_stage = 'Проект находится на этапе **«Нарративный фундамент»** при сохранённом техническом прототипе карты, времени, экспедиций, строительства и BattleSandbox.'
          assert current_stage in s
          status_note = current_stage + '\n\n**Каноническое уточнение v1.25:** герой может идти один либо с 1–4 бойцами. Это решение уже зафиксировано в каноне и нарративной библии, но технический прототип состава экспедиции пока остаётся на правиле «ровно 4 бойца».'
          s = s.replace(current_stage, status_note, 1)
          status.write_text(s, encoding='utf-8')

          # Final structural checks.
          root_canons = sorted(root.glob('KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v*.md'))
          assert root_canons == [new], f'Expected exactly one root canon, got {root_canons}'
          assert archive.exists()
          assert '1 герой-командир + 0–4 бойца' in new.read_text(encoding='utf-8')
          assert 'допустимый состав — `1 герой + 0–4 бойца`' in narrative.read_text(encoding='utf-8')
          assert 'Расхождение v1.25 с текущим прототипом' in status.read_text(encoding='utf-8')
          PY

          rm -f .github/workflows/canon-v1-25-once.yml

          echo 'Root canon files:'
          find . -maxdepth 1 -type f -name 'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v*.md' -print
          echo 'Changed files:'
          git status --short

      - name: Commit approved canon update
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'Canonize flexible expedition party size'
          git push origin HEAD:main
