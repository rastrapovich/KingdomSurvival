name: One-shot Federowski docs sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-federowski-sync.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate approved Federowski decisions on latest main
        shell: bash
        run: python3 ProjectDocs/federowski_sync_once.py

      - name: Remove one-shot files and commit
        shell: bash
        run: |
          rm -f ProjectDocs/federowski_sync_once.py
          rm -f .github/workflows/one-shot-federowski-sync.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/LORE.md ProjectDocs/BESTIARY.md ProjectDocs/DEVELOPMENT_STATUS.md ProjectDocs/federowski_sync_once.py .github || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: integrate Federowski lore and bestiary principles"
          git push origin HEAD:main
