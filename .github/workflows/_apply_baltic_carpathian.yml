# Приложение: Балтийско-карпатский пограничный слой — Basanavičius + Pamfile + Gerard

Источники: Jonas Basanavičius — **`Iš gyvenimo vėlių bei velnių`** и другие его фольклорные сборники; Tudor Pamfile — **`Mitologie românească`** (1916); Emily Gerard — **`Transylvanian Superstitions`** (1885).

Материал предназначен для белорусско-литовских, польско-литовских и румынско-карпатских пограничных слоёв. Он не заменяет славянскую основу мира и не вводит автоматически конкретный регион, сущность или традицию в первый регион. Gerard используется как исторический внешний источник мотивов и локальных свидетельств, а не как единственное основание объективной метафизики.

## BC-L1. Сверхъестественное богатство проверяется на источник и потерю [УТВЕРЖДЕНО — РЕКОМЕНДАЦИЯ]

Для значимой формы сверхъестественного обогащения проверять:

- откуда физически или социально появляется ресурс;
- создаётся ли он, возвращается или перемещается от другого владельца;
- кто несёт соответствующую потерю;
- знает ли выгодополучатель происхождение богатства;
- что происходит с правом собственности и долгом после раскрытия.

Допустима причинность:

`одно хозяйство необъяснимо богатеет → другое теряет ресурс → сверхъестественное отношение перераспределяет богатство → возникает экономический и моральный конфликт`.

Это **не универсальный закон любого магического богатства** и не утверждение, что всякая обогащающая сущность обязательно крадёт у соседей.

Источник: **[BASANAVIČIUS + KINGDOM SURVIVAL]**.

## BC-L2. Внешнее повторение обряда недостаточно без нужного отношения или условия [УТВЕРЖДЕНО][ОБЪЕКТИВНО]

В объективной магии связей человек не гарантирует повторение эффекта простым копированием видимой последовательности действий.

Если действие работало благодаря конкретной связи, праву, передаче, участникам, локусу, условию или отношению, имитация внешней формы без этого основания может не сработать или привести к иному результату.

Это уточняет действующие принципы магии связей. Магия **не получает универсальную способность читать моральное намерение человека**: важна реальная структура отношения и условия, а не внешнее сходство действий само по себе.

Источник: **[BASANAVIČIUS + KINGDOM SURVIVAL]**.

## BC-L3. Сверхъестественный дар может сохраняться только при соблюдении условия [УТВЕРЖДЕНО — РЕКОМЕНДАЦИЯ]

Для конкретного дара допускается продолжающееся условие: вещь или выгода сохраняет необычное свойство, пока соблюдается запрет, обязанность, форма обращения или иное правило конкретного отношения.

При проектировании фиксируется:

`дар → условие сохранения → признаки приближения нарушения → что именно теряется или меняется после нарушения`.

Не каждый сверхъестественный дар обязан быть условным.

Источник: **[BASANAVIČIUS]**.

## BC-L4. Лаума — разрешённый балтийский рабочий культурный слой [РАБОЧЕЕ][FOLKLORE]

В балтийском пограничье разрешено исследовать **laumė / лауму** не как универсальную «опасную красивую женщину», а как локальную женскую мифологическую силу, связанную в конкретных версиях с водой, вечерним или ночным временем и человеческой работой.

Перспективные связи:

- прядение;
- ткань и шитьё;
- стирка и отбеливание;
- баня;
- вода;
- вечерняя/ночная работа;
- помощь или необычайно быстро выполненная работа;
- дар;
- форма обращения;
- последствие нарушения условия.

Лаума может быть опасной, полезной, дарующей или отвечающей на неправильное обращение; конкретная природа и объективное существование в мире **не утверждены в общем виде**.

Рабочая формула:

`локус/работа → время → форма обращения → помощь/дар → условие → нарушение → последствие`.

Источник: **[BASANAVIČIUS]**.

## BC-L5. Голос близкого может быть локальным способом установить опасный контакт [УТВЕРЖДЕНО — ДОПУСТИМОЕ ПРАВИЛО КОНКРЕТНОЙ СУЩНОСТИ]

В отдельных карпатских лесных традициях допускается сущность, которая зовёт человека голосом знакомого или близкого.

Опасное отношение может устанавливаться не самим звуком, а **ответом человека**.

Это не является универсальным правилом леших, `Muma Pădurii`, лесных хозяев или всей нечисти.

Источник: **[PAMFILE]**.

## BC-L6. Сходная роль лесного хозяина не означает одну сущность [УТВЕРЖДЕНО — ПРИНЦИП]

`Muma Pădurii` и сходные карпатские лесные образы не приравниваются автоматически к лешему.

Если разные культуры описывают «хозяйку» или «хозяина» леса, сходство функции не доказывает одинаковое происхождение, вид, характер или объективную природу.

Региональные свидетельства могут быть противоречивы: опасная сила, защитница территории, помощница заблудившемуся и другие версии способны сосуществовать как разные верования или относиться к разным объективным причинам.

Сначала фиксируются конкретная местная версия и наблюдаемые признаки; объективная природа устанавливается отдельно.

Источник: **[PAMFILE + GERARD + KINGDOM SURVIVAL]**.

## BC-L7. Solomonar / Scholomance — народное объяснение происхождения знания, не школа магов [РАБОЧЕЕ][ВЕРОВАНИЕ]

Для карпатского хмарника или иного знающего человека разрешён фольклорный слой, в котором жители объясняют необычное знание обучением **«в горах»**, **«у чужих»**, в скрытой школе или у нечеловеческого учителя.

Сам институт единой школы, её организация, программа и существование как объективной академии магов **не утверждаются**.

Значимый знающий человек может действительно владеть отдельными работающими действиями и одновременно ошибаться в общей теории собственного знания.

Источник: **[PAMFILE + GERARD]**.

## BC-L8. Ложное мифологическое объяснение может сохранять верное практическое предупреждение [УТВЕРЖДЕНО — ПРИНЦИП]

Локальная легенда может ошибочно объяснять причину природной опасности, но всё равно сохранять точное практическое правило поведения.

Предпочтительная форма:

`реальная опасная закономерность места → мифологическое объяснение → практическое правило → поколения сохраняют правило после потери или искажения причины`.

Человек может быть неправ насчёт «дракона в озере», но прав, что конкретное место или время объективно опасно из-за погоды, рельефа, воды или другой природной закономерности.

**Полезность правила не доказывает истинность его мифологического объяснения.**

Источник: **[GERARD + KINGDOM SURVIVAL]**.

## BC-L9. Ненайденное тело утопленника — самостоятельный центр отношения с водой [УТВЕРЖДЕНО — ПРИНЦИП]

Если тело утонувшего не найдено, это способно удерживать незавершённость между погибшим, семьёй, водой и погребальным порядком.

Для такого случая проверять:

- кто и как ищет тело;
- какие региональные способы поиска считаются работающими;
- что из них является верованием;
- может ли погибший, согласно местной версии, указывать место через сон или знак;
- как обнаружение останков меняет запреты, маршрут, возможность погребения и состояние семьи.

Конкретный способ поиска — сон, знак, свеча, хлеб или иное действие — **не становится универсальной технологией** и при необходимости фиксируется как местное `[ВЕРОВАНИЕ]` либо как правило отдельного случая.

Источник: **[BASANAVIČIUS + GERARD + KINGDOM SURVIVAL]**.

## BC-L10. Родовое право на конкретный клад [РАБОЧЕЕ — ДОПУСТИМАЯ ЛОРНАЯ МОДЕЛЬ]

Для отдельного клада допускается отношение:

`клад ↔ конкретный род/семья ↔ старое право или долг`.

Это не наследственная «способность видеть золото».

Для конкретного случая нужно определить:

- кто спрятал богатство;
- почему связь сохранилась;
- является ли основанием наследство, договор, обязанность, преступление или иное право;
- что происходит, если чужак находит клад первым;
- кто внутри общества признаёт или оспаривает родовое право.

Объективность сверхъестественной родовой связи утверждается отдельно для каждого клада.

Источник: **[GERARD + KINGDOM SURVIVAL]**.

## BC-L11. «Пойманная тень» в строительстве [РАБОЧЕЕ][ВЕРОВАНИЕ / ВОЗМОЖНАЯ СВЯЗЬ]

Для отдельной пограничной традиции разрешён мотив, где измеренную, отмеченную или иным способом символически выделенную человеческую тень связывают с фундаментом или строением как заместитель человека.

Мотив может использовать объективную магию связей **только после отдельного решения конкретного случая**.

Не утверждается универсальный закон:

`измерили тень → человек умрёт`.

Рабочая применимость — один из возможных вариантов происхождения связи Тенерога с человеческой тенью и строением.

Источник: **[GERARD + KINGDOM SURVIVAL]**.

## BC-L12. Граница решения [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]

Пакет не утверждает:

- объективное существование `laumė` или `Muma Pădurii` в первом регионе;
- единую балтийскую или карпатскую демонологию;
- буквальную `Scholomance` как реально существующую школу магов;
- универсальную опасность ответа любому лесному голосу;
- обязательную кражу богатства каждой обогащающей сущностью;
- продолжающееся условие у каждого сверхъестественного дара;
- универсальную магию тени;
- магическую истинность любого карпатского погодного объяснения;
- конкретный первый регион, сюжет, персонажа или квест.

Главная формула слоя:

> **пограничная традиция → локальное верование/правило → наблюдаемое хозяйственное, природное или человеческое последствие → проверка реальной связи → конкретная причина → новое устойчивое состояние без превращения регионального мотива в универсальную метафизику мира.**

