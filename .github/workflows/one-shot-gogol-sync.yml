name: One-shot Gogol docs sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-gogol-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved Gogol decisions
        run: python3 ProjectDocs/gogol_sync_once.py

      - name: Normalize Markdown EOF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'ProjectDocs/BESTIARY.md',
              'ProjectDocs/DEVELOPMENT_STATUS.md',
              'ProjectDocs/GOGOL_ADAPTATION.md',
              'ProjectDocs/LORE.md',
              'ProjectDocs/NARRATIVE.md',
          ]:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Remove one-shot helpers
        run: |
          rm -f .github/workflows/one-shot-gogol-sync.yml
          rm -f ProjectDocs/gogol_sync_once.py

      - name: Validate final diff
        shell: bash
        run: |
          set -euo pipefail
          git add -N ProjectDocs/GOGOL_ADAPTATION.md
          git diff --check
          printf '%s\n' \
            '.github/workflows/one-shot-gogol-sync.yml' \
            'ProjectDocs/BESTIARY.md' \
            'ProjectDocs/DEVELOPMENT_STATUS.md' \
            'ProjectDocs/GOGOL_ADAPTATION.md' \
            'ProjectDocs/LORE.md' \
            'ProjectDocs/NARRATIVE.md' \
            'ProjectDocs/gogol_sync_once.py' | sort > /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --stat

      - name: Commit synchronized docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: integrate Gogol quest and lore references'
          git push origin HEAD:main
