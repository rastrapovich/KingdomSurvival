name: One-shot Tolstoy docs sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolstoy-sync-once.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate approved Tolstoy decisions on latest main
        shell: bash
        env:
          PATCH_SCRIPT_GZ_B64: ""
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s' "$PATCH_SCRIPT_GZ_B64" | base64 -d | gzip -d > /tmp/tolstoy_patch.py
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python /tmp/tolstoy_patch.py
            git rm -f --ignore-unmatch .github/workflows/tolstoy-sync-once.yml
            git add ProjectDocs/LORE.md ProjectDocs/BESTIARY.md ProjectDocs/DEVELOPMENT_STATUS.md
            if git diff --cached --quiet; then
              echo "No changes required; Tolstoy integration already present."
              exit 0
            fi
            git commit -m "docs: integrate Tolstoy ethnolinguistic lore principles"
            if git push origin HEAD:main; then
              echo "Tolstoy integration pushed successfully."
              exit 0
            fi
            echo "main moved during attempt ${attempt}; rebuilding from latest origin/main"
            sleep 2
          done
          echo "Failed to push safely after retries."
          exit 1
