name: One-shot folklore status fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix current canon version reference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ProjectDocs/DEVELOPMENT_STATUS.md')
          text = p.read_text(encoding='utf-8')
          old = 'Код и игровой канон v1.25 на этом шаге не менялись.'
          new = 'Код и актуальный игровой канон v1.26 на этом шаге не менялись.'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected status sentence not found')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate status
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'актуальный игровой канон v1.26' ProjectDocs/DEVELOPMENT_STATUS.md
          grep -q 'Актуальный общий канон: `KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_26.md`' ProjectDocs/DEVELOPMENT_STATUS.md

      - name: Commit status fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-folklore-status-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/DEVELOPMENT_STATUS.md .github/workflows/one-shot-folklore-status-fix.yml
          git diff --cached --check
          git commit -m "docs: fix folklore status canon reference"
          git push origin HEAD:main
