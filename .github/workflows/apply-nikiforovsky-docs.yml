name: Apply Nikiforovsky documentation

on:
  push:
    branches:
      - work/nikiforovsky-docs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nikiforovsky-docs
          fetch-depth: 0

      - name: Apply approved folklore decisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lore_path = Path('ProjectDocs/LORE.md')
          bestiary_path = Path('ProjectDocs/BESTIARY.md')
          status_path = Path('ProjectDocs/DEVELOPMENT_STATUS.md')
          workflow_path = Path('.github/workflows/apply-nikiforovsky-docs.yml')

          lore_marker = '# 58. Решения по Н. Я. Никифоровскому — «Нечистики»'
          lore = lore_path.read_text(encoding='utf-8')
          if lore_marker not in lore:
              journal_anchor = '| 05.09.2026 | По Д. К. Зеленину утверждены культурные модели «неправильной» смерти, погребального порядка, привязки мёртвого к месту, поминовения и связи обрядового календаря с хозяйственной жизнью; конкретная метафизика смерти не фиксируется. | УТВЕРЖДЕНО |'
              journal_row = '| 05.09.2026 | По Н. Я. Никифоровскому «Нечистики» утверждены принципы самостоятельных отношений хозяйственных пространств, преобразования мифологической территории человеком, памяти долга, сложного права на клад, исторического происхождения богатства, сверхъестественного изменения ориентиров, ненаследуемости колдовской вины и изменения среды как допустимого способа решения; конкретные сущности вынесены в BESTIARY как рабочий FOLKLORE-материал. | УТВЕРЖДЕНО / РАБОЧЕЕ |'
              if journal_anchor in lore and journal_row not in lore:
                  lore = lore.replace(journal_anchor, journal_anchor + '\n' + journal_row, 1)

