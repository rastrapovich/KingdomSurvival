# 30. Решения по Б. Д. Гринченко — свидетельства, признаки и культурное существование сущности

Источник: Б. Д. Гринченко — **«Этнографические материалы, собранные в Черниговской и соседних с ней губерниях»** (1895–1899). Полный утверждённый пакет решений сохранён в `ProjectDocs/GRINCHENKO_ETHNOGRAPHIC_ADAPTATION.md`.

Раздел развивает принципы «сначала следствие», региональности, локуса, человеческой ошибки и взаимодействия с разумными сущностями. Источник приёма: **[ГРИНЧЕНКО + KINGDOM SURVIVAL]**.

## 30.1. Животное — честный ранний индикатор [УТВЕРЖДЕНО — ПРИНЦИП / FOLKLORE]

Для значимой сущности или аномального места проверяется, способны ли обычные животные показать присутствие проблемы раньше прямой встречи.

Возможные признаки:

- собака смотрит или рычит в пустое место;
- скот отказывается идти к воде;
- конь не пересекает порог или межу;
- привычное животное не узнаёт хозяина;
- звери необычно спокойно стоят возле человеческого жилья;
- животные систематически обходят конкретную точку.

Такой признак не доказывает конкретную сущность. Он является частью расследования.

Мотив ярчука сохраняется как региональное верование в `LORE.md`, а не как универсальная характеристика собак.

## 30.2. «Неправильное животное» не обязано быть отдельным монстром [УТВЕРЖДЕНО]

Неестественное поведение обычного животного может быть следствием:

- присутствия сущности;
- изменения места;
- чужого приказа или договора;
- болезни;
- человеческого вмешательства;
- иной объективной причины.

Не создавать новый тип врага только потому, что животное ведёт себя страшно.

## 30.3. Фольклорная ведьма остаётся человеком, пока конкретный случай не доказал иное [УТВЕРЖДЕНО]

Карточка «ведьма» не используется как стандартный боевой архетип по умолчанию.

При встрече с обвинённым человеком отдельно проверяются:

- наблюдаемые последствия;
- источник обвинения;
- реальное знание человека;
- его выгода и мотив;
- человеческие враги;
- объективная сверхъестественная способность, если она вообще существует.

Это дополняет разделы 24.7, 27.14 и 29.5.

## 30.4. Разумные нечеловеческие силы могут иметь социальные роли [УТВЕРЖДЕНО — ПРИНЦИП]

Разумная сущность или локальная группа может иметь не только лидера и боевую функцию, но и:

- ремесленников;
- музыкантов;
- слуг;
- пиры;
- свадьбы;
- работу;
- обмен услугами;
- внутренние правила поведения.

Такой слой используется только если помогает понять желание, экономику и правила конкретной силы. Он не создаёт единую цивилизацию всей нечисти.

## 30.5. Ошибка восприятия может быть правилом конкретной сущности [УТВЕРЖДЕНО — ДОПУСТИМЫЙ ПРИНЦИП]

Для конкретной сущности допустимо правило, при котором человек воспринимает её, её слуг или пространство как знакомую бытовую категорию.

Для паспорта обязательно определить:

- что именно воспринимается неверно;
- кто подвержен эффекту;
- какие детали выдают ошибку;
- что разрушает или меняет восприятие;
- почему правило связано с происхождением сущности.

Не применять как универсальную иллюзию ко всему сверхъестественному.

## 30.6. Правильное обращение и память отношения [УТВЕРЖДЕНО — ПРИНЦИП]

Существо, животное или иной участник мира может запомнить действие героя задолго до того, как игрок поймёт его значение.

Подходящие действия:

- накормить;
- освободить;
- не ударить;
- не разрушить;
- соблюсти просьбу;
- признать границу;
- помочь без немедленной награды.

Позднее память может выразиться предупреждением, нейтралитетом, проводничеством, знанием или иной помощью.

Это не универсальная скрытая шкала репутации. Память существует только там, где она следует из природы конкретного существа или отношения.

## 30.7. Малое раннее взаимодействие может стать поздним ключом [РЕКОМЕНДАЦИЯ]

При разработке повторяющейся сущности или животного полезно проверить, может ли раннее незначительное взаимодействие позднее изменить:

- доступ к территории;
- понимание правила;
- возможность переговоров;
- получение помощи;
- распознавание обмана;
- безопасный путь.

Конкретная сюжетная реализация после появления фиксируется в `NARRATIVE.md`.

## 30.8. Существо проектируется вместе с локальными версиями о нём [УТВЕРЖДЕНО]

Для значимой `FOLKLORE`-сущности недостаточно одного авторского описания.

Следует проверить:

- как её называют в разных поселениях;
- какие признаки считают главными;
- какие способы защиты называют;
- какие версии происхождения существуют;
- какие детали повторяются независимо от рассказчика;
- что жители систематически понимают неправильно.

Различия человеческих версий не требуют создавать несколько механически разных видов существа.

## 30.9. Локус может быть угрозой без носителя-существа [УТВЕРЖДЕНО — ПРИНЦИП]

`BESTIARY.md` может описывать устойчивое поведение места как сущность поведения, если это нужно для взаимодействия, но не обязан создавать для каждого «плохого места» скрытого монстра.

Место может:

- повторять событие;
- воспроизводить работу или обряд;
- менять поведение животных;
- проявляться только в определённых условиях;
- хранить устойчивый звуковой или визуальный след.

Если конкретного носителя нет, основной мировой паспорт остаётся в `LORE.md`.

## 30.10. Человеческое ремесло может быть потребностью сущности [УТВЕРЖДЕНО — РАСШИРЕНИЕ ПАСПОРТА]

Развивая разделы 27.18 и 58.14, для разумной сущности дополнительно проверяется:

- нужен ли ей музыкант, кузнец, портной, сапожник, лекарь, повитуха, проводник или другой специалист;
- почему она не может выполнить работу сама;
- добровольно ли человек сотрудничает;
- что получает взамен;
- хочет ли он прекращения отношения;
- как общество интерпретирует такую связь.

Пропавший человек может оказаться живым и не желать возвращения. Это должно создавать выбор и последствия, а не автоматически превращать спасение в правильный исход.

## 30.11. Народное свидетельство входит в паспорт значимой сущности [УТВЕРЖДЕНО]

Для заметной фольклорной сущности к паспорту добавляется блок **«Народные свидетельства»**:

1. Что рассказывает человек, чья профессия регулярно сталкивается с локусом сущности.
2. Что рассказывает старый/опытный житель.
3. Что рассказывает очевидец последнего случая.
4. Что рассказывает человек, заинтересованный в конкретном объяснении.
5. Какие 2–3 детали повторяются независимо от версии.
6. Какие способы защиты называют люди.
7. Какие из этих правил противоречат друг другу.
8. Что объективно подтверждено.
9. Что остаётся неизвестным.

Не обязательно использовать все четыре типа рассказчиков буквально; важно иметь несколько независимых перспектив.

## 30.12. Производственный шаблон фольклорного расследования [УТВЕРЖДЕНО — РЕКОМЕНДАЦИЯ]

Для крупной сущности особенно предпочтительна структура:

> **2–4 противоречивых свидетельства → 2–3 повторяющихся признака → 1–2 ложных или неполных правила → настоящее правило/причина → последствие взаимодействия.**

Повторяющаяся деталь важнее одинакового пересказа. Если три разные истории содержат один и тот же звук, предмет, поведение животного, время или след, игрок получает честную улику до раскрытия.

## 30.13. Пословица, загадка и детская формула могут передавать правило сущности [РЕКОМЕНДАЦИЯ / FOLKLORE]

Способ распознать, избежать или понять сущность может быть сохранён в:

- пословице;
- поговорке;
- загадке;
- считалке;
- детской страшилке;
- ремесленной формуле;
- семейном предупреждении.

Такое сообщение должно быть искажённым человеческим знанием, а не интерфейсной подсказкой автора. После раскрытия игрок должен иметь возможность понять, почему старая формула содержала полезную деталь.

## 30.14. Граница решений по Гринченко

Раздел 30 не утверждает:

- объективное сверхъестественное восприятие всех животных;
- отдельную расу ведьм;
- единую социальную структуру нечистой силы;
- универсальный эффект подмены восприятия;
- обязательную память каждой сущности;
- наличие монстра за каждым аномальным местом;
- обязательную потребность нечисти в человеческих ремесленниках;
- буквальную истинность народных формул.

Главная производственная формула:

> **существо существует в культуре до встречи → люди дают несовпадающие версии → повторяются честные признаки → игрок проверяет правило → взаимодействие меняет человека, место или отношения.**
