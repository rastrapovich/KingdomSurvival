name: Apply approved narrative doc sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ks-doc-patch.yml'

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch approved docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label):
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return new

          # NARRATIVE.md
          p = Path('ProjectDocs/NARRATIVE.md')
          n = p.read_text(encoding='utf-8')
          n = sub_once(
              n,
              r'^# 26\. Сюжетный канон \[СЮЖЕТНЫЙ КАНОН\]\n.*?(?=^## 26\.2\.)',
              '''# 26. Сюжетный канон [СЮЖЕТНЫЙ КАНОН]\n\nНа текущем этапе конкретный сюжет закреплён двумя первыми опорами: **основной завязкой кампании «Дом на чужой воде»** и каноническим квестом **«Полдень»**. Конкретная личность героя, антагонистическая сила, большая тайна и первый регион по-прежнему требуют отдельного утверждения.\n\nИз общего игрового канона и уже утверждённых сюжетных решений в историю переходят следующие опоры:\n\n- существует один постоянный полуфиксированный герой-командир, но его конкретная личность пока не определена;\n- герой-командир может отправляться в экспедицию один либо брать с собой от 1 до 4 постоянных бойцов; допустимый состав — `1 герой + 0–4 бойца`;\n- существует один постоянный родной Дом-поселение; его название, ключевые жители и полная история пока не определены, но утверждён один скрытый исторический слой — **забытое соглашение о воде**, которое раскрывается через стартовое повреждение плотины и расследование;\n- мир опирается на славянский фольклор и низкое/тёмное фэнтези;\n- кампания имеет авторский финал;\n- центральный тематический вопрос: **«Что ты готов отдать, чтобы у твоего дома было будущее?»**.\n\nФундаментальные факты мира для этих опор ведутся в `ProjectDocs/LORE.md`. Эти опоры не разрешают автоматически придумывать конкретные факты биографии героя, стороны соглашения, виновника повреждения плотины, сверхъестественную природу воды или большую тайну.\n\n## 26.1. Что пока НЕ является сюжетным каноном\n\nНе утверждены:\n\n- имя, возраст и происхождение героя;\n- причина его лидерства;\n- конкретная семья и привязанности;\n- его исходное убеждение, `WANT`, `NEED` и внутренняя слабость;\n- личная причина, по которой повреждение плотины и старое соглашение особенно важны именно герою;\n- точная причина повреждения плотины;\n- было ли повреждение намеренным и кто за него отвечает;\n- стороны, точные условия, права и обязанности забытого соглашения о воде;\n- почему и каким образом соглашение было забыто;\n- существует ли в соглашении сверхъестественная сторона или оно целиком человеческое;\n- связь соглашения и стартовой линии с большой тайной кампании;\n- точная большая тайна;\n- антагонистическая сила;\n- первый регион;\n- конкретные соседние поселения;\n- главный состав NPC;\n- остальные конкретные квесты из рабочего банка, кроме отдельно утверждённого `«Полдня»`;\n- точная степень открытой магии;\n- пантеон и религиозная модель;\n- конкретный финал и число итоговых состояний.\n\n''',
              'NARRATIVE §26/26.1'
          )

          opening = '''\n## 26.3. «Дом на чужой воде» — основная завязка кампании [СЮЖЕТНЫЙ КАНОН][KINGDOM SURVIVAL]\n\nКампания начинается **не с уже развернувшейся катастрофы**, а с относительно спокойной и обычной жизни Дома. До серьёзной угрозы игрок должен успеть увидеть, за что этот Дом можно ценить: людей, работу, бытовой ритм, привычные места и нормальность жизни.\n\nЗатем **повреждается плотина**. Это создаёт реальную хозяйственную проблему, и жители пытаются понять, что произошло.\n\nКаноническая причинная цепь:\n\n> **`обычная жизнь Дома → повреждение плотины → попытка разобраться → проблема и расследование выводят героя за пределы Дома к другим поселениям и людям региона → обнаруживается забытое соглашение о воде, связанное с прошлым Дома`**.\n\nЭто утверждённая основная завязка кампании. Она заменяет прежнее рабочее направление **«Короткая дорога»**.\n\nНа старте проблема должна читаться прежде всего как **материальная, социальная и историческая**. Сверхъестественная причина повреждения, участие сущности, магическое право воды или иная метафизическая трактовка **не утверждены**.\n\nНе утверждены:\n\n- причина повреждения плотины;\n- было ли повреждение намеренным;\n- виновник;\n- стороны и точные условия соглашения;\n- почему соглашение было забыто;\n- существует ли сверхъестественная сторона соглашения;\n- конкретный регион, поселения и NPC;\n- точный итог этой линии;\n- связь соглашения с большой тайной кампании.\n\n`«Дом на чужой воде»` **не является автоматической канонизацией** рабочего квеста `25.11.6 «Новая плотина»`. `«Новая плотина»` остаётся самостоятельной `[РАБОЧЕЕ]` заготовкой со своей причинностью и не определяет природу стартового соглашения.\n'''
          marker = '\n---\n\n# 27. Открытые вопросы [ОТКРЫТО]'
          if marker not in n:
              raise SystemExit('NARRATIVE §26.3 insertion marker missing')
          n = n.replace(marker, opening + marker, 1)

          n = sub_once(
              n,
              r'^# 27\. Открытые вопросы \[ОТКРЫТО\]\n.*?(?=^---\n\n# 28\.)',
              '''# 27. Открытые вопросы [ОТКРЫТО]\n\nЭти вопросы будут решаться позже, отдельными этапами, без автоматического заполнения сейчас:\n\n1. Кто конкретно герой и почему за ним идут люди.\n2. Что именно делает Дом лично важным для него.\n3. Почему повреждение плотины и раскрытие старого соглашения становятся **его** причиной выйти за пределы Дома, а не только общественной задачей.\n4. Кто и с кем заключил соглашение о воде, какие права и обязанности оно создавало и почему было забыто.\n5. Связана ли причина повреждения плотины с самим соглашением или эти две линии пересекаются только через расследование.\n6. Как `«Дом на чужой воде»` связан с большой тайной кампании.\n7. В чём точная большая тайна и антагонистическая сила.\n8. Как устроен первый регион и какие соседние поселения реально зависят друг от друга.\n9. Кто ключевые NPC Дома и первого региона.\n10. Какие устойчивые состояния может получить стартовая линия после первых крупных решений.\n11. Как конкретно центральная тема `«Что ты готов отдать, чтобы у твоего дома было будущее?»` входит в личную историю героя.\n12. Как первый большой квест после завязки проверяет уже утверждённые правила мира и не превращает соглашение о воде в универсальную метафизику.\n\nЛорные вопросы, не являющиеся непосредственно сюжетным решением, ведутся в разделе открытых решений `ProjectDocs/LORE.md`.\n\n''',
              'NARRATIVE §27'
          )

          journal_anchor = '# 28. Журнал нарративных решений\n\n| Дата | Решение | Статус |\n|---|---|---|\n'
          journal_row = '| 06.09.2026 | Основная завязка кампании утверждена как `«Дом на чужой воде»`: обычная жизнь Дома → повреждение плотины → расследование → выход героя к другим поселениям и людям региона → раскрытие забытого соглашения о воде. Прежнее рабочее направление `«Короткая дорога»` заменено; `«Новая плотина»` остаётся отдельной `[РАБОЧЕЕ]` заготовкой. Причина повреждения, стороны соглашения и сверхъестественная трактовка не утверждены. | СЮЖЕТНЫЙ КАНОН |\n'
          if journal_anchor not in n:
              raise SystemExit('NARRATIVE journal anchor missing')
          n = n.replace(journal_anchor, journal_anchor + journal_row, 1)

          n = sub_once(
              n,
              r'^# 29\. Следующий нарративный этап\n\n.*?(?=\nЛюбые новые идеи оцениваются в таком порядке:)',
              '''# 29. Следующий нарративный этап\n\nСледующий отдельный этап — **конкретный главный герой и его личная связь с уже утверждённой завязкой `«Дом на чужой воде»`**. Параллельно нужно определить стороны, условия и причину забвения соглашения о воде настолько, насколько это необходимо для героя, ближайших поселений и первого региона, не заполняя заранее большую тайну или сверхъестественную природу события.\n''',
              'NARRATIVE §29 intro'
          )
          p.write_text(n, encoding='utf-8')

          # LORE.md
          p = Path('ProjectDocs/LORE.md')
          l = p.read_text(encoding='utf-8')
          l = sub_once(
              l,
              r'^# 6\. Родной дом \[УТВЕРЖДЕНО\]\[ОБЪЕКТИВНО\]\n.*?(?=^---\n\n# 7\.)',
              '''# 6. Родной дом [УТВЕРЖДЕНО][ОБЪЕКТИВНО]\n\n- У главного героя есть один постоянный дом — небольшое славянское поселение.\n- Поселение является эмоциональным и системным центром игры, а не только интерфейсом между походами.\n- Оно способно физически расти и меняться по мере прохождения.\n- Люди могут приходить в дом, уходить, погибать, конфликтовать, создавать новые связи и менять его возможности.\n- Решения героя должны иметь право оставлять в доме видимый или социальный след.\n- В начале кампании хозяйственная жизнь Дома реально зависит от водного порядка, частью которого является плотина; её повреждение создаёт значимую практическую проблему.\n- Конкретное название, местоположение, полная история основания, устройство власти, семьи основателей и культурная специфика дома пока не утверждены.\n\n## 6.1. Забытое соглашение о воде [УТВЕРЖДЕНО][СКРЫТАЯ ИСТИНА]\n\nВ прошлом Дома существовало **значимое соглашение о воде**. Оно связывало пользование водой Дома с другими людьми, местами или правами региона. К началу игры существенный смысл этого соглашения утрачен или забыт нынешними жителями.\n\nПовреждение плотины и последующее расследование выводят героя к этому скрытому слою прошлого. Само раскрытие соглашения является утверждённым фактом стартовой линии, но его точное содержание пока не заполнено.\n\n[ОТКРЫТО]\n\n- кто заключил соглашение;\n- кто является его сторонами или носителями прав в настоящем;\n- какие права и обязанности оно задавало;\n- почему и каким образом память о нём была утрачена;\n- связано ли соглашение непосредственно с причиной повреждения плотины;\n- сохраняет ли оно человеческую правовую/обычную силу в настоящем;\n- существует ли вообще сверхъестественная сторона соглашения.\n\nОграничение:\n\n> **само существование соглашения не утверждает водяного духа, магическую юрисдикцию воды, саботаж, виновника или универсальный закон гидрологической магии.**\n\n[ОТКРЫТО]\n\n- Почему именно это поселение возникло здесь?\n- Что существовало на этом месте раньше помимо уже утверждённого соглашения о воде?\n- Что местные считают своей главной традицией?\n- С какими соседями Дом исторически связан?\n- Какие части соглашения сохранились в обычаях, хозяйственных действиях, документах, названиях мест или памяти отдельных людей?\n\n''',
              'LORE §6'
          )

          old49 = '10. Один старый договор/ошибка/преступление, которое оставило материальное или культурное наследие.'
          new49 = '10. Стороны, условия, действующие права/обязанности и причина забвения уже утверждённого соглашения о воде Дома.'
          if l.count(old49) != 1:
              raise SystemExit(f'LORE §49 point 10 count={l.count(old49)}')
          l = l.replace(old49, new49, 1)

          lore_journal_anchor = '# 52. Журнал лорных решений\n\n| Дата | Решение | Статус |\n|---|---|---|\n'
          lore_row = '| 06.09.2026 | Для родного Дома утверждён скрытый исторический слой: забытое соглашение о воде. Повреждение плотины в начале кампании становится причиной расследования, которое раскрывает этот факт; конкретные стороны, условия, причина повреждения, виновник и сверхъестественная природа не утверждены. | УТВЕРЖДЕНО / СКРЫТАЯ ИСТИНА |\n'
          if lore_journal_anchor not in l:
              raise SystemExit('LORE journal anchor missing')
          l = l.replace(lore_journal_anchor, lore_journal_anchor + lore_row, 1)
          p.write_text(l, encoding='utf-8')

          # DEVELOPMENT_STATUS.md
          p = Path('ProjectDocs/DEVELOPMENT_STATUS.md')
          d = p.read_text(encoding='utf-8')
          insert_after = '**Техническая граница v1.26:** код dialogue/quest-системы на этом шаге намеренно не менялся. Сначала должны быть определены герой, первый регион, ключевые NPC и первый большой квест; только после проверки реального контента следует закреплять универсальную архитектуру диалогов и проверок.\n'
          block = '''\n**Сюжетная фиксация 06.09.2026 — `«Дом на чужой воде»`:** основная завязка кампании утверждена как цепь `обычная жизнь Дома → повреждение плотины → расследование → выход героя к другим поселениям/людям региона → раскрытие забытого соглашения о воде`. Решение заменяет прежнее рабочее направление `«Короткая дорога»`. Стороны и условия соглашения, причина повреждения, виновник, сверхъестественная природа и связь с большой тайной остаются открытыми. Рабочий квест `«Новая плотина»` **не повышен до сюжетного канона**.\n\nСинхронизированы `ProjectDocs/NARRATIVE.md`, `ProjectDocs/LORE.md` и этот статус. `BESTIARY.md`, Unity-код, сцены, ассеты, `Packages`, `ProjectSettings` и корневой игровой канон не менялись; актуальный канон остаётся `KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_26.md`. Изменение полностью документальное, поэтому Unity Editor, C# compilation и Unity Test Runner не запускаются. Целевой commit: `docs: canonize Home on borrowed water opening`.\n'''
          if d.count(insert_after) != 1:
              raise SystemExit(f'DEV insertion anchor count={d.count(insert_after)}')
          d = d.replace(insert_after, insert_after + block, 1)

          old_priority = '`герой → конкретная завязка → главная тайна → антагонистическая сила → причинный позвоночник кампании → первый регион → ключевые NPC → первый большой квест → нарративный вертикальный срез`.'
          new_priority = '`герой → личная связь героя с «Домом на чужой воде» → стороны/условия/забвение соглашения → главная тайна → антагонистическая сила → причинный позвоночник кампании → первый регион → ключевые NPC → первый большой квест → нарративный вертикальный срез`.'
          if d.count(old_priority) != 1:
              raise SystemExit(f'DEV priority count={d.count(old_priority)}')
          d = d.replace(old_priority, new_priority, 1)

          old_gap = '- конкретный герой, завязка, тайна, антагонист, первый регион и финал.'
          new_gap = '- конкретный герой, детальная реализация утверждённой завязки `«Дом на чужой воде»`, тайна, антагонист, первый регион и финал.'
          if d.count(old_gap) != 1:
              raise SystemExit(f'DEV gap count={d.count(old_gap)}')
          d = d.replace(old_gap, new_gap, 1)

          old_step = '3. стартовая беда;'
          new_step = '3. личная связь героя с утверждённой завязкой `«Дом на чужой воде»` и конкретные стороны/цена забытого соглашения;'
          if d.count(old_step) != 1:
              raise SystemExit(f'DEV narrative priority item count={d.count(old_step)}')
          d = d.replace(old_step, new_step, 1)
          p.write_text(d, encoding='utf-8')
          PY

          rm .github/workflows/ks-doc-patch.yml

          git diff --check
          test "$(find . -maxdepth 1 -type f -name 'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v*.md' | wc -l)" -eq 1
          git diff --name-only

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProjectDocs/NARRATIVE.md ProjectDocs/LORE.md ProjectDocs/DEVELOPMENT_STATUS.md .github/workflows/ks-doc-patch.yml
          git diff --cached --check
          git commit -m 'docs: canonize Home on borrowed water opening'
          git push origin HEAD:main
