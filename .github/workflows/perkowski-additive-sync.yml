name: Perkowski additive sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perkowski-additive-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append approved Perkowski material
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def append_once(path, marker, block):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  print(f'skip {path}: marker already present')
                  return
              with p.open('a', encoding='utf-8', newline='') as f:
                  if not text.endswith('\n'):
                      f.write('\n')
                  f.write(block)
                  if not block.endswith('\n'):
                      f.write('\n')
              print(f'appended {path}')

          append_once(
              'ProjectDocs/NARRATIVE.md',
              '# 30. Jan L. Perkowski — рабочие квестовые варианты',
              r'''

# 30. Jan L. Perkowski — рабочие квестовые варианты [РАБОЧЕЕ]

[РАБОЧЕЕ][ДРУГОЙ ИСТОЧНИК: JAN L. PERKOWSKI + KINGDOM SURVIVAL]

Пакет утверждён 05.09.2026 **для сохранения и последующей проработки**. Подробный источниковедческий разбор и границы переноса: `ProjectDocs/PERKOWSKI_VAMPIRE_LORE_ADAPTATION.md`.

Ни один квест ниже не является `[СЮЖЕТНЫЙ КАНОН]`: конкретный регион, NPC, объективная природа предполагаемого вампира/упыря, религиозный порядок, ветки и финальные состояния будут определяться отдельно через `LORE → BESTIARY → NARRATIVE`.

## 30.1. «Похороните меня человеком» [РАБОЧЕЕ][JAN L. PERKOWSKI + KINGDOM SURVIVAL]

**Зацепка:** живой NPC, которого община с детства считает «будущим упырём», тяжело болен и заранее просит героя не позволить сделать с его телом «защитные» действия после смерти.

**Развитие:** герой узнаёт, что человек прожил обычную жизнь, но несколько семей всю жизнь избегали его; часть жителей уверена, что прежние профилактические меры и удерживали опасность.

**Осложнение:** после смерти начинают заболевать или умирать люди, причём первые случаи действительно связаны с семьёй покойного.

**Выбор:** исполнить волю умершего и защищать могилу / разрешить профилактическое вмешательство / расследовать цепь смертей до решения / уступить общине после нового случая.

**Последствия:** доверие семьи, отношение поселения к погребальному праву, судьба могилы и понимание того, что реально происходило.

## 30.2. «Не вскрывайте могилу» [РАБОЧЕЕ][JAN L. PERKOWSKI + KINGDOM SURVIVAL]

**Зацепка:** после нескольких смертей жители требуют вскрыть могилу недавно умершего человека.

**Развитие:** семья отказывается; знающий NPC приводит местные признаки; у каждого погибшего находится связь с умершим, но существует и альтернативная общая причина.

**Осложнение:** промедление может стоить новых жизней, а эксгумация сама нарушит погребальный порядок и способна уничтожить отношения с семьёй даже при ошибочном обвинении.

**Выбор:** разрешить эксгумацию сейчас / запретить / расследовать другим путём / вскрыть могилу тайно / добиться ограниченной процедуры с участием семьи.

**Последствия:** новая норма права на тело умершего, раскол или примирение общины, судьба подозреваемой семьи и реальная причина смертей.

## 30.3. «Человек, которого уже хоронили» [РАБОЧЕЕ][JAN L. PERKOWSKI + KINGDOM SURVIVAL]

**Зацепка:** человек, которого поселение считало погибшим и уже символически или фактически похоронило, неожиданно возвращается.

**Развитие:** часть близких узнаёт его, часть видит несостыковки; общество считает сам факт возвращения доказательством нечистой природы.

**Осложнение:** вернувшийся знает детали, которые должен знать настоящий человек, но его социальное место уже занято: имущество разделено, супруг/супруга принял новое решение, долг списан или наследник получил право.

**Выбор:** признать его живым человеком / изолировать / расследовать происхождение возвращения / считать вернувшимся мёртвым / оставить спор семье или общине.

**Последствия:** личность человека, наследование, семья и граница между социальным статусом умершего и объективной природой возвращения.

## 30.4. «Знающий мёртвых» [РАБОЧЕЕ][JAN L. PERKOWSKI + ЧУБИНСКИЙ + KINGDOM SURVIVAL]

**Зацепка:** в поселении начинается цепь ночных болезней и смертей; единственный человек, знающий местные способы распознавания опасного покойника, требует открыть конкретную могилу.

**Развитие:** его практические советы частично работают, но объяснения противоречат другим свидетельствам; жители всё сильнее передают ему власть решать, кого считать опасным.

**Осложнение:** следующий названный им покойник принадлежит семье, с которой у знающего был старый конфликт, либо его решение создаёт ему очевидную выгоду.

**Выбор:** довериться специалисту / проверить его методы / ограничить его власть / использовать его знание, не принимая объяснение / публично отвергнуть практику.

**Последствия:** судьба эпидемии или угрозы, статус знающего, будущий способ общины решать подобные кризисы и отношение к народному знанию.

## 30.5. «Колокол» [РАБОЧЕЕ][JAN L. PERKOWSKI + KINGDOM SURVIVAL]

**Зацепка:** после смерти человека с дурной посмертной репутацией ночью раздаётся колокол, хотя никто не признаётся, что поднимался к нему.

**Развитие:** местная традиция говорит, что пока опасный мёртвый берёт родственников, беда остаётся семейной; если он доберётся до колокола, она станет бедой всей общины.

**Осложнение:** после первого звона начинается паника, люди бегут, скрывают больных и требуют немедленно вскрыть могилу. При этом сам звон мог иметь человеческий источник, а реальные смерти — другую причинность.

**Выбор:** остановить панику и расследовать / вскрыть могилу / охранять колокол и кладбище / использовать звон как ловушку для человеческого виновника / принять локальное сверхъестественное правило, если оно подтверждается.

**Последствия:** массовый отъезд или сохранение жителей, доверие к власти, судьба семьи покойного, статус колокола/местного сигнала и объективная причина происходящего.

### Граница пакета Perkowski

Квесты не утверждают новую расу вампиров, заражение укусом, обязательное питьё крови, предопределённость по признаку рождения, универсальное право эксгумации, обязательную эффективность конкретного способа уничтожения или буквальный всемирный закон `звон колокола → смерть слышавших`.
''')

          append_once(
              'ProjectDocs/BESTIARY.md',
              '# 38. Jan L. Perkowski — вампирский случай',
              r'''

# 38. Jan L. Perkowski — вампирский случай как расследование опасного покойника

Источник: исследования Jan L. Perkowski по славянскому вампирскому фольклору. Подробная источниковедческая фиксация: `ProjectDocs/PERKOWSKI_VAMPIRE_LORE_ADAPTATION.md`.

Раздел не вводит новую расу `вампиров`. Он расширяет уже утверждённые модели неспокойного мёртвого, народного диагноза `опырь`, погребального порядка и общественного обвинения.

## 38.1. «Вампир/упырь» не является готовым видом существа [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ / FOLKLORE]

Если жители называют умершего вампиром, упырём или региональным аналогом, это считается **человеческим диагнозом**, а не автоматической авторской таксономией.

Под таким названием могут скрываться конкретный неспокойный мёртвый, возвращающееся тело, болезнь, ночное явление, другая сущность, человеческое преступление, массовый страх или сочетание причин.

## 38.2. Паспорт «вампирского случая» [УТВЕРЖДЕНО — ШАБЛОН]

Для значимого случая, где община подозревает опасного покойника, дополнительно проверяются:

1. Кто первым назвал умершего вампиром/упырём и почему?
2. Существовало ли подозрение ещё при жизни?
3. Какие признаки при жизни считались доказательством будущей опасности?
4. Какие меры предпринимались до смерти?
5. Что произошло во время смерти и погребения?
6. Какие профилактические действия были выполнены или пропущены?
7. Кто умер или заболел после похорон и в каком порядке?
8. Связаны ли предполагаемые жертвы с умершим родством, долгом, конфликтом, профессией или местом?
9. Какие признаки требуют эксгумации по местной традиции?
10. Кто имеет право открыть могилу и кто сопротивляется?
11. Какие признаки на теле люди считают подтверждением?
12. Какие из них могут иметь обычное физическое объяснение?
13. Что люди предлагают сделать с телом?
14. Что произойдёт социально после вмешательства?
15. Что произойдёт, если тело оставить в покое?
16. Что объективно является причиной происходящего?
17. Что в народной версии оказалось точным, а что — ошибочным?

## 38.3. «Будущий вампир» сначала является живым NPC [УТВЕРЖДЕНО — ПРИНЦИП]

Если человека при жизни считают тем, кто после смерти станет опасным, сначала проектируется **сам человек**, а не будущий монстр: характер, профессия, семья, друзья и враги, отношение к собственной репутации, вера в неё и пожелания о собственном погребении.

## 38.4. Профилактика и нейтрализация — разные стадии [УТВЕРЖДЕНО — ПРИНЦИП]

Не смешивать профилактику при рождении/умирании/подготовке тела/погребении и нейтрализацию после решения общины, что мёртвый уже причиняет вред. Ни один локальный способ не становится универсальной слабостью всех мёртвых.

## 38.5. Паттерн предполагаемых жертв — улика человеческих отношений [РЕКОМЕНДАЦИЯ]

Если опасному покойнику приписывают новые смерти, порядок жертв по возможности рассказывает о прежнем человеке: родственники, люди одного дома, старые враги, должники, участники похорон, люди одной дороги или профессии. Паттерн может как подтвердить связь, так и показать ошибочное объединение нескольких причин.

## 38.6. `Daemon contamination`: не собирать «идеального вампира» из разных образов [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]

Не переносить автоматически в одного противника признаки вампира, моры/зморы, полтергейста, оборотня, ведьмы, одержимости и литературного Dracula. Если симптомы пересекаются, расследование проверяет, действительно ли у них одна причина.

## 38.7. Эксгумация не является финальным подтверждением [УТВЕРЖДЕНО — ПРИНЦИП]

Необычное состояние тела после вскрытия могилы не выдаётся как автоматический ответ `VAMPIRE = TRUE`. Учитываются время после смерти, почва и вода, условия погребения, повреждение могилы, показания свидетелей, локальные верования и другие признаки истории.

## 38.8. Колокол — локальная эскалация от семьи к общине [УТВЕРЖДЕНО — ДОПУСТИМЫЙ МОТИВ / FOLKLORE]

Кашубский мотив сохраняется прежде всего как конструкция **семейная угроза → общественная угроза**. Буквальное правило `вампир звонит в колокол → все слышавшие умрут` не является универсальным законом `Kingdom Survival`.

## 38.9. Граница решений по Perkowski

Не утверждаются заражение укусом, обязательное питьё крови, предопределённость по признаку рождения, универсальные способы уничтожения, автоматическое право общины на эксгумацию, необычное сохранение тела как доказательство, универсальный закон колокола или Dracula как основа местного мёртвого.

Производственная формула:

> **живой человек и репутация → смерть → погребальный порядок → новые симптомы → общественный диагноз → спор о теле → расследование → действие → отделение объективной причины от верования → новое состояние семьи и общины.**
''')

          append_once(
              'ProjectDocs/LORE.md',
              '# 69. Jan L. Perkowski — опасный покойник',
              r'''

# 69. Jan L. Perkowski — опасный покойник, социальное клеймо и право на тело

Источник: исследования Jan L. Perkowski по славянскому вампирскому фольклору. Подробный разбор: `ProjectDocs/PERKOWSKI_VAMPIRE_LORE_ADAPTATION.md`.

Раздел расширяет решения по Зеленину, Гнатюку, Чубинскому и погребальному порядку. Он не вводит новую расу вампиров и не превращает локальные кашубские признаки в общеславянскую метафизику.

## 69.1. «Будущий вампир» может существовать как социальное клеймо [УТВЕРЖДЕНО][ВЕРОВАНИЕ / СОЦИАЛЬНЫЙ ПРИНЦИП]

В отдельной локальной традиции человека могут с рождения или после конкретного жизненного события считать тем, кто после смерти станет опасным. Такое верование может реально влиять на брак, доверие, отношение семьи, профессию, участие в переходных обрядах, слухи после беды и порядок собственных похорон.

Репутация «будущего вампира» объективно существует как социальный факт, но **не доказывает предопределённую сверхъестественную судьбу человека**. Признаки вроде рождения с зубами или плодной оболочкой/«сорочкой» могут быть `[ВЕРОВАНИЕМ]`, но не автоматическим авторским тестом.

## 69.2. Смерть может создавать конфликт прав на тело [УТВЕРЖДЕНО — ПРИНЦИП]

После смерти интересы семьи, общины, знающего человека, местной власти, ритуальной стороны и семей новых умерших могут расходиться. Тело умершего поэтому может становиться объектом социального, правового и мифологического конфликта. Это не утверждает автоматическое право общины вскрывать подозрительную могилу.

## 69.3. Эксгумация — общественное действие с необратимыми последствиями [УТВЕРЖДЕНО — ПРИНЦИП]

Вскрытие могилы должно менять состояние людей даже при ложной сверхъестественной версии: унижать или раскалывать семью, разрушать доверие к власти, усиливать слух, нарушать погребальный порядок, порождать новый долг или менять отношение к кладбищу. Эксгумация не является нейтральной кнопкой `проверить монстра`.

## 69.4. Цепь смертей может создать «посмертного виновника» [УТВЕРЖДЕНО — ПРИНЦИП]

Повторяющиеся смерти, слабость, ночные симптомы или необъяснимые болезни могут привести общину к поиску конкретного недавно умершего, на которого переносится причинность беды.

Форма: `реальные смерти → повторяемый паттерн → народное объяснение → подозреваемый покойник → давление на семью → проверка → объективная причина`.

Подозрение может оказаться верным, частично верным или полностью ошибочным.

## 69.5. «Вампир/упырь» остаётся народным диагнозом, а не расой [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ / FOLKLORE]

Слова `вампир`, `упырь`, `опырь` и региональные аналоги могут использоваться людьми шире объективной природы случая. Под таким названием могут скрываться неспокойный мёртвый, возвращающееся тело, болезнь, ночное явление, другой демонологический образ, человеческое преступление, массовый страх или сочетание причин.

## 69.6. Необычное состояние тела — улика, а не автоматический диагноз [УТВЕРЖДЕНО — ПРИНЦИП]

Необычное сохранение тела, цвет кожи, открытый глаз, кровь или другой признак после эксгумации может быть важным человеческим доказательством внутри мира, но не подтверждает сверхъестественное автоматически. Учитываются обычные причины: время после смерти, почва, вода, температура, способ погребения, повреждение могилы и действия людей.

## 69.7. Граница решений по Perkowski

Не утверждаются заражение укусом, обязательное питьё крови, предопределённость по признаку рождения, универсальные способы профилактики/уничтожения, универсальное право на эксгумацию, сохранность трупа как достаточное доказательство, кашубская модель как общая для всех регионов, Dracula как базовый образ или христианская космология как автоматически каноническая религия мира.

Главная формула слоя:

> **живой человек и репутация → смерть → погребальный порядок → новые реальные симптомы → общественный диагноз → спор о теле → расследование → действие → отделение объективной причины от верования → новое состояние семьи и общины.**
''')

