# Приложение: Adam Mickiewicz — `Dziady II`: обряд как расследование и «Четвёртый гость»

Подробный источниковедческий разбор: `ProjectDocs/MICKIEWICZ_DZIADY_II_ADAPTATION.md`.

## DZII-N1. Обряд как структура расследования [ИНСТРУМЕНТАРИЙ][MICKIEWICZ / DZIADY II + THE WITCHER 3 + DISCO ELYSIUM + KINGDOM SURVIVAL]

Поминальная или иная ритуальная сцена может работать не как лорная кат-сцена, а как детективная структура:

`известный порядок → несколько ограниченных свидетельств → повторяющиеся признаки → противоречие → незваное проявление → связь с живым → расследование обычного мира → решение → новое состояние`.

Сильная версия строится на трёх правилах:

1. Участники достаточно хорошо знают **норму**, чтобы игрок понял, когда она нарушена.
2. Мёртвые дают только ограниченные фрагменты, а не авторское всеведение.
3. Ответ приходится искать среди живых: в родстве, праве, собственности, погребении, песнях, документах, старой репутации и выгоде нынешней версии прошлого.

## DZII-N2. Большой побочный квест «Четвёртый гость» [РАБОЧЕЕ][MICKIEWICZ / DZIADY II + THE WITCHER 3 + DISCO ELYSIUM + KINGDOM SURVIVAL]

Концепция **утверждена для сохранения и дальнейшей разработки**, но не переведена в `[СЮЖЕТНЫЙ КАНОН]`.

### Зацепка

Герой присутствует при региональном коллективном поминальном обряде. Участники знают последовательность настолько хорошо, что способны заранее объяснить, что **должно** произойти дальше, хотя их объяснение объективной метафизики может быть неполным или ошибочным.

### Развитие: первые три контакта

Первые три проявления проходят в ожидаемом порядке и раскрывают **разные слои одной исторической раны**, а не три независимых мини-квеста.

Предпочтительная тройка функций:

1. **Человеческая цена** — кто пострадал и что было потеряно.
2. **Право / долг / порядок** — какое имущество, обязанность, зависимость или социальное устройство возникли после события.
3. **Память** — что нынешняя община помнит, исказила, забыла или сознательно скрывает.

Каждый контакт даёт только часть истины и хотя бы одну деталь, смысл которой проясняется позже.

### Осложнение: четвёртый гость

После момента, когда обряд уже должен закончиться, появляется **четвёртый мёртвый**.

Он:

- не был назван и не ожидался;
- не входит в известную последовательность;
- молчит;
- не принимает ожидаемого взаимодействия;
- устойчиво смотрит, следует или иным способом реагирует на **конкретного живого человека**.

Хранитель обряда не знает, кто это и что следует делать. Его компетентность сохраняется, но он не превращается в авторский справочник.

Главный вопрос квеста:

> **Почему этот мёртвый пришёл именно сюда, почему известный порядок его не знает и что связывает его с этим живым человеком?**

### Расследование живых

После обряда герой проверяет:

- происхождение и родство живого якоря;
- старые похороны и поминальные обязанности;
- спорные имена и принадлежность;
- землю, дом, наследование, долг или иное право;
- семейные рассказы, песни и записи;
- материальные следы старого события;
- кто выигрывает от нынешней версии памяти;
- почему первые три контакта знали только части истории.

Сверхъестественное создаёт **честное противоречие**, а причинность восстанавливается через расследование обычного человеческого мира.

### Значимое действие

Финал не сводится по умолчанию к `убить четвёртого призрака`.

Конкретное действие определяется будущей объективной природой случая и может включать признание забытого родства, возвращение права/вещи, изменение поминального порядка, раскрытие преступления, разрыв связи, передачу обязанности, отказ признавать требование или уничтожение реально опасного проявления.

### Три семейства устойчивых исходов

**A. Признание / включение.** Умерший, забытая связь или историческая правда получают место в общественной памяти; меняются семья, репутация, право, могила или обряд.

**B. Отделение / отказ.** Связь прекращается без принятия требования мёртвого; существующий порядок сохраняется ценой конкретной потери, скрытой правды или будущего напряжения.

**C. Передача / новая обязанность.** Ответственность переходит к другому человеку, семье, общине, месту или институту и становится новым долговременным `Narrative State`.

Это **семейства состояний, а не готовые кнопки**. Они не маркируются как добро/зло.

### Последствия

Квест должен по возможности менять несколько связанных вещей:

- живого человека-якорь;
- отношения семьи;
- репутацию или право;
- порядок поминовения;
- отношение общины к конкретным мёртвым;
- место захоронения или памяти;
- будущие сведения и обязательства.

### Что остаётся открытым

Не утверждены конкретный регион, поселение, личности первых трёх мёртвых, четвёртый мёртвый, живой якорь, историческая рана, объективная природа проявлений, форма обряда, точные финальные ветви и место квеста в кампании.

## DZII-N3. Граница переноса [ИНСТРУМЕНТАРИЙ][MICKIEWICZ / DZIADY II + KINGDOM SURVIVAL]

Не копировать буквальную фабулу, персонажей, моральные категории душ, христианскую карту посмертия или авторский приговор Мицкевича. Используется драматургический механизм:

> **понятный порядок → ограниченные свидетельства → исключение → живой якорь → расследование прошлого среди живых → новый общественный порядок и последствия.**

