# Приложение: Михаил Коцюбинский — «Тіні забутих предків»: быт, работа, смерть и устная память

Источник: Михаил Коцюбинский — **«Тіні забутих предків»** (1911). Подробный разбор: `ProjectDocs/KOTSIUBYNSKY_SHADOWS_ADAPTATION.md`.

Произведение используется как литературный референс с сильной этнографической основой, а не как автоматическое доказательство универсального гуцульского обычая или объективного закона мира. Слой сопоставлен с уже интегрированными материалами Владимира Шухевича, Владимира Гнатюка, Максимова/Мошиньского и Гринченко.

## KOT-L1. Повседневное и сверхъестественное не образуют два режима мира [УТВЕРЖДЕНО — ПРИНЦИП]

Житель не обязан переключаться между «обычной реальностью» и «магическим событием». Скот, погода, работа, семья, смерть, обряд, духи и местные правила существуют в одной системе практических решений.

Это уточняет уже действующие принципы общего образа мира, природы и бытовой причинности и не означает постоянной открытой магии: человек может соблюдать правило, не знать, работает ли оно объективно, и одновременно решать обычную хозяйственную проблему.

Источник: **[КОЦЮБИНСКИЙ / ТІНІ ЗАБУТИХ ПРЕДКІВ + KINGDOM SURVIVAL]**.

## KOT-L2. Обряд может быть частью работы [УТВЕРЖДЕНО — ПРИНЦИП]

Ритуальное действие может быть встроено в профессию и хозяйственный процесс, а не оформляться отдельной «магической сценой».

При проектировании сезонного стойбища, выпаса, мельницы, первой топки, промысла или иной работы допустима связка:

`начало работы → правильное действие / огонь / порядок → ежедневная хозяйственная практика → завершение сезона`.

Объективная магическая необходимость каждого действия утверждается отдельно.

Источник: **[КОЦЮБИНСКИЙ + МАКСИМОВ/МОШИНЬСКИЙ]**.

## KOT-L3. Профессия создаёт мифологическую микрокультуру [УТВЕРЖДЕНО — УТОЧНЕНИЕ]

Уже утверждённый принцип профессиональной локальной культуры углубляется: пастух, охотник, рыбак, мельник, кузнец, лесоруб, пчеловод и другие специалисты могут знать разные признаки, запреты, способы обращения и версии одной угрозы именно потому, что постоянно работают в разных локусах.

Профессиональное знание не равно магическому классу и может сочетать точное наблюдение, работающую практику, ошибочное объяснение и суеверие.

Источник: **[КОЦЮБИНСКИЙ + ГРИНЧЕНКО + МАКСИМОВ/МОШИНЬСКИЙ]**.

## KOT-L4. Хозяйственное место может иметь собственный ритуально отмеченный сезон [УТВЕРЖДЕНО — ДОПУСТИМЫЙ РЕГИОНАЛЬНЫЙ ПРИНЦИП]

Временное пастбище, лесная стоянка, промысловая хижина, мельница или другое рабочее место может иметь культурно значимое открытие и закрытие сезона: первый огонь, первый запуск, первый продукт, последний день работы или другое локальное действие.

Не вводится универсальный закон, что всякое сезонное место магически «включается» обрядом.

Источник: **[КОЦЮБИНСКИЙ + KINGDOM SURVIVAL]**.

## KOT-L5. Один бытовой обряд может обращаться к нескольким порядкам мира [УТВЕРЖДЕНО — ПРИНЦИП]

Внутри одной традиции человек может одновременно учитывать официальную веру, умерших, животных, дом и опасные нечеловеческие силы, не формулируя единую богословскую систему.

Такой синкретичный порядок является культурным фактом и не утверждает конкретный пантеон, устройство посмертия или объективную истинность всех частей обряда.

Источник: **[КОЦЮБИНСКИЙ]**.

## KOT-L6. Обряд сначала показывается действием, а его истинность выясняется отдельно [УТВЕРЖДЕНО — ПРИНЦИП]

Персонаж может освободить место для умершего, не садиться на определённую лавку, накормить скот перед праздником, оставить часть пищи или выполнить иной бытовой порядок задолго до того, как игрок узнает его объяснение.

Правило показа:

`действие и социальная норма → версия людей → наблюдаемые последствия → только затем возможная объективная причина`.

Это усиливает разделение `[ВЕРОВАНИЕ] ≠ [ОБЪЕКТИВНО]`.

Источник: **[КОЦЮБИНСКИЙ + KINGDOM SURVIVAL]**.

## KOT-L7. Смерть меняет общественный ритм и пространство [УТВЕРЖДЕНО — ПРИНЦИП]

Смерть значимого человека может менять не только состав NPC, но и звуковую среду, работу, движение родственников и соседей, доступность людей, встречи, торговлю и использование дома или дороги.

Региональный сигнал о смерти — колокол, рог, песня, трембита или иной способ — допустим как культурная практика конкретного места, но не устанавливается универсально.

Источник: **[КОЦЮБИНСКИЙ + KINGDOM SURVIVAL]**.

## KOT-L8. Поминальная ночь может сочетать скорбь и возвращение жизни [УТВЕРЖДЕНО — ДОПУСТИМЫЙ РЕГИОНАЛЬНЫЙ ОБЫЧАЙ]

В отдельных культурах ночь возле умершего может включать плач и воспоминания, пищу и питьё, рассказы, игры, шутки, смех, флирт и старые конфликты.

Такой обычай не универсален и не определяет объективную метафизику смерти. Его функция — показать, как община одновременно удерживает умершего в памяти и возвращается к жизни.

Источник: **[КОЦЮБИНСКИЙ]**.

## KOT-L9. Песня является живой хроникой региона [УТВЕРЖДЕНО — ПРИНЦИП]

Уже действующие решения о песне как живой памяти углубляются: песня может возникнуть из недавнего события, включая поступок героя, и начать влиять на репутацию, отношения и понимание истории до того, как событие станет «старой легендой».

Песня не является протоколом. Разные исполнители и поселения изменяют детали.

Источник: **[КОЦЮБИНСКИЙ + KINGDOM SURVIVAL]**.

## KOT-L10. Устная память преобразует факт в обычай [УТВЕРЖДЕНО — ПРИНЦИП]

Для долгой истории региона разрешена причинность:

`событие → рассказ очевидцев → песня / присказка → региональные версии → легенда → обычай / запрет → позднее объяснение`.

Чем дальше цепь от исходного события, тем важнее отделять устойчивую повторяющуюся деталь от моральной или фантастической интерпретации.

Источник: **[КОЦЮБИНСКИЙ + KINGDOM SURVIVAL]**.

## KOT-L11. Погодный знающий — социальная роль, а не RPG-маг [УТВЕРЖДЕНО — УТОЧНЕНИЕ]

Утверждённый принцип знающего человека и рабочий архетип хмарника дополняются: фигура, которой приписывают влияние на град или тучи, существует внутри хозяйства, репутации, оплаты, страха и взаимозависимости поселений.

Объективная способность конкретного человека по-прежнему утверждается отдельно; новый класс `мольфар` и универсальная школа погодной магии не вводятся.

Источник: **[КОЦЮБИНСКИЙ + ГНАТЮК + KINGDOM SURVIVAL]**.

## KOT-L12. Граница решений по Коцюбинскому [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]

Пакет не утверждает буквальный гуцульский народ как обязательную культуру мира; Аридника как объективного правителя или создателя; единую космогонию; одну демонологическую систему для всех жителей; доказанную истинность каждого обряда; универсальную погодную магию; объективное существование Чугайстира или Нявки.

Чугайстир и Нявка остаются рабочими `FOLKLORE + REFERENCE ONLY` конструкциями `BESTIARY.md`.

Пункт 16 исходного исследования — «не каждую сверхъестественную встречу превращать в расследование или бой» — **не утверждён** и в активные правила мира или нарратива не включается.

