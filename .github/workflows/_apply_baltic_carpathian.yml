# Приложение: Балтийско-карпатский пограничный слой — рабочие сущности и правила

Источники: Jonas Basanavičius; Tudor Pamfile; Emily Gerard. Слой синхронизирован с одноимённым приложением в `LORE.md` и не превращает региональные названия в универсальные виды существ.

## BC-B1. Змей-обогатитель: проверка происхождения богатства [УТВЕРЖДЕНО — РЕКОМЕНДАЦИЯ / FOLKLORE]

Для рабочего `Змея-обогатителя` к существующим вопросам добавляются:

- откуда реально берётся приносимый ресурс;
- создаётся ли он или переносится от другого владельца;
- кто несёт потерю;
- знает ли хозяин сущности происхождение богатства;
- что происходит с правом собственности после раскрытия.

Перенос богатства от другого хозяйства допустим как конкретный механизм, но не является универсальной способностью всех подобных сущностей.

Источник: **[BASANAVIČIUS + KINGDOM SURVIVAL]**.

## BC-B2. Лаума [РАБОЧЕЕ / FOLKLORE]

**Laumė / Лаума** разрешена как рабочая балтийская пограничная сущность/сила, но не как стандартный враг.

Паспорт строится через:

`регион → конкретная вода/баня/рабочее пространство → вечернее или ночное время → прядение/ткань/стирка/другая работа → форма обращения → помощь или дар → условие → нарушение → последствие`.

Она может помогать, дарить, наказывать за конкретное нарушение или оставаться опасной; объективное существование, единая внешность, происхождение и присутствие в первом регионе не утверждены.

Источник: **[BASANAVIČIUS]**.

## BC-B3. Внешняя имитация действия не копирует отношение [УТВЕРЖДЕНО — ПРИНЦИП ПРОЕКТИРОВАНИЯ]

Если эффект сущности, дара или обряда зависит от связи, права, локуса, участника или принятого условия, персонаж не получает гарантированный результат простым повторением видимых действий.

В паспорте значимой сущности проверяется:

`какое внешнее действие люди видят → какое скрытое отношение реально необходимо → какие ложные копии обряда существуют → как игрок может отличить форму от действующего условия`.

Это не означает, что сущность универсально «читает намерение».

Источник: **[BASANAVIČIUS + KINGDOM SURVIVAL]**.

## BC-B4. Условный дар [УТВЕРЖДЕНО — РЕКОМЕНДАЦИЯ]

Для дара или услуги разумной/полуразумной сущности разрешена конструкция, где необычное свойство сохраняется только пока выполняется конкретное условие.

Условие должно быть связано с отношением и иметь заранее читаемые признаки нарушения. Не каждый дар обязан работать по этой модели.

Источник: **[BASANAVIČIUS]**.

## BC-B5. Знакомый голос и ответ как локальный контакт [УТВЕРЖДЕНО — ДОПУСТИМАЯ ФУНКЦИЯ / FOLKLORE]

Для отдельной карпатской лесной сущности допустимо воспроизведение голоса близкого человека. В конкретном паспорте опасный контакт может завершаться **ответом человека**, а не самим услышанным зовом.

Это не универсальная способность лешего или всех лесных хозяев. `Muma Pădurii` не приравнивается к лешему только из-за сходной территориальной функции.

Источник: **[PAMFILE + KINGDOM SURVIVAL]**.

## BC-B6. Solomonar / Scholomance как версия происхождения хмарника [РАБОЧЕЕ / FOLKLORE]

Для рабочего `Хмарника` разрешена карпатская народная версия, будто он учился в тайной горной школе, у чужих или у нечеловеческого учителя.

В паспорте отдельно фиксируются:

- что человек действительно умеет;
- как он объясняет своё знание;
- как его происхождение объясняют местные;
- есть ли наблюдаемые подтверждения рассказу о «школе»;
- какая часть знания реально работает.

Объективная академия магов не утверждается.

Источник: **[PAMFILE + GERARD]**.

## BC-B7. Ненайденное тело расширяет паспорт утопленника [УТВЕРЖДЕНО — ПРИНЦИП / FOLKLORE]

Для значимого утопленника отдельно проверяется состояние **«тело не найдено»** как возможный якорь незавершённости.

Добавить вопросы:

- кто ищет останки и почему;
- какие способы поиска используют местные;
- какие из них только верование;
- существуют ли сон/знак/голос, указывающие место;
- как найденное тело меняет состояние воды, семьи, погребения и маршрута.

Ни один способ поиска не становится универсальной механикой.

Источник: **[BASANAVIČIUS + GERARD + KINGDOM SURVIVAL]**.

## BC-B8. Родовой клад и «пойманная тень» остаются рабочими связями [РАБОЧЕЕ / FOLKLORE + KINGDOM SURVIVAL]

Для `Кладника` или иного хранителя допускается конкретное право `клад ↔ род/семья`, если оно объяснено наследством, договором, долгом или преступлением. Это не наследственная способность обнаруживать клад.

Для рабочего `Тенерога` допускается исследовать **пойманную/измеренную тень, связанную со строением**, как один из вариантов происхождения его человеческой тени. Такой вариант остаётся `[РАБОЧЕЕ]` и не создаёт закона `измерили тень → человек умрёт`.

Источники: **[GERARD + KINGDOM SURVIVAL]**.

## BC-B9. Граница решений [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]

Не утверждаются: Лаума или `Muma Pădurii` как обязательные сущности мира; `Muma Pădurii` как «румынский леший»; Scholomance как объективная школа; универсальная сила ответа на любой голос; единый механизм сверхъестественного богатства; универсальная магия тени; родовое право на каждый клад.

Слой предназначен для конкретных пограничных регионов и историй после отдельного выбора их места в мире.
