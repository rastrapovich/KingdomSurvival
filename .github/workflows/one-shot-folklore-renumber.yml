name: One-shot folklore section renumber

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Renumber folklore expansion section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ProjectDocs/LORE.md')
          text = p.read_text(encoding='utf-8')
          marker = '# 68. Дополнения к восьми фольклорным направлениям: конкретные правила и следствия'
          if marker not in text:
              if '# 69. Дополнения к восьми фольклорным направлениям: конкретные правила и следствия' in text:
                  raise SystemExit(0)
              raise SystemExit('Folklore expansion heading not found')
          i = text.index(marker)
          head, tail = text[:i], text[i:]
          tail = tail.replace('# 68. Дополнения к восьми фольклорным направлениям: конкретные правила и следствия', '# 69. Дополнения к восьми фольклорным направлениям: конкретные правила и следствия', 1)
          tail = tail.replace('## 68.', '## 69.')
          tail = tail.replace('Раздел 68 не утверждает', 'Раздел 69 не утверждает')
          p.write_text(head + tail, encoding='utf-8')
          PY

      - name: Validate unique numbering
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^# 68\. Николай Гоголь' ProjectDocs/LORE.md)" -eq 1
          test "$(grep -c '^# 69\. Дополнения к восьми фольклорным направлениям' ProjectDocs/LORE.md)" -eq 1
          test "$(grep -c '^# 68\. Дополнения к восьми фольклорным направлениям' ProjectDocs/LORE.md || true)" -eq 0

      - name: Commit renumber and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-folklore-renumber.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/LORE.md .github/workflows/one-shot-folklore-renumber.yml
          git diff --cached --check
          git commit -m "docs: fix folklore lore section numbering"
          git push origin HEAD:main
