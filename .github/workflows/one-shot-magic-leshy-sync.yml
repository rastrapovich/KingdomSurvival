name: One-shot magic and leshy sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-magic-leshy-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved lore sync
        run: python3 ProjectDocs/magic_leshy_sync_once.py

      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: integrate magic and leshy lore decisions"
          git push origin HEAD:main
