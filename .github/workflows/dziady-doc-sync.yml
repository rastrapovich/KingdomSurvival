name: Dziady II docs sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dziady-doc-sync.yml'

permissions:
  contents: write

concurrency:
  group: dziady-ii-docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize approved Dziady II decisions
        run: python3 .github/scripts/dziady_sync.py

      - name: Validate, commit and push synchronized docs
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'DZII-L1' ProjectDocs/LORE.md)" -eq 1
          test "$(grep -c 'DZII-B1' ProjectDocs/BESTIARY.md)" -eq 1
          test "$(grep -c 'DZII-N1' ProjectDocs/NARRATIVE.md)" -eq 1
          test "$(grep -c 'Документальная интеграция Adam Mickiewicz — `Dziady`, часть II' ProjectDocs/DEVELOPMENT_STATUS.md)" -eq 1
          test -f ProjectDocs/MICKIEWICZ_DZIADY_II_ADAPTATION.md
          test ! -e .github/workflows/dziady-doc-sync.yml
          test ! -e .github/scripts/dziady_sync.py
          git diff --check
          git status --short
          git config user.name "rastrapovich"
          git config user.email "125567783+rastrapovich@users.noreply.github.com"
          git add -A -- ProjectDocs/LORE.md ProjectDocs/BESTIARY.md ProjectDocs/NARRATIVE.md ProjectDocs/DEVELOPMENT_STATUS.md .github/workflows/dziady-doc-sync.yml .github/scripts/dziady_sync.py
          git diff --cached --check
          git commit -m "docs: integrate Mickiewicz Dziady II decisions"
          git push origin HEAD:main
