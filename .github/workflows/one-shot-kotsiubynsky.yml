# Приложение: Михаил Коцюбинский — «Тіні забутих предків»: человеческая драма, песня и социальная сцена

Метка **[КОЦЮБИНСКИЙ / ТІНІ ЗАБУТИХ ПРЕДКІВ]** означает литературный приём из повести, адаптированный под уже утверждённые лорные правила `Kingdom Survival`. Конкретный сюжет Ивана, Марички, Палагны и Юры не переносится.

## KOT-N1. Сверхъестественное осложняет человеческую драму, но не заменяет её [ИНСТРУМЕНТАРИЙ][КОЦЮБИНСКИЙ / ТІНІ ЗАБУТИХ ПРЕДКІВ + KINGDOM SURVIVAL]

Ревность, брак, горе, репутация, собственность, труд, зависть, долг и желание остаются человеческими причинами даже там, где сверхъестественное объективно реально.

Мифологическая сила может усилить, скрыть или изменить конфликт, но не должна автоматически снимать ответственность живых словами «это всё проклятие».

Проверка: если убрать сверхъестественный слой, остаётся ли узнаваемое человеческое противоречие? Если нет, проверить, не передана ли вся человеческая причинность внешней силе.

Это не означает, что каждая мифологическая история обязана иметь бытовую «настоящую причину».

## KOT-N2. Песня как реактивная память [ИНСТРУМЕНТАРИЙ][КОЦЮБИНСКИЙ / ТІНІ ЗАБУТИХ ПРЕДКІВ + KINGDOM SURVIVAL]

`решение игрока → рассказ очевидца / певца → песня → изменённая версия в другом месте → социальная реакция`.

Песня может менять доверие, слух, отношение к герою или память об умершем. Она не является интерфейсным счётчиком репутации и не обязана появляться после каждого действия.

## KOT-N3. Устное искажение как отложенное последствие [ИНСТРУМЕНТАРИЙ][КОЦЮБИНСКИЙ / ТІНІ ЗАБУТИХ ПРЕДКІВ + KINGDOM SURVIVAL]

Позднее последствие решения может вернуться не как надпись `репутация +5/-5`, а как знакомая история с изменённым смыслом.

Несколько версий позволяют сравнивать, кому выгодно конкретное искажение; повторяющаяся деталь может быть уликой; социально доминирующая версия не обязана быть фактически истинной.

## KOT-N4. Поминальная ночь как живая социальная сцена [ИНСТРУМЕНТАРИЙ][КОЦЮБИНСКИЙ / ТІНІ ЗАБУТИХ ПРЕДКІВ]

Допустим ритм сцены:

`горе / обряд → еда и воспоминания → шутки / игры / питьё → ослабление социальной защиты → проявление старых связей, долгов и конфликтов`.

Информация раскрывается через поведение сети живых людей, а не через обязательный детективный допрос у тела.

Не превращать похороны в комедию механически: изменение тона должно принадлежать конкретному местному обычаю и людям.

## KOT-N5. «Живой огонь» [РАБОЧЕЕ][КОЦЮБИНСКИЙ / ТІНІ ЗАБУТИХ ПРЕДКІВ + D&D / RIME + KINGDOM SURVIVAL]

**Зацепка:** сезонное стойбище, пастбище или лесная рабочая точка перестаёт поставлять важный региону ресурс.

**Развитие / расследование:** участники говорят, что рабочий или «живой» огонь погас раньше срока; часть людей винит хранителя порядка.

**Осложнение:** одновременно меняется состояние скота, исчезает человек, звери подходят ближе или появляется другая материальная улика, показывающая, что простой вины хранителя недостаточно.

**Значимое действие / выбор:** восстановить старый порядок; перенести хозяйство; наказать или защитить хранителя; выяснить, что погасший огонь был симптомом более глубокой причины.

**Последствие:** стойбище восстанавливается на новых условиях, закрывается или меняет правила; нарушается или возобновляется снабжение соседей; хранитель теряет или возвращает доверие; меняется маршрут.

## KOT-N6. «Песня о тебе» [РАБОЧЕЕ][КОЦЮБИНСКИЙ / ТІНІ ЗАБУТИХ ПРЕДКІВ + KINGDOM SURVIVAL]

**Зацепка:** герой слышит песню о собственном прежнем решении и узнаёт событие по деталям, но смысл уже искажён.

**Развитие:** в соседних местах существуют несовместимые версии, каждая подчёркивает интерес конкретной семьи, группы или певца.

**Осложнение:** наиболее популярная версия начинает реально вредить или помогать конкретному человеку и меняет отношение к герою.

**Значимое действие / выбор:** опровергать; игнорировать; использовать легенду; искать автора или певца; предъявить доказательство, рискуя только усилить песню.

**Последствие:** одна версия становится доминирующей или сохраняется спор нескольких версий; меняются отношения и доступное знание. Отдельный «счётчик истины» не нужен.

## KOT-N7. «Ночь возле мёртвого» [РАБОЧЕЕ][КОЦЮБИНСКИЙ / ТІНІ ЗАБУТИХ ПРЕДКІВ + KINGDOM SURVIVAL]

**Зацепка:** смерть знакомого NPC приводит героя на ночное поминовение.

**Развитие / расследование:** воспоминания разных людей показывают его семью, друзей, врагов, долги и незаконченные отношения.

**Осложнение:** горе, еда, питьё, игры, шутки или усталость ослабляют привычные социальные маски; всплывает долг, обвинение или противоречие.

**Значимое действие / выбор:** поддержать семью; оспорить обвинение; защитить человека; последовать за уликой; отказаться превращать ночь в допрос; сделать иной выбор из конкретного конфликта.

**Последствие:** меняются отношения с семьёй или поселением и доступное знание; сцена может породить следующий квест, но не обязана быть скрытым «квестодателем».

## KOT-N8. Граница пакета [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]

Не переносить сюжет Ивана, Марички, Палагны и Юры, буквальные сцены и реплики. Чугайстир и Нявка остаются рабочими сущностями `BESTIARY.md`.

