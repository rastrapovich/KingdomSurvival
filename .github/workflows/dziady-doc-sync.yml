# Приложение: Adam Mickiewicz — `Dziady II`: поминовение, процедура и посмертная принадлежность

Источник: Adam Mickiewicz — **`Dziady`, часть II**. Подробный разбор и границы переноса: `ProjectDocs/MICKIEWICZ_DZIADY_II_ADAPTATION.md`.

Источник используется как **литературный референс**, а не как этнографическое доказательство или готовая карта посмертия. Решения ниже углубляют уже утверждённые правила смерти, погребального порядка, коллективного поминовения и знающих людей.

## DZII-L1. Коллективное поминовение может иметь устойчивую региональную процедуру [УТВЕРЖДЕНО — РЕГИОНАЛЬНАЯ КУЛЬТУРНАЯ ВОЗМОЖНОСТЬ]

Уже разрешённая коллективная память о безымянных, чужих и иных умерших без обычного места среди семейных предков может в конкретном регионе оформляться в **совместный обряд с известной последовательностью действий**.

Такой порядок способен определять, кого община признаёт своим умершим, кого обязана назвать, выслушать, помянуть, накормить или иным образом включить в коллективную память.

Это не вводит единый мировой праздник и не утверждает, что все умершие объективно приходят на один и тот же обряд.

## DZII-L2. Поминальный обряд прежде всего является общественной обязанностью, а не заклинанием [УТВЕРЖДЕНО — ПРИНЦИП]

Главная лорная функция обряда — фиксировать отношения живых с умершими и друг с другом:

`кто помнит → кого признают своим → кто обязан участвовать → кто принимает долг → кого исключили → что меняется после признания или отказа`.

Пища, питьё, имя, приглашение и иные действия трактуются через уже утверждённые правила конкретного контекста. Они не становятся универсальными компонентами магии вызова мёртвых.

Объективная сверхъестественная эффективность конкретного обряда определяется отдельно.

## DZII-L3. Хранитель процедуры может знать правильный порядок, не понимая метафизику [УТВЕРЖДЕНО — ПРИНЦИП]

Для отдельного обычая допустим человек, который хранит последовательность действий, имена, запреты, формы обращения и момент завершения обряда.

Такой хранитель:

- не обязан быть магом или жрецом;
- может быть обычным уважаемым участником общины;
- способен правильно знать **что делать**;
- может ошибаться в объяснении **почему это работает**;
- не получает авторского всеведения о природе каждого пришедшего мёртвого.

## DZII-L4. Посмертная принадлежность может быть предметом человеческого конфликта [УТВЕРЖДЕНО — ПРИНЦИП]

После смерти может оставаться спор не только о могиле, но и о том, **к кому человек принадлежит в памяти и обязанностях живых**.

Конфликт способен касаться:

- семьи и спорного родства;
- нескольких поселений;
- человека без признанного дома;
- умершего, которого не считают «своим»;
- того, кто был исключён из обычного поминовения;
- обязанности назвать, похоронить, принять или помнить человека.

Социальные последствия такого спора объективно реальны. Его сверхъестественное выражение существует только там, где отдельно утверждён конкретный случай.

## DZII-L5. Граница решений по `Dziady II` [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]

Интеграция **не утверждает**:

- объективные классы «лёгких / средних / тяжёлых» душ;
- чистилище, рай или ад как подтверждённую карту посмертия;
- автоматическое моральное воздаяние после смерти;
- универсальный обряд вызова мёртвых;
- гарантированную магическую силу пищи, питья или любого поминального действия;
- обязательную правдивость мёртвого во время обряда;
- буквальный перенос персонажей и религиозной схемы Мицкевича.

Главная формула слоя:

> **общественная память и обязанность → известный локальный порядок → конкретный умерший нарушает или не помещается в этот порядок → живые вынуждены заново определить принадлежность, долг и ответственность.**

