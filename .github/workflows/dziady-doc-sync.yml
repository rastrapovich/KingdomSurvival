`«Четвёртый гость»` **не переведён в `[СЮЖЕТНЫЙ КАНОН]`**: утверждены концепция, структура, три семейства устойчивых итоговых состояний и способ расследования, но конкретный регион, NPC, историческая правда и объективная природа четвёртого проявления остаются открытыми.

`Dziady II` используется как **литературный референс**, а не как этнографическая стенограмма или доказательство объективного посмертия. Не вводятся классы «лёгких/средних/тяжёлых» душ, чистилище/рай как подтверждённая карта посмертия, автоматическое моральное воздаяние, универсальный ритуал вызова мёртвых или гарантированная магическая сила пищи/поминального действия.

Общий игровой канон остаётся **v1.26**: новая фундаментальная механика не вводилась. Код Unity, сцены, ассеты, сериализуемые данные, `Packages` и `ProjectSettings` не менялись; Unity Editor, C# compilation и Unity Test Runner для этой документальной синхронизации не запускались.

Известное ограничение документации вне масштаба этого шага: ранее в `LORE.md`/`BESTIARY.md` уже существовали повторяющиеся номера некоторых поздних разделов; их глобальная перенумерация намеренно не выполнялась, чтобы не затрагивать несвязанные утверждённые пакеты.

Следующий логичный шаг для `«Четвёртого гостя»`: выбрать конкретный регион/поселение, определить живого человека-якорь и одну историческую рану, после чего собирать сцены и диалоги через актуальный инструментарий `NARRATIVE.md`.
