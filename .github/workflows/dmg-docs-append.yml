name: DMG docs append
on:
  push:
    branches:
      - docs/dmg-camp-integration-work
permissions:
  contents: write
jobs:
  append-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/dmg-camp-integration-work
      - name: Append approved DMG sections
        shell: bash
        run: |
          echo '' | base64 -d | gunzip >> ProjectDocs/LORE.md
          echo '' | base64 -d | gunzip >> ProjectDocs/NARRATIVE.md
          echo '' | base64 -d | gunzip >> ProjectDocs/DEVELOPMENT_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dmg-docs-append.yml
          git add ProjectDocs/LORE.md ProjectDocs/NARRATIVE.md ProjectDocs/DEVELOPMENT_STATUS.md
          git diff --check
          git commit -m "temp: append approved DMG docs sections"
          git push origin HEAD:docs/dmg-camp-integration-work
