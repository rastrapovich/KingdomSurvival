name: Mickiewicz one-shot integration

on:
  push:
    branches:
      - noop-temp-do-not-use

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.event.head_commit.message == 'chore: activate Mickiewicz integration' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: noop-temp-do-not-use
          fetch-depth: 0
      - name: Apply and validate approved package
        shell: bash
        run: |
          python3 .github/mickiewicz_patch.py
          git diff --check
          expected="ProjectDocs/BESTIARY.md
          ProjectDocs/DEVELOPMENT_STATUS.md
          ProjectDocs/LORE.md
          ProjectDocs/MICKIEWICZ_BALLADY_I_ROMANSE_ADAPTATION.md
          ProjectDocs/NARRATIVE.md"
          actual="$(git status --short ProjectDocs | awk '{$1=""; sub(/^ /,""); print}' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected ProjectDocs diff:"
            printf '%s\n' "$actual"
            exit 1
          fi
          rm -f .github/workflows/mickiewicz-one-shot.yml .github/mickiewicz_patch.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "docs: integrate Mickiewicz Ballady i romanse decisions"
          git push origin HEAD:noop-temp-do-not-use
