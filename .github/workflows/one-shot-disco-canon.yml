name: One-shot Disco canon sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-disco-canon.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved narrative canon
        run: python3 .github/scripts/one_shot_disco_canon.py

      - name: Validate exact diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_26.md
          test ! -f KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_25.md
          test -f ProjectDocs/Archive/KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_25.md
          test ! -f .github/workflows/one-shot-disco-canon.yml
          test ! -f .github/scripts/one_shot_disco_canon.py
          grep -q '11A. Инструментарий Disco Elysium' ProjectDocs/NARRATIVE.md
          grep -q 'Каноническое уточнение v1.26' ProjectDocs/DEVELOPMENT_STATUS.md
          grep -q '\*\*Версия:\*\* 1.26' KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_26.md

          actual="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/one_shot_disco_canon.py' \
            '.github/workflows/one-shot-disco-canon.yml' \
            'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_25.md' \
            'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_26.md' \
            'ProjectDocs/Archive/KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v1_25.md' \
            'ProjectDocs/DEVELOPMENT_STATUS.md' \
            'ProjectDocs/NARRATIVE.md' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected changed files:'
            git status --short
            exit 1
          fi
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: canonize Disco Elysium dialogue principles'
          git push origin HEAD:main
