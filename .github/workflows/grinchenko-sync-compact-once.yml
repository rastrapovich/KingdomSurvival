name: Compact Grinchenko docs sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grinchenko-sync-compact-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Distribute approved items
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('ProjectDocs/GRINCHENKO_ETHNOGRAPHIC_ADAPTATION.md').read_text(encoding='utf-8')
          matches = list(re.finditer(r'(?m)^## (\d+)\. (.+)$', src))
          items=[]
          for i,m in enumerate(matches):
              end=matches[i+1].start() if i+1<len(matches) else len(src)
              items.append((int(m.group(1)),m.group(2).strip(),src[m.end():end].strip()))

          def cleaned(body):
              return re.sub(r'\n\*\*Синхронизация:\*\*.*?(?=\n\n|\Z)','',body,flags=re.S).strip()

          lp=Path('ProjectDocs/LORE.md'); lore=lp.read_text(encoding='utf-8')
          lm='# 61. Решения по Б. Д. Гринченко — локальный фольклор и бытовое сверхъестественное'
          if lm not in lore:
              out=['\n\n---\n\n'+lm,'','Источник: Б. Д. Гринченко — **«Этнографические материалы, собранные в Черниговской и соседних с ней губерниях»** (1895–1899).','','Полный пакет из 28 утверждённых пунктов: `ProjectDocs/GRINCHENKO_ETHNOGRAPHIC_ADAPTATION.md`. Здесь синхронизированы пункты, относящиеся к устройству мира, верованиям, местам, социальным отношениям и устной традиции. Источник: **[ГРИНЧЕНКО + KINGDOM SURVIVAL]**.','']
              for n,t,b in items:
                  if '`LORE.md`' in b:
                      out += [f'## 61.{n}. {t}','',cleaned(b),'']
              out += ['## 61.29. Граница решений [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]','','Этот слой не создаёт единую официальную демонологию, не доказывает любое обвинение в ведьмовстве, не помещает монстра в каждое плохое место, не делает каждую народную формулу буквальной истиной и не устанавливает универсальную сверхъестественную причину природных бедствий.','','Главная формула: **локальный рассказ → противоречивые свидетели → повторяющаяся деталь → бытовое/социальное последствие → проверка места, человека и правила → объективная причина конкретного случая.**','']
              lore += '\n'.join(out)
              anchor='| 05.09.2026 | По П. П. Чубинскому утверждены принципы календаря как карты риска, региональных версий одного правила, повреждённой памяти обрядов, социального и погребального порядка, обычного права, межи, родства, переходных состояний, неоднозначной защиты и передачи знания через бытовой фольклор. | УТВЕРЖДЕНО |'
              row='| 05.09.2026 | По Б. Д. Гринченко утверждены локальные противоречивые свидетельства, животные-посредники, ведьма как социальная категория, бытовая жизнь нечеловеческого порядка, аномальные места без обязательного монстра, ремесленники-посредники и передача правил через пословицы, загадки и детский фольклор. | УТВЕРЖДЕНО |'
              if anchor in lore and row not in lore: lore=lore.replace(anchor,anchor+'\n'+row,1)
              lp.write_text(lore,encoding='utf-8')

          bp=Path('ProjectDocs/BESTIARY.md'); best=bp.read_text(encoding='utf-8')
          bm='# 30. Решения по Б. Д. Гринченко — свидетельства, признаки и культурное существование сущности'
          if bm not in best:
              out=['\n\n---\n\n'+bm,'','Источник: Б. Д. Гринченко — **«Этнографические материалы, собранные в Черниговской и соседних с ней губерниях»** (1895–1899).','','Полный пакет из 28 утверждённых пунктов: `ProjectDocs/GRINCHENKO_ETHNOGRAPHIC_ADAPTATION.md`. Здесь синхронизированы правила признаков, поведения и взаимодействия. Источник: **[ГРИНЧЕНКО + KINGDOM SURVIVAL]**.','']
              for n,t,b in items:
                  if '`BESTIARY.md`' in b:
                      out += [f'## 30.{n}. {t}','',cleaned(b),'']
              out += ['## 30.29. Производственный шаблон крупной фольклорной сущности [УТВЕРЖДЕНО — РЕКОМЕНДАЦИЯ]','','**2–4 противоречивых свидетельства → 2–3 повторяющихся признака → 1–2 ложных или неполных правила → настоящее правило/причина → последствие взаимодействия.**','','Повторяющийся звук, предмет, поведение животного, время, место или бытовое действие должны работать как честная улика до раскрытия.','','## 30.30. Граница решений [УТВЕРЖДЕНО — ОГРАНИЧЕНИЕ]','','Не утверждаются универсальное сверхъестественное зрение животных, отдельная раса ведьм, единая цивилизация нечисти, универсальная подмена восприятия, обязательная память каждой сущности, наличие монстра за каждым аномальным местом или буквальная истинность народных формул.','']
              best += '\n'.join(out); bp.write_text(best,encoding='utf-8')

          sp=Path('ProjectDocs/DEVELOPMENT_STATUS.md'); status=sp.read_text(encoding='utf-8')
          sm='## Документальная синхронизация Гринченко — 05.09.2026'
          if sm not in status:
              status += '\n\n---\n\n'+sm+'\n\n- Все 28 утверждённых пунктов из `ProjectDocs/GRINCHENKO_ETHNOGRAPHIC_ADAPTATION.md` распределены в `LORE.md` и `BESTIARY.md` по указанной в каждом пункте синхронизации.\n- Добавлен производственный шаблон: `2–4 противоречивых свидетельства → 2–3 повторяющихся признака → 1–2 ложных/неполных правила → настоящее правило/причина → последствие взаимодействия`.\n- Общий игровой канон остаётся v1.25; код Unity не менялся. Для документальной синхронизации компиляционные и игровые тесты не требовались.\n'
              sp.write_text(status,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/LORE.md ProjectDocs/BESTIARY.md ProjectDocs/DEVELOPMENT_STATUS.md
          git commit -m "docs: sync Grinchenko decisions into living docs"
          git rm -f .github/workflows/grinchenko-sync-once.yml .github/workflows/grinchenko-sync-compact-once.yml
          git commit -m "chore: remove one-shot Grinchenko sync workflows"
          git push origin HEAD:main
