# Приложение 06.09.2026 — DMG: лагерь, активные конфликты и ритм [ИНСТРУМЕНТАРИЙ][D&D / DMG + KINGDOM SURVIVAL]

Подробный разбор и границы переноса: `ProjectDocs/DMG_ADAPTATION.md`. Этот слой является **инструментарием**, а не новым сюжетным каноном и не обязательным чек-листом каждой экспедиции.

## 1. Лагерь как короткая самостоятельная сцена

Предпочтительная форма содержательного привала:

> **`место стоянки → один главный приоритет → человеческая/мировая реакция → ночь → последствие утром`**

Отдельная лагерная сцена нужна только если она меняет хотя бы одно из: **знание, отношения, риск, время, состояние отряда или состояние мира**. Иначе ночёвку лучше сократить.

## 2. Место стоянки — часть истории

Значимая ночёвка может начинаться с выбора места. Проверяются укрытие, вода, сухость, видимость, следы людей и зверей, чужое право, хозяйственное использование и мифологическая значимость.

`LORE.md` имеет приоритет: лагерь не создаёт собственные универсальные табу или законы.

## 3. Событие выводится из контекста

Предпочтительная причинность:

> **`регион + место + время + действия игрока + состояние мира + прежние последствия → подходящий пул событий`**

Большинство лагерных событий по умолчанию полезнее как информация, след, человек, внутренний конфликт, предвестие, болезнь, погодное изменение или новое решение, а не как обязательное нападение.

## 4. After-action: кто не способен оставить произошедшее без реакции

[ИНСТРУМЕНТАРИЙ][D&D / DMG + DISCO ELYSIUM + KINGDOM SURVIVAL]

После потери, тяжёлого выбора, предательства, нарушения обещания, встречи с невозможным, спасения или важного открытия первая спокойная стоянка может проверять:

> **кто из присутствующих не способен оставить произошедшее без реакции?**

Реакция должна исходить из личности и отношений конкретного человека и иметь право изменить доверие, сведения, будущие реплики или решение.

Это не обязательный разговор после каждого боя.

## 5. Лагерь как место интерпретации улик

[ИНСТРУМЕНТАРИЙ][D&D / DMG + THE WITCHER 3 + DISCO ELYSIUM]

У костра можно сопоставить физические следы, свидетельства, профессиональное знание и местные версии. Разные спутники способны давать разные интерпретации одной улики.

Результат — новая гипотеза, новый вопрос, участок поиска, подготовка или решение вернуться за человеком/ресурсом. Сохраняется правило `увидеть улику ≠ понять улику`.

## 6. Один главный приоритет вместо лагерного микроменеджмента

На содержательном привале игрок выбирает максимум **один действительно важный вопрос**, сформулированный через конкретную ситуацию: заняться раненым, скрыть огонь, исследовать найденное, проверить след, продолжить путь ночью, сохранить редкий запас и т. п.

Это не постоянное UI-меню из семи лагерных кнопок. Остальной бытовой уход предполагается автоматически, пока сам не стал конфликтом.

## 7. Отдых не замораживает мир и не стирает последствия

Время привала является реальным временем мира. Пока герой отдыхает, причинно могут продолжаться преследование, болезнь, движение людей, изменение воды/погоды, укрепление противника, распространение слуха и процессы Дома.

При этом отдых не является универсальным сбросом истории: серьёзная рана, болезнь, страх, конфликт, потеря доверия, сломанная вещь и сюжетное последствие имеют собственные способы разрешения.

Точная механика лечения/усталости остаётся отдельным техническим решением.

## 8. Безопасные места — заработанное знание региона

Исследование может открыть знакомую хижину, двор, пасеку, пещеру или иную точку как более предсказуемое место отдыха. Безопасность может зависеть от сезона, отношений, хозяина и локального правила.

Это не система строительства походных баз и не сеть тайников.

## 9. Лагерь как пространство предвестий

[ИНСТРУМЕНТАРИЙ][D&D / DMG + D&D / RIME + KINGDOM SURVIVAL]

Повторяющийся звук, поведение животных, вода, дым, свет, след или отсутствие привычного признака могут сначала быть атмосферой, затем вопросом, а позднее — честной уликой к локальной или большой угрозе.

## 10. Нежеланный гость у огня

[ИНСТРУМЕНТАРИЙ][D&D / DMG + ТАРАНТИНО + KINGDOM SURVIVAL]

Сцена может строиться как:

`сигнал из темноты → неизвестность намерений → разрешить/не разрешить приблизиться → разговор под ограниченным доверием → информация/сделка/угроза/последствие`.

Гость не обязан немедленно становиться боевой встречей. Ценность формы — напряжение между людьми, которые пока разговаривают, хотя имеют причины не доверять друг другу.

## 11. Дом продолжает жить, пока героя нет

[ИНСТРУМЕНТАРИЙ][D&D / DMG 2024 + KINGDOM SURVIVAL]

Дом и походный лагерь выполняют разные функции. Лагерь — временный узел экспедиции; Дом — эмоциональный и системный центр, который продолжает причинно меняться в отсутствие героя.

Пока герой в походе, могут развиваться стройка, хозяйство, конфликты людей, дефицит, прибытие/уход жителей, чужие просьбы, слухи и последствия прежних решений.

Возвращение домой должно иметь право показывать **что произошло без прямого присутствия героя**.

## 12. Один высокий приоритет Дому перед долгим отсутствием

[ИНСТРУМЕНТАРИЙ][D&D / DMG 2024 + KINGDOM SURVIVAL]

Перед содержательно долгой экспедицией допустимо дать Дому **одно высокоуровневое направление**: укреплять, закончить конкретную стройку, запасать, беречь ресурсы, принять/не принять людей, разведать окрестности или решить заранее известную задачу.

По возвращении важен не только результат, но и цена следования приоритету в изменившихся обстоятельствах.

Это **не утверждение готового меню приказов, UI или полноценной симуляции Bastion/Home**.

## 13. Паспорт активного конфликта

[ИНСТРУМЕНТАРИЙ][D&D / DMG 2024 + KINGDOM SURVIVAL]

Для нескольких действительно важных процессов региона автору полезно отслеживать:

1. чего хочет сторона/сила;
2. что она делает сейчас;
3. что произойдёт без вмешательства героя;
4. что игрок уже знает;
5. что игрок считает правдой ошибочно или неполно;
6. какое событие способно изменить её план;
7. как конфликт затрагивает Дом;
8. какой следующий **видимый симптом** покажет развитие процесса.

Это авторский tracking-инструмент, не таблица игрока.

## 14. Важный конфликт не ждёт героя неподвижно

Значимый процесс предпочитает форму:

`состояние A → действие стороны → видимый симптом → состояние B → новая возможность/угроза`.

Не нужен таймер на каждом побочном квесте. Производственный ориентир — примерно **5–10 действительно важных процессов** содержательного региона, а не симуляция сотен NPC.

## 15. Три семейства давления

[ИНСТРУМЕНТАРИЙ][D&D / DMG 2024 + KINGDOM SURVIVAL]

При проектировании региона полезно проверить три разных источника давления:

1. кризис/напряжение Дома;
2. человеческий региональный конфликт;
3. непонятая старая/мифологическая проблема.

Они не обязаны быть тремя фракциями, одинаково активными линиями или обязательной структурой каждого региона. Сильный эффект возникает, когда решения одной линии меняют условия другой.

## 16. Большой квест должен менять тип действия

[ИНСТРУМЕНТАРИЙ][D&D / DMG + KINGDOM SURVIVAL]

Помимо причинности проверяется ритм взаимодействия:

`разговор → исследование → решение маршрута → открытие → социальное столкновение → деятельное/боевое решение → последствие`.

Это не шаблон. Диагностический вопрос: **не повторяет ли игрок слишком долго один и тот же тип действия, когда конфликт естественно позволяет сменить форму?**

## 17. Ритм давления требует человеческих передышек

[ИНСТРУМЕНТАРИЙ][D&D / DMG 2024 + KINGDOM SURVIVAL]

Тёмный мир сильнее ощущается на фоне нормальной человеческой жизни. Ужин, ремонт, шутка, спокойная работа, короткий праздник, удачная охота, первый снег или поминовение без нового кризиса могут быть содержательными сценами, если раскрывают человека, отношения или ценность Дома/отряда.

Передышка не является филлером автоматически.

## 18. Целевой эффект лагеря — персональная память прохождения

[ИНСТРУМЕНТАРИЙ][KINGDOM SURVIVAL + D&D / DMG]

Главная проверка:

> **может ли короткий привал превратить системное событие в историю именно этого прохождения?**

Потеря бойца, найденная улика, тяжёлый выбор или спасённый человек должны иметь право получить человеческий след после основного события, чтобы игрок вспоминал не только цифру, но и собственное решение с последствиями.

## 19. Что сознательно не входит в утверждённую модель

Пользователь отдельно **не утвердил исходные пункты 6, 13 и 14** повторного DMG-разбора. Поэтому не вводятся:

- регулярное ручное назначение `кто стоит на часах` как повторяемая персонажная механика;
- системная долговременная физическая память каждого старого лагеря;
- маршрутные тайники/кладовые игрока.

Единичная авторская сцена похожего типа возможна только если конкретная история её требует; она не становится общей системой.

## 20. Производственная граница

До первого доказанного региона не проектировать заранее большой `Camp Manager`, буквальную D&D Bastion-систему, полноценную симуляцию жизни Дома или универсальный движок всех активных конфликтов.

Сначала доказать материал реальными сценами и состояниями первого региона. После этого архитектура может закреплять только повторяющиеся потребности, которые действительно возникли.
