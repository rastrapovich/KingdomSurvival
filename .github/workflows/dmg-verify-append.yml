name: DMG verify append
on:
  push:
    branches:
      - docs/dmg-final-verify
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/dmg-final-verify
      - name: Append approved travel and bestiary sections
        shell: bash
        run: |
          cat .github/dmg-travel-append.txt >> ProjectDocs/TRAVEL_ENCOUNTERS_ADAPTATION.md
          cat .github/dmg-bestiary-append.txt >> ProjectDocs/BESTIARY.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dmg-verify-append.yml .github/dmg-travel-append.txt .github/dmg-bestiary-append.txt .github/dmg-verify-trigger
          git add ProjectDocs/TRAVEL_ENCOUNTERS_ADAPTATION.md ProjectDocs/BESTIARY.md
          git diff --check
          git commit -m "temp: append verified DMG travel and bestiary sections"
          git push origin HEAD:docs/dmg-final-verify
