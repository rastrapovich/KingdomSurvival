name: Finalize Nikiforovsky status

on:
  push:
    branches:
      - work/nikiforovsky-status-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nikiforovsky-status-final
          fetch-depth: 0

      - name: Record integration commit in development status
        shell: bash
        run: |
          python .tmp_finalize_nikiforovsky_status.py
          rm .tmp_finalize_nikiforovsky_status.py
          rm .github/workflows/finalize-nikiforovsky-status.yml
          test "$(git diff --name-only -- ProjectDocs)" = 'ProjectDocs/DEVELOPMENT_STATUS.md'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectDocs/DEVELOPMENT_STATUS.md .tmp_finalize_nikiforovsky_status.py .github/workflows/finalize-nikiforovsky-status.yml
          git commit -m "docs: record Nikiforovsky integration commit"
          git push origin HEAD:work/nikiforovsky-status-final
