## Интеграция Basanavičius + Pamfile + Gerard — 05.09.2026

Пользователь утвердил пункты **3, 4, 5, 6, 8, 9, 10, 11, 12, 13 и 14** исследования балтийского и румынско-карпатского пограничного материала.

### Зафиксировано в `LORE.md`

- сверхъестественное богатство рекомендуется проверять на источник ресурса и соответствующую потерю другой стороны;
- простое внешнее копирование обряда объективно не воспроизводит эффект без необходимой связи, права, локуса, участника или условия;
- сверхъестественный дар может сохраняться только при соблюдении конкретного условия;
- `laumė / лаума` разрешена как рабочий балтийский культурный слой, связанный с водой, работой, временем, обращением и условием дара;
- для отдельной карпатской лесной сущности ответ на знакомый голос может устанавливать опасный контакт;
- `Muma Pădurii` не приравнивается автоматически к лешему: сходная территориальная функция не доказывает одну объективную сущность;
- Solomonar / Scholomance закреплены как рабочее народное объяснение происхождения знания хмарника, а не объективная академия магов;
- ложное мифологическое объяснение может сохранять правильное практическое предупреждение о природной опасности;
- ненайденное тело утопленника может удерживать незавершённость между погибшим, семьёй, водой и погребальным порядком;
- родовое право на конкретный клад разрешено как рабочая модель собственности/долга;
- «пойманная тень» в основании здания разрешена как рабочее верование и возможный источник конкретной связи, но не универсальная магия тени.

