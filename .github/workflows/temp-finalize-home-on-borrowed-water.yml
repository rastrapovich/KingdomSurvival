name: Finalize Home on Borrowed Water canon

on:
  push:
    branches:
      - temp/canonize-home-on-borrowed-water-20260906
    paths:
      - .github/workflows/temp-finalize-home-on-borrowed-water.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: temp/canonize-home-on-borrowed-water-20260906
          fetch-depth: 0

      - name: Preserve patch script and switch to exact main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/temp-finalize-home-on-borrowed-water.py /tmp/finalize.py
          git fetch origin main
          test "$(git rev-parse origin/main)" = "23766cec78eba2e98eff586b014a6607524ffc9d"
          git checkout -B main origin/main

      - name: Apply and validate approved final sync
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/finalize.py
          git diff --check
          printf '%s\n' \
            ProjectDocs/DEVELOPMENT_STATUS.md \
            ProjectDocs/LORE.md \
            ProjectDocs/NARRATIVE.md | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          test "$(find . -maxdepth 1 -type f -name 'KINGDOM_SURVIVAL_GAME_CONCEPT_CANON_RU_v*.md' | wc -l)" -eq 1
          grep -q 'Паводок повреждает плотину' ProjectDocs/NARRATIVE.md
          grep -q 'старым, проверенным и более дорогим способом' ProjectDocs/NARRATIVE.md
          grep -q 'рыбы' ProjectDocs/NARRATIVE.md
          grep -q 'утопленнице' ProjectDocs/NARRATIVE.md
          grep -q 'тяжёлого переселения' ProjectDocs/LORE.md
          grep -q 'обычая, запрета или суеверия' ProjectDocs/LORE.md
          grep -q 'Завершение канонизации «Дом на чужой воде»' ProjectDocs/DEVELOPMENT_STATUS.md

      - name: Commit and push main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rastrapovich"
          git config user.email "125567783+rastrapovich@users.noreply.github.com"
          git add ProjectDocs/NARRATIVE.md ProjectDocs/LORE.md ProjectDocs/DEVELOPMENT_STATUS.md
          git commit -m "docs: complete Home on Borrowed Water opening canon"
          git push origin HEAD:main
