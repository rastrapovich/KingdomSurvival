name: Integrate Witcher 3 narrative docs

on:
  push:
    paths:
      - '.github/workflows/integrate-witcher3-docs.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate approved narrative principles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          narrative_path = Path('ProjectDocs/NARRATIVE.md')
          status_path = Path('ProjectDocs/DEVELOPMENT_STATUS.md')
          workflow_path = Path('.github/workflows/integrate-witcher3-docs.yml')

          narrative = narrative_path.read_text(encoding='utf-8')

          source_anchor = "- `[DISCO ELYSIUM]` — приём, адаптированный из анализа диалогов, проверок, микрореактивности и персонажного письма `Disco Elysium`;"
          source_line = source_anchor + "\n- `[THE WITCHER 3]` — приём, адаптированный из структуры контрактов, расследований, подготовки, возврата к заказчику и отложенных последствий `The Witcher 3: Wild Hunt`;"
          if '[THE WITCHER 3]' not in narrative:
              if source_anchor not in narrative:
                  raise SystemExit('Source-label anchor not found')
              narrative = narrative.replace(source_anchor, source_line, 1)

          witcher_section = r'''
# 11B. Инструментарий The Witcher 3: расследования и заказы [ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + KINGDOM SURVIVAL]

Подробный разбор и границы переноса: `ProjectDocs/WITCHER_3_QUEST_ADAPTATION.md`.

`The Witcher 3` используется не как шаблон буквального «ведьмачьего контракта», а как источник методов, превращающих небольшое дело в самостоятельную историю. Буквальные `Witcher Senses`, универсальная доска заказов и формула `найти монстра → убить` не переносятся.

## 11B.1. Заказ как маленькая история

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3]

Рабочая цепь: `проблема → заинтересованная сторона → расследование → изменение первоначальной версии → решение → последствия`.

Даже небольшой заказ должен иметь собственный драматический вопрос и содержательное изменение ситуации, а не существовать только как повод для боя и награды.

## 11B.2. Расследование меняет понимание проблемы

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + KINGDOM SURVIVAL]

Хорошее расследование отвечает прежде всего на вопрос **«что здесь на самом деле произошло?»**, а не только «где находится цель?». Первоначальная версия должна хотя бы один раз существенно уточниться, развернуться или оказаться неполной.

Рекомендуемая диагностическая форма:

`ОЖИДАНИЕ → ПОДТВЕРЖДЕНИЕ → ПРОТИВОРЕЧИЕ → НАСТОЯЩАЯ ПРОБЛЕМА`.

Поворот не обязан отрицать сверхъестественное; сильнее, когда он меняет причинность, ответственность или доступные решения.

## 11B.3. Увидеть улику не значит понять её

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + DISCO ELYSIUM + KINGDOM SURVIVAL]

Факт отделяется от интерпретации. Охотник, воин, знающая женщина, местный житель и сам герой могут объяснять один след по-разному. Игрок собирает не только улики, но и **конкурирующие объяснения**.

Не вводить буквальный аналог постоянного «ведьмачьего зрения». След должен быть частью сцены и причинности, а не обязательным светящимся интерактивом.

## 11B.4. Три класса улик

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + KINGDOM SURVIVAL]

1. **Физические:** тело, кровь, следы, повреждения, предметы, почва, растения, остатки еды, следы огня, инструментов или борьбы.
2. **Человеческие:** показания, слухи, ложь, умолчание, страх, семейные отношения, долги, старые конфликты, интересы и выгодные версии.
3. **Мифологические:** обычай, запрет, календарное время, состояние места, обряд, поведение конкретной сущности, старый договор и различающиеся местные поверья.

Для большого расследования одна категория редко должна давать полную картину.

## 11B.5. Сначала правда события, потом улики

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + KINGDOM SURVIVAL]

Не проектировать расследование как произвольную цепочку `улика 1 → улика 2 → улика 3 → ответ`. Сначала установить, что объективно произошло, затем вывести естественные материальные, человеческие и мифологические следствия.

Формула: `причина → действие → последствия → наблюдаемые следы`.

Пропуск второстепенной улики не должен разрушать причинность истории.

## 11B.6. Заказчик сообщает версию, а не истину

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3]

Заказчик может искренне ошибаться, знать только часть событий, защищать близкого, верить слуху, бояться правды или сознательно лгать. Его ошибочная версия обязана вытекать из характера и положения, а не существовать только ради твиста.

## 11B.7. Знание меняет подготовку и действия

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + KINGDOM SURVIVAL]

Расследование ценно, когда знание открывает практический вариант: выбрать время, изменить состав похода, привести специалиста, подготовить предмет или обряд, выбрать маршрут, устроить засаду, начать переговоры, использовать табу, разоблачить ложь или избежать боя.

> **Новое действие или стратегия предпочтительнее простого числового бонуса к урону.**

## 11B.8. Состав отряда меняет расследование, но не запирает его

[ИНСТРУМЕНТАРИЙ][KINGDOM SURVIVAL + DISCO ELYSIUM]

Конкретные присутствующие спутники и специалисты могут раньше замечать детали, давать иной вывод, дополнительную реплику, проверку, снижение риска или альтернативный путь.

Обязательная граница уже утверждённого подхода: **отсутствие конкретного спутника не блокирует обязательную историю**.

## 11B.9. Изменение смысла важнее искусственного твиста

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3]

Не каждый заказ требует шокирующей развязки. Достаточно, чтобы по ходу расследования изменился смысл происходящего: кто действительно пострадал, кто несёт ответственность, какое правило действует или что на самом деле нужно решить.

## 11B.10. Не сводить финалы к «убить / пощадить»

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + KINGDOM SURVIVAL]

Допустимые формы решения: бой, обряд, переговоры, сделка, разоблачение человека, возвращение или уничтожение вещи, восстановление правила, изменение хозяйственного действия, переселение, отказ вмешиваться, передача проблемы другой стороне, сознательная ложь заказчику или уничтожение реально опасной сущности без обязательной моральной дилеммы.

Моральная неоднозначность не должна становиться новым шаблоном.

## 11B.11. Возвращение к заказчику — отдельная сцена

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3]

После решения значимого дела полезно дать игроку столкнуться с реакцией стороны, которая его запустила: рассказать правду, скрыть часть, назвать виновного, отказаться от награды, изменить обещание или передать ответственность.

`цель устранена → награда → конец` — слабая форма для большого расследования.

## 11B.12. Значимость состояний важнее количества концовок

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + KINGDOM SURVIVAL]

Для одиночного проекта предпочтительнее 2–3 действительно различных итоговых состояния, чем множество поверхностных веток. Итог оценивается по тому, изменился ли человек, отношение, место, маршрут, хозяйство, доступ к знанию, безопасность, состояние сущности, региона или Дома.

## 11B.13. Последствие может проявиться позже

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + KINGDOM SURVIVAL]

Не объяснять все последствия немедленно. Сильный эффект возникает, когда через время игрок сам узнаёт связь между новым состоянием мира и старым решением. Отложенный эффект может одновременно давать выгоду и новую цену, а не быть скрытым наказанием.

## 11B.14. У одного дела может быть несколько входов

[ИНСТРУМЕНТАРИЙ][THE WITCHER 3 + FALLOUT 2 + KINGDOM SURVIVAL]

Одна история может начаться через заказчика, сход, объявление, слух, корчму, торговца, путника, найденное тело, разрушенный объект, след на глобальной карте, знакомого NPC или последствия прошлого решения.

Игрок может встретить последствия **до официальной постановки задачи**. Это поддерживает каноническую глобальную карту как пространство приключения.

## 11B.15. Не копировать универсальную доску заказов

[ИНСТРУМЕНТАРИЙ][KINGDOM SURVIVAL]

Доска объявлений допустима как локальная деталь крупного поселения, но не как универсальный интерфейс. Предпочтительные источники проблем: `староста / сход / корчма / торговец / путник / родственник / письмо / слух / Хроника / найденное событие / физический след`.

Задача должна ощущаться проблемой мира, а не кнопкой `взять квест`.

## 11B.16. «Дело» как рабочая форма [РАБОЧЕЕ][THE WITCHER 3 + DISCO ELYSIUM + KINGDOM SURVIVAL]

Рабочее название расследовательной записи — **«Дело»**. Оно шире платного заказа: может возникнуть из долга, просьбы, личного интереса героя, найденного следа, угрозы Дому или случайного события.

В `Хронике` дело может хранить не чек-лист, а состояние знания:

- **Известно** — подтверждённые факты;
- **Сведения** — собранные наблюдения и показания;
- **Версии** — конкурирующие объяснения;
- **Не выяснено** — открытые вопросы.

`Дело` пока **не является утверждённой UI/quest-системой**. Код и финальный интерфейс отложены до доказанного первого большого квеста.

## 11B.17. Рабочий эталон большого побочного расследования [РАБОЧЕЕ]

Не обязательный чек-лист, а диагностическая структура:

1. **Слух / проблема** — игрок узнаёт о нарушении состояния мира.
2. **Заказчик / заинтересованная сторона** — первоначальная версия, мотив и цена.
3. **Вопрос** — что здесь произошло?
4. **Первые улики** — наблюдаемые факты.
5. **Первая версия** — правдоподобное объяснение.
6. **Противоречие** — факт, который не укладывается в версию.
7. **Расширение расследования** — дополнительное место, человек, обычай, история или след.
8. **Настоящая проблема** — достаточное понимание причинности для решения.
9. **Подготовка** — знание меняет состав, время, предметы, маршрут, риск, переговоры или тактику.
10. **Решение** — содержательное действие игрока.
11. **Возвращение** — реакция заинтересованной стороны.
12. **Последствие** — новое состояние мира.
13. **Отложенное эхо** — позднее возвращение результата через людей, место, регион или Дом.

Малый заказ может быть короче: `проблема → 1–2 улики → изменение понимания → решение → короткое последствие`.

### Производственная граница

Сначала проектируется реальный первый большой квест и проверяется, какие элементы этой структуры действительно нужны. Только после этого допускается проектирование универсальной quest/dialogue-архитектуры, флагов, UI и проверок.

---
'''

          if '# 11B. Инструментарий The Witcher 3:' not in narrative:
              anchor = '\n# 12.'
              if anchor not in narrative:
                  raise SystemExit('Section 12 anchor not found')
              narrative = narrative.replace(anchor, '\n' + witcher_section + '\n# 12.', 1)

          journal_row = '| 05.09.2026 | Пакет `The Witcher 3` по расследованиям и заказам утверждён: заказ как маленькая история, изменение первоначальной версии, три класса улик, конкурирующие интерпретации, подготовка через знание, влияние состава отряда без блокировки, разные формы решения, возвращение к заказчику, ограниченное число значимых состояний, отложенное эхо и несколько входов в одно дело добавлены в инструментарий; «Дело» и 13-шаговый эталон сохранены как `[РАБОЧЕЕ]`. Подробности: `WITCHER_3_QUEST_ADAPTATION.md`. | ИНСТРУМЕНТАРИЙ / РАБОЧЕЕ |'
          if journal_row not in narrative:
              journal_anchor = '\n---\n\n# 29. Следующий нарративный этап'
              if journal_anchor not in narrative:
                  raise SystemExit('Narrative journal anchor not found')
              narrative = narrative.replace(journal_anchor, '\n' + journal_row + journal_anchor, 1)

          narrative_path.write_text(narrative, encoding='utf-8')

          status = status_path.read_text(encoding='utf-8')
          status_entry = '''**Документальная интеграция 05.09.2026 — `The Witcher 3`, расследования и заказы:** создан `ProjectDocs/WITCHER_3_QUEST_ADAPTATION.md`; в `NARRATIVE.md` добавлен `[ИНСТРУМЕНТАРИЙ][THE WITCHER 3]` для контрактов как маленьких историй, расследований с изменением первоначальной версии, трёх классов улик, конкурирующих интерпретаций, причинно выведенных следов, ошибающегося заказчика, подготовки через знание, влияния состава экспедиции без жёсткой блокировки, разнообразных решений, возврата к заказчику, ограниченного числа значимых состояний, отложенных последствий и нескольких входов в одно дело. Рабочая форма `«Дело»` и 13-шаговый эталон большого расследования сохранены как `[РАБОЧЕЕ]`, а не как готовая UI/quest-система. Универсальная quest/dialogue-архитектура по-прежнему отложена до первого доказанного большого квеста. Код, сцены, ассеты, пакеты, ProjectSettings, `LORE.md`, `BESTIARY.md` и общий игровой канон v1.26 на этом шаге не менялись.'''
          if status_entry not in status:
              status_anchor = '\n---\n\nГлавный следующий дизайн-приоритет не меняется:'
              if status_anchor not in status:
                  raise SystemExit('Development-status anchor not found')
              status = status.replace(status_anchor, '\n\n' + status_entry + status_anchor, 1)
          status_path.write_text(status, encoding='utf-8')

          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Validate document changes
        shell: bash
        run: |
          git diff --check
          grep -F '# 11B. Инструментарий The Witcher 3:' ProjectDocs/NARRATIVE.md
          grep -F '«Дело» как рабочая форма' ProjectDocs/NARRATIVE.md
          grep -F 'WITCHER_3_QUEST_ADAPTATION.md' ProjectDocs/DEVELOPMENT_STATUS.md
          test -f ProjectDocs/WITCHER_3_QUEST_ADAPTATION.md
          test ! -f .github/workflows/integrate-witcher3-docs.yml

      - name: Commit integrated documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProjectDocs/NARRATIVE.md ProjectDocs/DEVELOPMENT_STATUS.md .github/workflows/integrate-witcher3-docs.yml
          git commit -m 'docs: integrate Witcher 3 investigation principles'
          git push origin HEAD:main
